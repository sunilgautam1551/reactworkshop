            <h3>useInterval and useTimeout — Declarative Timers</h3>
            <p>Dan Abramov's canonical pattern for using timers correctly with hooks. The key insight: interval callbacks must always reference the latest version of their dependencies without re-creating the interval.</p>
            ${code(
              "jsx",
              `function useInterval(callback, delay) {
  const savedCallback = useRef(callback);

  // Always keep ref pointing to latest callback
  useEffect(() => {
    savedCallback.current = callback;
  }, [callback]);

  useEffect(() => {
    // null delay = pause the interval
    if (delay === null) return;

    const id = setInterval(() => {
      savedCallback.current(); // always calls latest version
    }, delay);

    return () => clearInterval(id);
  }, [delay]); // only re-create interval when delay changes
}

function useTimeout(callback, delay) {
  const savedCallback = useRef(callback);

  useEffect(() => {
    savedCallback.current = callback;
  }, [callback]);

  useEffect(() => {
    if (delay === null) return;
    const id = setTimeout(() => savedCallback.current(), delay);
    return () => clearTimeout(id);
  }, [delay]);

// Usage — auto-advancing slideshow
function Slideshow({ slides }) {
  const [index, setIndex] = useState(0);
  const [paused, setPaused] = useState(false);

    paused ? null : 3000 // null pauses the interval

    <div>
      <img src={slides[index].url} alt={slides[index].title} />
      <button onClick={() => setPaused(p => !p)}>
        {paused ? 'Play' : 'Pause'}
      </button>
    </div>
  );
}`,

            <h3>useIsomorphicLayoutEffect — SSR-Safe Layout Effects</h3>
            <p>The standard pattern from every component library for using layout effects without SSR warnings:</p>
            ${code(
              "jsx",
              `// useIsomorphicLayoutEffect.js
import { useEffect, useLayoutEffect } from 'react';

// On the server: typeof window === 'undefined' -> use useEffect (no DOM, no warning)
// On the client: typeof window !== 'undefined' -> use useLayoutEffect (correct timing)
export const useIsomorphicLayoutEffect =
  typeof window !== 'undefined' ? useLayoutEffect : useEffect;

// Usage in a library component
function Tooltip({ children, content }) {
  const ref = useRef(null);
  const [position, setPosition] = useState({ top: 0, left: 0 });

  useIsomorphicLayoutEffect(() => {
    // Safe to use — no SSR warning, correct timing on client
    const rect = ref.current?.getBoundingClientRect();
    if (rect) setPosition({ top: rect.bottom, left: rect.left });
  });

  return <div ref={ref}>{children}</div>;
}`,
            )}

            <h2>Testing Custom Hooks — renderHook</h2>
            <p>Custom hooks can be tested in complete isolation using renderHook from React Testing Library — no component rendering required, no UI to query.</p>
            ${code(
              "jsx",
              `import { renderHook, act, waitFor } from '@testing-library/react';
import { useDebounce } from './useDebounce';
import { useFetch } from './useFetch';
import { useLocalStorage } from './useLocalStorage';

// Testing useDebounce
describe('useDebounce', () => {
  beforeEach(() => jest.useFakeTimers());
  afterEach(() => jest.useRealTimers());

  it('returns initial value immediately', () => {
    const { result } = renderHook(() => useDebounce('hello', 500));
    expect(result.current).toBe('hello');
  });

  it('does not update before delay expires', () => {
    const { result, rerender } = renderHook(
      ({ value }) => useDebounce(value, 500),
      { initialProps: { value: 'hello' } }
    );

    rerender({ value: 'world' });
    jest.advanceTimersByTime(300); // less than delay
    expect(result.current).toBe('hello'); // still old value
  });

  it('updates after delay expires', () => {
    const { result, rerender } = renderHook(
      ({ value }) => useDebounce(value, 500),
      { initialProps: { value: 'hello' } }
    );

    rerender({ value: 'world' });
    act(() => jest.advanceTimersByTime(500)); // delay expires
    expect(result.current).toBe('world');
  });

  it('resets delay when value changes rapidly', () => {
    const { result, rerender } = renderHook(
      ({ value }) => useDebounce(value, 500),
      { initialProps: { value: 'a' } }
    );

    rerender({ value: 'ab' });
    jest.advanceTimersByTime(300);
    rerender({ value: 'abc' });   // resets the timer
    jest.advanceTimersByTime(300);
    expect(result.current).toBe('a'); // still not updated — timer reset

    act(() => jest.advanceTimersByTime(200)); // total 500ms from last change
    expect(result.current).toBe('abc');
  });
});

describe('useFetch', () => {
  it('starts in loading state', () => {
    global.fetch = jest.fn(() => new Promise(() => {})); // never resolves

    const { result } = renderHook(() => useFetch('/api/data'));
    expect(result.current.loading).toBe(true);
    expect(result.current.data).toBe(null);
    expect(result.current.error).toBe(null);
  });

  it('returns data on successful fetch', async () => {
    const mockData = [{ id: 1, name: 'Alice' }];
    global.fetch = jest.fn(() =>
      Promise.resolve({
        ok: true,
        json: () => Promise.resolve(mockData),
        headers: { get: () => 'application/json' },
      })
    );

    const { result } = renderHook(() => useFetch('/api/users'));

    await waitFor(() => {
      expect(result.current.loading).toBe(false);
    });

    expect(result.current.data).toEqual(mockData);
    expect(result.current.error).toBe(null);
  });

  it('returns error on failed fetch', async () => {
    global.fetch = jest.fn(() =>
      Promise.resolve({ ok: false, status: 404 })
    );

    const { result } = renderHook(() => useFetch('/api/missing'));

    await waitFor(() => {
      expect(result.current.loading).toBe(false);
    });

    expect(result.current.error).toBe('HTTP error: 404');
    expect(result.current.data).toBe(null);
  });

  it('cancels fetch when url changes', async () => {
    const abortSpy = jest.fn();
    global.fetch = jest.fn(() => {
      return {
        signal: { addEventListener: jest.fn(), aborted: false },
        ok: true,
        json: () => Promise.resolve({}),
      };
    });

    const controller = { abort: abortSpy, signal: {} };
    jest.spyOn(global, 'AbortController').mockImplementation(() => controller);

    const { rerender } = renderHook(
      ({ url }) => useFetch(url),
      { initialProps: { url: '/api/a' } }
    );

    rerender({ url: '/api/b' });
    expect(abortSpy).toHaveBeenCalledTimes(1);
  });
});

  it('returns initial value when localStorage is empty', () => {
    const { result } = renderHook(() => useLocalStorage('key', 'default'));
    expect(result.current[0]).toBe('default');

    expect(result.current[0]).toBe('stored');

    const { result } = renderHook(() => useLocalStorage('key', 'initial'));

      result.current[1]('updated');
    });

    expect(localStorage.getItem('key')).toBe('"updated"');
  });

            <h2>Composing Custom Hooks</h2>
            <p>The real power of custom hooks is composability — hooks calling other hooks to build higher-level abstractions.</p>
            ${code(
              "jsx",
              `// Low-level: debounced value
function useDebounce(value, delay) { /* ... */ }

// Low-level: fetch with abort
function useFetch(url) { /* ... */ }

// Mid-level: composed from low-level hooks
function useDebouncedSearch(query, delay = 300) {
  const debouncedQuery = useDebounce(query, delay);
  const { data, loading, error } = useFetch(
    debouncedQuery ? \`/api/search?q=\${encodeURIComponent(debouncedQuery)}\` : null
  );

  return {
    results: data ?? [],
    loading,
    error,
    isSearching: loading && Boolean(debouncedQuery),
    hasQuery: Boolean(debouncedQuery),
  };
}

// High-level: specific domain hook built from mid-level
function useProductSearch() {
  const [query, setQuery] = useState('');
  const [category, setCategory] = useState('all');
  const { results, loading, error } = useDebouncedSearch(query);

  const filteredResults = useMemo(
    () => category === 'all'
      ? results
      : results.filter(p => p.category === category),
    [results, category]
  );

  return {
    query,
    setQuery,
    category,
    setCategory,
    results: filteredResults,
    loading,
    error,
  };
}

// Component is now a pure UI expression
function ProductSearchPage() {
  const { query, setQuery, category, setCategory, results, loading } =
    useProductSearch();

  return (
    <div>
      <SearchInput value={query} onChange={setQuery} />
      <CategoryFilter value={category} onChange={setCategory} />
      {loading ? <Spinner /> : <ProductGrid products={results} />}
    </div>
  );
}`,

            <h2>The useReducer + Context Custom Hook Pattern</h2>
            <p>One of the highest-value patterns in React — combining useReducer and useContext into a custom hook that provides a clean, typed API over a feature's state:</p>
            ${code(
              "jsx",
              `// cart.context.jsx — complete self-contained cart feature
const CartStateCtx    = createContext(null);
const CartDispatchCtx = createContext(null);

function cartReducer(state, action) {
  switch (action.type) {
    case 'item/add': {
      const existing = state.items.find(i => i.id === action.item.id);
      return existing
        ? { ...state, items: state.items.map(i =>
            i.id === action.item.id
              ? { ...i, quantity: i.quantity + 1 }
              : i
          )}
        : { ...state, items: [...state.items, { ...action.item, quantity: 1 }] };
    }
    case 'item/remove':
      return { ...state, items: state.items.filter(i => i.id !== action.id) };
    case 'item/clear':
      return { ...state, items: [] };
    default:
      throw new Error(\`Unknown cart action: \${action.type}\`);
  }
}

export function CartProvider({ children }) {
  const [state, dispatch] = useReducer(cartReducer, { items: [] });
  return (
    <CartDispatchCtx.Provider value={dispatch}>
      <CartStateCtx.Provider value={state}>
        {children}
      </CartStateCtx.Provider>
    </CartDispatchCtx.Provider>
  );
}

// Public API — components only import these hooks, never the contexts
export function useCart() {
  const state = useContext(CartStateCtx);
  if (!state) throw new Error('useCart must be inside CartProvider');

  // Derive useful values from raw state
  const itemCount = state.items.reduce((sum, i) => sum + i.quantity, 0);
  const total = state.items.reduce((sum, i) => sum + i.price * i.quantity, 0);

  return { items: state.items, itemCount, total };
}

export function useCartActions() {
  const dispatch = useContext(CartDispatchCtx);
  if (!dispatch) throw new Error('useCartActions must be inside CartProvider');

  // Return stable action creators — dispatch reference never changes
  return useMemo(() => ({
    addItem: (item) => dispatch({ type: 'item/add', item }),
    removeItem: (id) => dispatch({ type: 'item/remove', id }),
    clearCart: () => dispatch({ type: 'item/clear' }),
  }), [dispatch]);
}`,
            )}
            <p>The split between useCart (state) and useCartActions (dispatch) is the same pattern from Chapter 6 — components that only dispatch never re-render due to state changes.</p>

            <h2>The "Latest Callback" Ref Pattern</h2>
            <p>A senior-level pattern that appears in event systems, animation loops, and stable callbacks — keeping a function reference stable while always executing the latest version:</p>
            ${code(
              "jsx",
              `// Problem: useCallback with many deps is fragile
// Add a new dep and forget it — stale closure
// The latest-ref pattern solves this permanently

function useStableCallback(callback) {
  const callbackRef = useRef(callback);

  // Keep ref updated to latest callback after every render
  useLayoutEffect(() => {
    callbackRef.current = callback;
  });
  // useLayoutEffect (not useEffect) ensures the ref is updated
  // before any child's useLayoutEffect reads it

  // Return a stable function that always calls the latest callback
  return useCallback((...args) => {
    return callbackRef.current(...args);
  }, []); // empty deps — this function never changes identity
}

// Usage: event handlers that need to be stable but always current
function DataGrid({ onRowClick, onSort }) {
  const stableRowClick = useStableCallback(onRowClick);
  const stableSort = useStableCallback(onSort);

  // Pass to virtualized list — stable refs prevent re-mounting 1000 rows
  return (
    <VirtualList
      onRowClick={stableRowClick}
      onSort={stableSort}
    />
  );
}`,
            )}
            <p>This is strictly better than useCallback with a dependency list in cases where the callback changes frequently (like an inline arrow function from the parent). The ref pattern gives you a stable reference with zero dep management.</p>

            <h2>Why Patterns Matter at the Senior Level</h2>
            <p>Junior developers learn how to use React components. Senior developers learn how to design them — making choices that determine whether a component is used once and discarded, or lives in a design system and serves dozens of use cases over years.</p>
            <p>The patterns in this chapter are not academic. They are the architectural decisions you make when building a dropdown, a modal, a form field, or a data table that needs to work across contexts you haven't imagined yet. Getting these decisions right means the difference between a component people reach for and one they work around.</p>

            ${reads(

            <h2>Higher-Order Components — What They Were Solving</h2>
            <p>Before hooks, sharing stateful logic between components had one primary mechanism: Higher-Order Components. An HOC is a function that takes a component and returns a new component with additional props or behavior injected.</p>
            ${code(
              "jsx",
              `// The HOC pattern — wraps a component, injects props
function withAuth(WrappedComponent) {
  return function AuthenticatedComponent(props) {
    const [user, setUser] = useState(null);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
      getCurrentUser().then(u => {
        setUser(u);
        setLoading(false);
      });
    }, []);

    if (loading) return <Spinner />;
    if (!user) return <Redirect to="/login" />;

    // Inject the user prop into the wrapped component
    return <WrappedComponent {...props} user={user} />;
  };
}

// Usage
const ProtectedDashboard = withAuth(Dashboard);
// ProtectedDashboard gets a \`user\` prop injected automatically`,
            )}
            <p>HOCs worked but produced serious practical problems:</p>
            <p><strong>Prop collision:</strong> if Dashboard already had a user prop, the HOC's injected user prop silently overwrote it.</p>
            <p><strong>Wrapper hell:</strong> stacking multiple HOCs nested components deeply:</p>
            ${code(
              "jsx",
              `const Enhanced = withAuth(withTheme(withAnalytics(withLogging(Dashboard))));
// Four extra wrapper components in the DevTools tree
// Impossible to trace which HOC injected which prop`,
            )}
            <p><strong>Source opacity:</strong> when a bug occurred, it was hard to know which HOC was responsible for which prop.</p>
            <p><strong>TypeScript friction:</strong> typing HOC chains was genuinely difficult — the types needed to thread through every wrapper correctly.</p>
            <h2>Render Props — Sharing Logic Through Functions</h2>
            <p>Render props were the other pre-hooks mechanism. Instead of injecting props, a component accepted a function as a prop and called it with data:</p>
            ${code(
              "jsx",
              `class MouseTracker extends React.Component {
  state = { x: 0, y: 0 };

  handleMouseMove = (e) => {
    this.setState({ x: e.clientX, y: e.clientY });
  };

  render() {
    return (
      <div onMouseMove={this.handleMouseMove}>
        {/* Call the render prop function with current state */}
        {this.props.render(this.state)}
      </div>
    );
  }
}

// Usage
<MouseTracker
  render={({ x, y }) => (
    <p>Mouse at {x}, {y}</p>
  )}
/>`,

            <h2>Compound Components — The Most Important Pattern</h2>
            <p>Compound components is the pattern that makes component APIs feel native — like they belong in React itself. It's how <code>&lt;select&gt;</code> and <code>&lt;option&gt;</code>, <code>&lt;table&gt;</code> and <code>&lt;tr&gt;</code>, <code>&lt;form&gt;</code> and <code>&lt;input&gt;</code> relate to each other.</p>

                <li class="ctx-node">Consumer usage — reads like HTML: &lt;Tabs&gt;&lt;TabList&gt;&lt;Tab id="a"&gt;One&lt;/Tab&gt;&lt;/TabList&gt;&lt;TabPanel id="a"&gt;Content&lt;/TabPanel&gt;&lt;/Tabs&gt;</li>
              </ul>

                <div class="ctx-note ok">No activeTab prop passed anywhere — shared entirely through context</div>

            <h3>Building Compound Components — A Complete Tabs Implementation</h3>
            ${code(
              "tsx",
              `// tabs.context.ts
type TabsContextValue = {
  activeTab: string;
  setActiveTab: (id: string) => void;
};

const TabsContext = createContext<TabsContextValue | null>(null);

function useTabsContext() {
  const ctx = useContext(TabsContext);
  if (!ctx) throw new Error('Tab components must be used within <Tabs>');
  return ctx;
}

// tabs.tsx — the full compound component set
function Tabs({
  children,
  defaultTab,
  onChange,
}: {
  children: ReactNode;
  defaultTab: string;
  onChange?: (tab: string) => void;
}) {
  const [activeTab, setActiveTab] = useState(defaultTab);

  const handleTabChange = useCallback((id: string) => {
    setActiveTab(id);
    onChange?.(id);
  }, [onChange]);

  return (
    <TabsContext.Provider value={{ activeTab, setActiveTab: handleTabChange }}>
      {children}
    </TabsContext.Provider>
  );
}

function TabList({ children }: { children: ReactNode }) {
  return (
    <div role="tablist" className="tab-list">
      {children}
    </div>
  );
}

function Tab({ id, children, disabled }: {
  id: string;
  children: ReactNode;
  disabled?: boolean;
}) {
  const { activeTab, setActiveTab } = useTabsContext();
  const isActive = activeTab === id;

  return (
    <button
      role="tab"
      aria-selected={isActive}
      aria-controls={\`panel-\${id}\`}
      id={\`tab-\${id}\`}
      disabled={disabled}
      onClick={() => !disabled && setActiveTab(id)}
      className={isActive ? 'tab tab--active' : 'tab'}
    >
      {children}
    </button>
  );
}

function TabPanel({ id, children }: { id: string; children: ReactNode }) {
  const { activeTab } = useTabsContext();

  if (activeTab !== id) return null;

  return (
    <div
      role="tabpanel"
      id={\`panel-\${id}\`}
      aria-labelledby={\`tab-\${id}\`}
      className="tab-panel"
    >
      {children}
    </div>
  );
}

// Attach sub-components to parent for clean import
Tabs.List  = TabList;
Tabs.Tab   = Tab;
Tabs.Panel = TabPanel;

// Usage — reads like native HTML, infinitely composable
function Settings() {
  return (
    <Tabs defaultTab="profile" onChange={tab => analytics.track(tab)}>
      <Tabs.List>
        <Tabs.Tab id="profile">Profile</Tabs.Tab>
        <Tabs.Tab id="security">Security</Tabs.Tab>
        <Tabs.Tab id="billing" disabled>Billing</Tabs.Tab>
      </Tabs.List>

      <Tabs.Panel id="profile"><ProfileForm /></Tabs.Panel>
      <Tabs.Panel id="security"><SecurityForm /></Tabs.Panel>
      <Tabs.Panel id="billing"><BillingForm /></Tabs.Panel>
    </Tabs>
  );
}`,
            )}
            <p>The Tabs.List = TabList pattern attaches sub-components as properties of the parent. This gives consumers a single import (import { Tabs } from './tabs') and a namespace that makes the relationship between components self-documenting.</p>

            <h2>Headless Components — Logic Without Opinion</h2>
            <p>A headless component provides all the behavior, state, and accessibility of a UI primitive — with zero visual opinion. The consumer renders whatever UI they want. This is the pattern behind Radix UI, Headless UI, and React Aria.</p>
            ${code(
              "tsx",
              `// Headless Disclosure — handles open/close logic and accessibility
// No CSS, no classes, no visual styling whatsoever
function Disclosure({ children }: { children: ReactNode }) {
  const [isOpen, setIsOpen] = useState(false);
  const id = useId();

  return (
    <>
      {children({
        isOpen,
        buttonProps: {
          onClick: () => setIsOpen(o => !o),
          'aria-expanded': isOpen,
          'aria-controls': id,
        },
        panelProps: {
          id,
          hidden: !isOpen,
          role: 'region',
        },
      })}
    </>
  );
}

// Consumer 1 — renders an FAQ accordion
function FAQ({ question, answer }) {
  return (
    <Disclosure>
      {({ isOpen, buttonProps, panelProps }) => (
        <div className="faq-item">
          <h3>
            <button {...buttonProps} className="faq-question">
              {question}
              <span>{isOpen ? '−' : '+'}</span>
            </button>
          </h3>
          <div {...panelProps} className="faq-answer">
            <p>{answer}</p>
          </div>
        </div>
      )}
    </Disclosure>
  );
}

// Consumer 2 — renders a sidebar filter panel
function FilterPanel({ title, children }) {
  return (
    <Disclosure>
      {({ isOpen, buttonProps, panelProps }) => (
        <aside className="filter-panel">
          <button {...buttonProps} className="filter-toggle">
            {title}
            <ChevronIcon direction={isOpen ? 'up' : 'down'} />
          </button>
          <div {...panelProps} className="filter-content">
            {children}
          </div>
        </aside>
      )}
    </Disclosure>
  );
}`,

            <p>The modern version of this pattern uses hook-based headless components — returning state and props rather than using render prop functions:</p>
            ${code(
              "tsx",
              `// Modern headless pattern — hook instead of render prop
function useDisclosure(defaultOpen = false) {
  const [isOpen, setIsOpen] = useState(defaultOpen);
  const id = useId();

  const toggle = useCallback(() => setIsOpen(o => !o), []);
  const open   = useCallback(() => setIsOpen(true),    []);
  const close  = useCallback(() => setIsOpen(false),   []);

  return {
    isOpen,
    toggle,
    open,
    close,
    buttonProps: {
      onClick: toggle,
      'aria-expanded': isOpen,
      'aria-controls': id,
    } as const,
    panelProps: {
      id,
      hidden: !isOpen,
    } as const,
  };
}

// Usage — clean, composable, no wrapper nesting
function FAQ({ question, answer }) {
  const { isOpen, buttonProps, panelProps } = useDisclosure();

  return (
    <div className="faq-item">
      <button {...buttonProps}>{question}</button>
      <div {...panelProps}>{answer}</div>
    </div>
  );
}`,
            )}

            <h2>Controlled vs Uncontrolled Components — The Full Model</h2>
            <p>This is the most misunderstood pattern in React. Most developers think of it as "inputs with value props vs without value props." The senior model is broader: it applies to any component that manages state that a parent might want to own.</p>
            <p>The spectrum:</p>
            ${code(
              "txt",
              `Fully uncontrolled          Partially controlled         Fully controlled
       |                           |                           |
State lives entirely          Some state internal,        All state owned
inside component              some state external          by parent
       |                           |                           |
useRef(null) form field     defaultValue input          value + onChange input
Tabs with defaultTab        Tabs with defaultTab          Tabs with activeTab
                            + onChange callback           + onChange (no default)`,
            )}
            <h3>The pattern for building both modes simultaneously</h3>
            <p>The senior technique: use value ?? internalValue to support both modes from one implementation.</p>
            ${code(
              "tsx",
              `type TabsProps = {
  children: ReactNode;
  defaultTab?: string;     // uncontrolled — initial value only
  activeTab?: string;      // controlled — parent owns value
  onChange?: (tab: string) => void;
};

function Tabs({ children, defaultTab = '', activeTab, onChange }: TabsProps) {
  // Internal state for uncontrolled mode
  const [internalTab, setInternalTab] = useState(defaultTab);

  // If activeTab prop is provided -> controlled mode (use parent's value)
  // If not -> uncontrolled mode (use internal state)
  const isControlled = activeTab !== undefined;
  const currentTab   = isControlled ? activeTab : internalTab;

  const handleTabChange = useCallback((id: string) => {
    // In uncontrolled mode: update internal state
    if (!isControlled) setInternalTab(id);
    // In both modes: call onChange if provided
    onChange?.(id);
  }, [isControlled, onChange]);

  return (
    <TabsContext.Provider value={{ activeTab: currentTab, setActiveTab: handleTabChange }}>
      {children}
    </TabsContext.Provider>
  );
}

// Uncontrolled usage — Tabs manages its own state
<Tabs defaultTab="profile">
  <Tabs.Tab id="profile">Profile</Tabs.Tab>
  <Tabs.Tab id="security">Security</Tabs.Tab>
</Tabs>

// Controlled usage — parent manages state
const [tab, setTab] = useState('profile');
<Tabs activeTab={tab} onChange={setTab}>
  <Tabs.Tab id="profile">Profile</Tabs.Tab>
  <Tabs.Tab id="security">Security</Tabs.Tab>
</Tabs>`,
            )}
            <p>This pattern — supporting both modes from one implementation — is what every design system component does. It's why Radix UI and MUI primitives accept both value and defaultValue.</p>
            <h3>The warning React gives when you mix them</h3>
            ${code(
              "jsx",
              `// ❌ React warns: switching between controlled and uncontrolled
// Start uncontrolled
<input value={undefined} onChange={handler} />
// Later pass a value
<input value="hello" onChange={handler} />
// "Warning: A component is changing an uncontrolled input to be controlled"

// The fix: always provide value (controlled) or never provide it (uncontrolled)
// If you need both modes, use the ?? pattern shown above`,
            )}

            <h2>Render Props — Still Relevant, Different Form</h2>
            <p>Render props did not die with hooks. They survive in one specific use case: when a component needs to inject dynamic rendering at a specific point — not just state, but actual JSX — into a parent that doesn't know what to render.</p>
            ${code(
              "tsx",
              `// DataTable with pluggable cell rendering
type Column<T> = {
  key: keyof T;
  header: string;
  // Render prop — consumer controls cell appearance
  render?: (value: T[keyof T], row: T) => ReactNode;
};

function DataTable<T extends { id: string }>({
  data,
  columns,
  emptyState,
}: {
  data: T[];
  columns: Column<T>[];
  emptyState?: ReactNode; // another form of render injection
}) {
  if (data.length === 0) {
    return <>{emptyState ?? <p>No data</p>}</>;
  }

  return (
    <table>
      <thead>
        <tr>{columns.map(col => <th key={String(col.key)}>{col.header}</th>)}</tr>
      </thead>
      <tbody>
        {data.map(row => (
          <tr key={row.id}>
            {columns.map(col => (
              <td key={String(col.key)}>
                {col.render
                  ? col.render(row[col.key], row) // render prop called here
                  : String(row[col.key])}
              </td>
            ))}
          </tr>
        ))}
      </tbody>
    </table>
  );
}

// Usage — consumer controls rendering of specific cells
<DataTable
  data={users}
  columns={[
    { key: 'name', header: 'Name' },
    {
      key: 'status',
      header: 'Status',
      render: (value) => (
        <Badge variant={value === 'active' ? 'success' : 'warning'}>
          {value}
        </Badge>
      ),
    },
    {
      key: 'id',
      header: 'Actions',
      render: (_, row) => (
        <button onClick={() => deleteUser(row.id)}>Delete</button>
      ),
    },
  ]}
  emptyState={<EmptyUsersIllustration />}
/>`,
            )}
            <p>The render prop per column and the emptyState prop are both render props — functions or nodes that inject consumer-controlled JSX into a generic component's structure. This is genuinely better than alternatives (slots, multiple components) for this particular use case.</p>

            <h2>The Provider Pattern — Context with a Custom Hook</h2>
            <p>This pattern belongs in every design system and application architecture toolkit. It takes the raw Context API and gives it a clean, safe, typed interface.</p>
            ${code(
              "tsx",
              `// Generic provider factory — creates provider + hook from any value
function createContext<T>(
  displayName: string,
  defaultValue?: T
) {
  const Context = React.createContext<T | undefined>(defaultValue);
  Context.displayName = displayName;

  function Provider({ children, value }: { children: ReactNode; value: T }) {
    return <Context.Provider value={value}>{children}</Context.Provider>;
  }

  function useValue(): T {
    const value = useContext(Context);
    if (value === undefined) {
      throw new Error(\`use\${displayName} must be used within \${displayName}Provider\`);
    }
    return value;
  }

  return [Provider, useValue] as const;
}

// Usage — creating a typed context in one line
const [ThemeProvider, useTheme] = createContext<Theme>('Theme');
const [AuthProvider, useAuth]   = createContext<AuthState>('Auth');

// Composing providers
function AppProviders({ children }: { children: ReactNode }) {
  const [theme] = useState<Theme>({ mode: 'light', accent: 'blue' });
  const [auth]  = useState<AuthState>({ user: null, status: 'idle' });

  return (
    <ThemeProvider value={theme}>
      <AuthProvider value={auth}>
        {children}
      </AuthProvider>
    </ThemeProvider>
  );
}`,
            )}

            <h2>Polymorphic Components — The as Prop</h2>
            <p>Polymorphic components render as different HTML elements or components while keeping the same props. This is a design system primitive — a Button that can render as <code>&lt;a&gt;</code>, <code>&lt;button&gt;</code>, or a router <code>&lt;Link&gt;</code>:</p>
            ${code(
              "tsx",
              `// The polymorphic component type utilities
type AsProp<C extends ElementType> = { as?: C };

type PropsToOmit<C extends ElementType, P> = keyof (AsProp<C> & P);

type PolymorphicComponentProp<C extends ElementType, Props = {}> =
  PropsWithChildren<Props & AsProp<C>> &
  Omit<ComponentPropsWithoutRef<C>, PropsToOmit<C, Props>>;

// Button that renders as any element
type ButtonProps<C extends ElementType = 'button'> =
  PolymorphicComponentProp<C, {
    variant?: 'primary' | 'ghost' | 'danger';
    size?: 'sm' | 'md' | 'lg';
  }>;

function Button<C extends ElementType = 'button'>({
  as,
  variant = 'primary',
  size = 'md',
  children,
  className,
  ...rest
}: ButtonProps<C>) {
  const Component = as ?? 'button';

  return (
    <Component
      className={cn('btn', \`btn--\${variant}\`, \`btn--\${size}\`, className)}
      {...rest}
    >
      {children}
    </Component>
  );
}

// Usage — same API, different rendered elements
<Button>Submit</Button>                      // renders <button>
<Button as="a" href="/home">Go home</Button> // renders <a href="/home">
<Button as={Link} to="/profile">Profile</Button> // renders React Router Link
// TypeScript knows which props are valid for each \`as\` value`,
            )}

            <h2>HOCs — Their Modern Role</h2>
            <p>HOCs didn't die — they evolved. Today they're used for two legitimate purposes: cross-cutting concerns that can't be hooks, and library interoperability.</p>
            ${code(

// that don't accept ref (can't use hook for this)
function withErrorBoundary(Component, fallback) {
  return function WithErrorBoundary(props) {
    return (
      <ErrorBoundary fallback={fallback}>
        <Component {...props} />
      </ErrorBoundary>
    );
  };
}

// Legitimate modern HOC use 2: code splitting with loading UI
function withSuspense(Component, fallback = <Spinner />) {
  return function WithSuspense(props) {
    return (
      <Suspense fallback={fallback}>
        <Component {...props} />
      </Suspense>
    );
  };
}

const LazyDashboard = withSuspense(
  React.lazy(() => import('./Dashboard')),
  <DashboardSkeleton />
);

// What HOCs are NO LONGER for: sharing stateful logic

            <h2>When Local State Isn't Enough</h2>
            <p>Every React application starts the same way — a handful of useState calls, maybe a useContext or two, everything collocated near where it's used. This is correct. It's the right starting point.</p>
            <p>But applications grow. Features multiply. Teams expand. And eventually you hit one or more of these walls:</p>
            <ul>
              <li>State needs to be shared across components that have no common ancestor worth using as a host</li>
              <li>Server data needs to be cached, invalidated, and synchronized — not just stored</li>
              <li>UI actions produce state transitions that need to be auditable, time-travelable, or reproducible</li>
              <li>Multiple async operations need to coordinate without race conditions</li>
              <li>The same piece of data is being derived by five different components in five different ways</li>
            </ul>
            <p>These are the problems that external state management exists to solve. Not every application needs it. But every senior developer needs to know when to reach for it, which tool fits the problem, and how to use each one with production-grade discipline.</p>

            <h2>Classic Redux — The Architecture Everyone Escaped</h2>
            <p>Original Redux was architecturally sound but painfully verbose. It required:</p>
            ${code(
              "txt",
              `Action types (constants)  ->  Action creators  ->  Reducers  ->  Store
       |                           |                  |          |
"FETCH_USER_SUCCESS"     createAction(type)    switch/case   configureStore`,
            )}
            <p>A simple "fetch and store a user" feature required files spanning action type constants, action creator functions, a reducer with switch/case, and store configuration — before writing a single line of UI code. The overhead was real enough that teams avoided Redux for small features and ended up with inconsistent state management across a codebase.</p>
            ${code(
              "js",
              `// Old Redux — a single user fetch required all of this:

// 1. Action types
const FETCH_USER_REQUEST = 'FETCH_USER_REQUEST';
const FETCH_USER_SUCCESS = 'FETCH_USER_SUCCESS';
const FETCH_USER_FAILURE = 'FETCH_USER_FAILURE';

// 2. Action creators
const fetchUserRequest = () => ({ type: FETCH_USER_REQUEST });
const fetchUserSuccess = (user) => ({ type: FETCH_USER_SUCCESS, payload: user });
const fetchUserFailure = (error) => ({ type: FETCH_USER_FAILURE, error });

// 3. Reducer
function userReducer(state = { user: null, loading: false, error: null }, action) {
  switch (action.type) {
    case FETCH_USER_REQUEST:
      return { ...state, loading: true, error: null };
    case FETCH_USER_SUCCESS:
      return { user: action.payload, loading: false, error: null };
    case FETCH_USER_FAILURE:
      return { ...state, loading: false, error: action.error };
    default:
      return state;
  }
}

// 4. Thunk (async action)
const fetchUser = (id) => async (dispatch) => {
  dispatch(fetchUserRequest());
  try {
    const user = await api.getUser(id);
    dispatch(fetchUserSuccess(user));
  } catch (err) {
    dispatch(fetchUserFailure(err.message));
  }
};

// 5. Store
const store = createStore(
  combineReducers({ user: userReducer }),
  applyMiddleware(thunk)
);`,

            <h2>The Mental Model Before Choosing a Tool</h2>
            <p>Before examining any specific library, establish the right mental model for what kind of state you're dealing with. Not all state is alike:</p>
            ${tableHTML(

            <p>This taxonomy is the first decision you make. Picking the wrong category — treating server state as client state, or putting URL state in a global store — is where most state architecture problems begin.</p>

            <h2>Zustand — The Minimal Powerhouse</h2>
            <p>Zustand is built on one insight: a global store is just a hook. No providers, no boilerplate, no action creators. Just a create call and a hook.</p>
            <h3>Core mechanics</h3>
            ${code(
              "jsx",
              `import { create } from 'zustand';

// The store is a function that receives set and get
const useStore = create((set, get) => ({
  // State
  count: 0,
  user: null,

  // Actions — co-located with state (unlike Redux)
  increment: () => set(state => ({ count: state.count + 1 })),
  decrement: () => set(state => ({ count: state.count - 1 })),
  reset: () => set({ count: 0 }),

  setUser: (user) => set({ user }),

  // Actions can call other actions via get()
  incrementIfPositive: () => {
    const { count, increment } = get();
    if (count >= 0) increment();
  },
}));

// Usage — no Provider needed, works anywhere
function Counter() {
  const count     = useStore(state => state.count);
  const increment = useStore(state => state.increment);

  return <button onClick={increment}>{count}</button>;
}`,
            )}
            <p>The selector state => state.count is the critical performance piece. Only the count slice is subscribed — the component will not re-render when user changes. This is built-in selector support, no additional configuration needed.</p>
            <h3>Zustand with slices — scaling the store</h3>
            <p>For large applications, splitting a store into domain-specific slices keeps it maintainable:</p>
            ${code(
              "jsx",
              `// userSlice.js
const createUserSlice = (set, get) => ({
  user: null,
  isAuthenticated: false,

  setUser: (user) => set({ user, isAuthenticated: Boolean(user) }),
  clearUser: () => set({ user: null, isAuthenticated: false }),
});

// cartSlice.js
const createCartSlice = (set, get) => ({
  items: [],
  total: 0,

  addItem: (item) => set(state => {
    const items = [...state.items, item];
    return { items, total: items.reduce((s, i) => s + i.price, 0) };
  }),

  removeItem: (id) => set(state => {
    const items = state.items.filter(i => i.id !== id);
    return { items, total: items.reduce((s, i) => s + i.price, 0) };
  }),
});

// store.js — compose slices
const useStore = create((...args) => ({
  ...createUserSlice(...args),
  ...createCartSlice(...args),
}));

// Domain-specific hooks — narrow the API surface
export const useUser         = () => useStore(s => s.user);
export const useIsAuth       = () => useStore(s => s.isAuthenticated);
export const useCart         = () => useStore(s => s.items);
export const useCartTotal    = () => useStore(s => s.total);
export const useUserActions  = () => useStore(s => ({
  setUser: s.setUser, clearUser: s.clearUser
}));`,

            <h3>Zustand middleware — persist, devtools, immer</h3>

import { devtools, persist } from 'zustand/middleware';
import { immer } from 'zustand/middleware/immer';

const useStore = create(
  devtools(           // Redux DevTools integration
    persist(          // localStorage persistence

        (set) => ({

            <h2>Redux Toolkit (RTK) — Modern Redux Without the Pain</h2>
            <p>Redux Toolkit is the official, opinionated way to write Redux. It eliminates the verbosity of classic Redux with three key abstractions: createSlice, createAsyncThunk, and configureStore.</p>
            <h3>createSlice — actions and reducers unified</h3>
            ${code(
              "jsx",
              `import { createSlice, createAsyncThunk } from '@reduxjs/toolkit';

// createAsyncThunk handles the three-state async pattern automatically
export const fetchUser = createAsyncThunk(
  'user/fetch',           // action type prefix
  async (userId, { rejectWithValue }) => {
    try {
      const response = await api.getUser(userId);
      return response.data;
    } catch (err) {
      // rejectWithValue lets you control the rejected payload
      return rejectWithValue(err.response.data);
    }
  }
);

const userSlice = createSlice({
  name: 'user',
  initialState: {
    data: null,
    status: 'idle',   // 'idle' | 'loading' | 'succeeded' | 'failed'
    error: null,
  },
  reducers: {
    // Synchronous actions
    userLoggedOut: (state) => {
      // RTK uses Immer internally — mutation syntax is correct here
      state.data = null;
      state.status = 'idle';
      state.error = null;
    },
    userUpdated: (state, action) => {
      // Partial update
      Object.assign(state.data, action.payload);
    },
  },
  extraReducers: (builder) => {
    // Handle async thunk states
    builder
      .addCase(fetchUser.pending, (state) => {
        state.status = 'loading';
        state.error = null;
      })
      .addCase(fetchUser.fulfilled, (state, action) => {
        state.status = 'succeeded';
        state.data = action.payload;
      })
      .addCase(fetchUser.rejected, (state, action) => {
        state.status = 'failed';
        state.error = action.payload ?? action.error.message;
      });
  },
});

// createSlice auto-generates action creators
export const { userLoggedOut, userUpdated } = userSlice.actions;
export default userSlice.reducer;`,
            )}
            <h3>configureStore — no manual middleware</h3>
            ${code(
              "jsx",
              `import { configureStore } from '@reduxjs/toolkit';
import userReducer from './userSlice';
import cartReducer from './cartSlice';

const store = configureStore({
  reducer: {
    user: userReducer,
    cart: cartReducer,
  },
  // Redux DevTools and redux-thunk middleware enabled by default
  // Add more middleware if needed:
  middleware: (getDefaultMiddleware) =>
    getDefaultMiddleware().concat(apiMiddleware),
});

// TypeScript types derived from the store automatically
export type RootState    = ReturnType<typeof store.getState>;
export type AppDispatch  = typeof store.dispatch;`,

            <h3>Typed hooks for TypeScript</h3>
            ${code(
              "tsx",
              `// hooks.ts — typed versions of useSelector and useDispatch
import { useDispatch, useSelector } from 'react-redux';
import type { RootState, AppDispatch } from './store';

// Use these everywhere instead of raw useSelector/useDispatch
export const useAppDispatch = () => useDispatch<AppDispatch>();
export const useAppSelector = <T>(selector: (state: RootState) => T) =>
  useSelector(selector);

// Usage
function UserProfile() {
  const dispatch = useAppDispatch();
  const user     = useAppSelector(state => state.user.data);
  const status   = useAppSelector(state => state.user.status);

  useEffect(() => {
    dispatch(fetchUser(userId));
  }, [userId]);

  if (status === 'loading') return <Spinner />;
  if (!user) return null;
  return <Profile data={user} />;
}`,

            <h3>RTK Query — Data Fetching Baked In</h3>
            <p>RTK Query is a data fetching and caching layer built into Redux Toolkit. It handles cache management, request deduplication, background refetching, and optimistic updates — all with significantly less code than manual approaches.</p>
            ${code(
              "jsx",
              `import { createApi, fetchBaseQuery } from '@reduxjs/toolkit/query/react';

// Define your API once
const api = createApi({
  reducerPath: 'api',
  baseQuery: fetchBaseQuery({ baseUrl: '/api' }),
  tagTypes: ['User', 'Post'],  // for cache invalidation
  endpoints: (builder) => ({

    // Query — GET request with caching
    getUser: builder.query({
      query: (id) => \`/users/\${id}\`,
      providesTags: (result, error, id) => [{ type: 'User', id }],
    }),

    getPostsByUser: builder.query({
      query: (userId) => \`/posts?userId=\${userId}\`,
      providesTags: (result) =>
        result
          ? [...result.map(({ id }) => ({ type: 'Post', id })), 'Post']
          : ['Post'],
    }),

    // Mutation — POST/PUT/DELETE with cache invalidation
    updateUser: builder.mutation({
      query: ({ id, ...patch }) => ({
        url: \`/users/\${id}\`,
        method: 'PATCH',
        body: patch,
      }),
      // Invalidate User cache after update — triggers refetch
      invalidatesTags: (result, error, { id }) => [{ type: 'User', id }],
    }),

    deletePost: builder.mutation({
      query: (id) => ({ url: \`/posts/\${id}\`, method: 'DELETE' }),
      invalidatesTags: ['Post'], // invalidate all Post caches
    }),
  }),
});

// Auto-generated hooks
export const {
  useGetUserQuery,
  useGetPostsByUserQuery,
  useUpdateUserMutation,
  useDeletePostMutation,
} = api;

// Usage — no useEffect, no useState, no loading state management
function UserProfile({ userId }) {
  const { data: user, isLoading, isError } = useGetUserQuery(userId);
  const [updateUser, { isLoading: isSaving }] = useUpdateUserMutation();

  if (isLoading) return <Spinner />;
  if (isError)   return <ErrorMessage />;

  return (
    <form onSubmit={(e) => {
      e.preventDefault();
      updateUser({ id: userId, name: e.target.name.value });
      // Cache automatically invalidated and refetched after mutation
    }}>
      <input name="name" defaultValue={user.name} />
      <button disabled={isSaving}>Save</button>
    </form>
  );
}`,
            )}

            <h2>Jotai — Atomic Bottom-Up State</h2>
            <p>Jotai's model is fundamentally different from Zustand and Redux. Instead of one global store, Jotai uses atoms — individual pieces of state that can be composed and derived. Components subscribe to only the atoms they use.</p>
            ${code(
              "jsx",
              `import { atom, useAtom, useAtomValue, useSetAtom } from 'jotai';

// Primitive atoms — the leaves of the dependency graph
const countAtom    = atom(0);
const userAtom     = atom(null);
const themeAtom    = atom('light');

// Derived atoms — computed from other atoms
const doubleCountAtom = atom(
  (get) => get(countAtom) * 2  // read-only derived
);

const userDisplayNameAtom = atom(
  (get) => {
    const user = get(userAtom);
    return user ? \`\${user.firstName} \${user.lastName}\` : 'Guest';
  }
);

// Read-write derived atom
const darkModeAtom = atom(
  (get) => get(themeAtom) === 'dark',
  (get, set, isDark) => set(themeAtom, isDark ? 'dark' : 'light')
);

// Usage
function Counter() {
  const [count, setCount] = useAtom(countAtom);
  const double = useAtomValue(doubleCountAtom); // read-only

  return (
    <>
      <p>Count: {count}, Double: {double}</p>
      <button onClick={() => setCount(c => c + 1)}>Increment</button>
    </>
  );
}

function ThemeToggle() {
  const [isDark, setDark] = useAtom(darkModeAtom);
  return (
    <button onClick={() => setDark(!isDark)}>
      {isDark ? 'Light mode' : 'Dark mode'}
    </button>
  );
}`,
            )}

// Atom that fetches data — integrates with Suspense automatically
const userIdAtom = atom(1);

const userAtom = atom(async (get) => {
  const id = get(userIdAtom);
  const response = await fetch(\`/api/users/\${id}\`);
  return response.json();
  // This atom suspends when loading, resolves when done

// Usage requires Suspense boundary
function UserProfile() {
  const user = useAtomValue(userAtom); // suspends until resolved

function App() {

  );
}`,

const useStore = create((set) => ({
  posts: [],
  likePost: async (postId) => {
    // 1. Update immediately (optimistic)
    set(state => ({
      posts: state.posts.map(p =>
        p.id === postId ? { ...p, likes: p.likes + 1, isLiking: true } : p
      ),
    }));

    try {
      // 2. Confirm with server
      await api.likePost(postId);
      set(state => ({
        posts: state.posts.map(p =>
          p.id === postId ? { ...p, isLiking: false } : p
        ),
      }));

      // 3. Roll back on failure
      set(state => ({
        posts: state.posts.map(p =>
          p.id === postId ? { ...p, likes: p.likes - 1, isLiking: false } : p
        ),
      }));
    }

          body: () => `
            <h2>Why Data Fetching Deserves Its Own Chapter</h2>
            <p>Data fetching is where most React applications spend most of their complexity budget. Not routing. Not state management. Not component architecture. The gap between "fetch some data and show it" and "handle every real-world scenario correctly" is enormous — and most applications live somewhere in the middle, with bugs in the parts they haven't thought carefully about.</p>
            <p>Those parts include: loading states that flash on fast connections, error states that never reset, stale data shown after navigation, requests fired multiple times for the same resource, race conditions when a user navigates quickly, cache that never invalidates, and mutations that don't reflect in the UI until a manual refresh.</p>
            <p>React Query and SWR exist to solve all of these problems with a single, well-designed abstraction. Understanding them deeply — not just the happy path, but the edge cases and the internals — is what this chapter is about.</p>

            ${reads(
              "The Old Way: useEffect Data Fetching",
              `
            <h2>Every Problem with Manual Data Fetching</h2>
            <p>Before React Query and SWR, the standard pattern was useEffect + useState. Every team built their own version of the same thing, with the same class of bugs:</p>
            ${code(
              "jsx",
              `// The pattern every team wrote before React Query
function UserList() {
  const [users, setUsers]     = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState(null);

  useEffect(() => {
    fetch('/api/users')
      .then(r => r.json())
      .then(data => {
        setUsers(data);
        setLoading(false);
      })
      .catch(err => {
        setError(err.message);
        setLoading(false);
      });
  }, []);

  if (loading) return <Spinner />;
  if (error)   return <p>Error: {error}</p>;
  return <ul>{users.map(u => <li key={u.id}>{u.name}</li>)}</ul>;
}`,
            )}
            <p>This looks complete. It has at least seven production bugs:</p>
            <p><strong>Bug 1 — No AbortController:</strong> if the component unmounts before the fetch completes, setUsers is called on an unmounted component. In React 18 this no longer throws a warning, but it's still wasted work and can corrupt state in complex scenarios.</p>
            <p><strong>Bug 2 — Race condition:</strong> if userId is a prop that changes, two fetches can be in-flight simultaneously. The slower one resolves last, overwrites the correct data.</p>
            <p><strong>Bug 3 — No caching:</strong> navigate away and back — the request fires again. The user waits even though the data is fresh.</p>
            <p><strong>Bug 4 — No background refetch:</strong> the data goes stale while the user is on the page. There's no mechanism to refresh it automatically.</p>
            <p><strong>Bug 5 — No deduplication:</strong> three components using this hook fire three network requests for the same data.</p>
            <p><strong>Bug 6 — No retry:</strong> a transient network error shows the error state permanently.</p>
            <p><strong>Bug 7 — Stale loading state:</strong> if you add a refetch function, you need to manually manage whether to show the loading spinner on initial load vs a background refresh.</p>
            <p>React Query solves all seven, plus a dozen more edge cases you haven't thought of yet.</p>

              "React Query: The Complete Mental Model",

            <h2>What React Query Actually Is</h2>
            <p>React Query is not a data fetching library. It doesn't fetch anything. It is a server state synchronization library — it manages the lifecycle of asynchronous data that lives on a server and needs to be kept in sync with your UI.</p>
            <p>The mental model: React Query is a smart cache between your server and your components. Every query has a cache key. When multiple components ask for the same key, they share one request and one cache entry. When the data goes stale, React Query refetches in the background. When you mutate data, you can declaratively invalidate affected cache entries.</p>
            <div class="setstate-flow">
              <div class="ss-step start">Application components<small>UserProfile · UserCard → useQuery(['user', 1]) · PostList → useQuery(['posts']) · NavBar</small></div>
              <div class="ss-arrow">↓</div>
              <div class="ss-step boundary">QueryClient cache<small>['user', 1] → {data, stale} · ['posts'] → {data, fresh}</small></div>
              <div class="ss-arrow">↓</div>
              <div class="ss-step">Server / API<small>fetch / refetch</small></div>
              <div class="ss-key">1 request — 2 subscribers share one cache entry. Background refetch queued when data is stale.</div>

            <h2>Setup and QueryClient Configuration</h2>
            ${code(
              "jsx",
              `import {
  QueryClient,
  QueryClientProvider,
} from '@tanstack/react-query';
import { ReactQueryDevtools } from '@tanstack/react-query-devtools';

// One QueryClient per app — configure defaults here
const queryClient = new QueryClient({
  defaultOptions: {
    queries: {
      staleTime: 1000 * 60 * 5,      // 5 minutes — data stays fresh
      gcTime: 1000 * 60 * 10,        // 10 minutes — unused data kept in cache
      retry: 2,                       // retry failed requests twice
      retryDelay: attemptIndex =>
        Math.min(1000 * 2 ** attemptIndex, 30000), // exponential backoff
      refetchOnWindowFocus: true,     // refetch when tab becomes active
      refetchOnReconnect: true,       // refetch when network reconnects
    },
    mutations: {
      retry: 0,                       // don't retry mutations by default
    },
  },
});

function App() {
  return (
    <QueryClientProvider client={queryClient}>
      <Router />
      {/* DevTools — only in development */}
      <ReactQueryDevtools initialIsOpen={false} />
    </QueryClientProvider>
  );
}`,
            )}

            <h2>useQuery — The Complete API</h2>
            <p>useQuery is the foundation. Every data-fetching scenario maps to it:</p>
            ${code(
              "jsx",
              `import { useQuery } from '@tanstack/react-query';

// Minimal usage
const { data, isLoading, isError } = useQuery({
  queryKey: ['users'],
  queryFn: () => fetch('/api/users').then(r => r.json()),
});

// Full API with all options
const {
  data,          // the fetched data (undefined while loading)
  error,         // Error object if request failed
  isLoading,     // true: no data yet AND currently fetching
  isFetching,    // true: fetching (including background refetch)
  isPending,     // same as isLoading (v5 naming)
  isError,       // true: last request failed
  isSuccess,     // true: data is available
  isStale,       // true: data is older than staleTime
  refetch,       // function: manually trigger a refetch
  status,        // 'pending' | 'error' | 'success'
  fetchStatus,   // 'fetching' | 'paused' | 'idle'
} = useQuery({
  queryKey: ['user', userId],    // MUST include all deps used in queryFn
  queryFn: ({ queryKey, signal }) => {
    const [, id] = queryKey;
    // signal is an AbortController signal — React Query cancels on unmount
    return fetch(\`/api/users/\${id}\`, { signal }).then(r => {
      if (!r.ok) throw new Error(\`HTTP \${r.status}\`);
      return r.json();
    });
  },

  // Per-query overrides
  enabled: Boolean(userId),        // don't fetch if userId is falsy
  staleTime: 1000 * 60,            // fresh for 1 minute
  gcTime: 1000 * 60 * 5,          // keep in cache 5 minutes after unmount
  select: (data) => data.user,     // transform/select subset of data
  placeholderData: keepPreviousData, // show old data while fetching new
  initialData: cachedUser,         // pre-populate from another source
  retry: 3,
  refetchInterval: 1000 * 30,      // poll every 30 seconds
});`,
            )}
            <h3>The queryKey — the most important concept</h3>
            <p>The queryKey is the cache key. Everything about correct React Query usage flows from understanding how keys work:</p>
            ${code(
              "jsx",
              `// queryKey must include EVERY value that affects the queryFn result
// If the request URL or params change -> key must change

// ❌ WRONG — userId changes but key doesn't
useQuery({
  queryKey: ['user'],         // static key
  queryFn: () => fetchUser(userId), // userId is closure — not in key
  // When userId changes, React Query thinks it's the same query
  // It returns cached data from the old userId -> stale data bug
});

// ✅ CORRECT — userId is part of the key
useQuery({
  queryKey: ['user', userId], // key changes when userId changes
  queryFn: () => fetchUser(userId),
  // React Query creates a separate cache entry per userId value
});

// Structured keys for complex queries
useQuery({
  queryKey: ['posts', { status: 'published', page: 2, userId }],
  queryFn: ({ queryKey }) => {
    const [, params] = queryKey;
    return fetchPosts(params); // serialize params for the request
  },
});

// Key structure conventions
['entity']                     // list of all entities
['entity', id]                 // single entity by id
['entity', id, 'relations']    // related data
['entity', { filter, sort }]   // filtered/sorted list`,
            )}

            <h2>useMutation — Data Mutations</h2>
            <p>useMutation handles any operation that changes server state: POST, PUT, PATCH, DELETE.</p>
            ${code(
              "jsx",
              `import { useMutation, useQueryClient } from '@tanstack/react-query';

function CreatePost() {
  const queryClient = useQueryClient();

  const { mutate, isPending, error, reset } = useMutation({
    mutationFn: (newPost) =>
      fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newPost),
      }).then(r => r.json()),

    // On success: invalidate affected caches
    onSuccess: (data, variables, context) => {
      // Invalidate the posts list -> triggers refetch
      queryClient.invalidateQueries({ queryKey: ['posts'] });

      // OR manually update the cache without refetching
      queryClient.setQueryData(['post', data.id], data);
    },

    onError: (error, variables, context) => {
      console.error('Failed to create post:', error.message);
      // Roll back optimistic update if you used one
    },

    onSettled: (data, error, variables, context) => {
      // Runs after both success and error
      // Good place to ensure cache is consistent
      queryClient.invalidateQueries({ queryKey: ['posts'] });
    },
  });

  const handleSubmit = (e) => {
    e.preventDefault();
    mutate({
      title: e.target.title.value,
      body: e.target.body.value,
    });
  };

  return (
    <form onSubmit={handleSubmit}>
      <input name="title" placeholder="Title" />
      <textarea name="body" placeholder="Content" />
      {error && (
        <p>
          Error: {error.message}
          <button type="button" onClick={reset}>Dismiss</button>
        </p>
      )}
      <button type="submit" disabled={isPending}>
        {isPending ? 'Creating...' : 'Create post'}
      </button>
    </form>
  );
}`,
            )}

            <h2>Cache Invalidation — The Key to Correctness</h2>
            <p>Cache invalidation is where most React Query bugs live. The rule is simple: after any mutation that changes data, invalidate every query that could be affected.</p>
            ${code(
              "jsx",
              `// Granular invalidation strategies

// 1. Invalidate specific key
queryClient.invalidateQueries({ queryKey: ['posts', postId] });

// 2. Invalidate by prefix — affects all queries starting with 'posts'
queryClient.invalidateQueries({ queryKey: ['posts'] });
// Invalidates: ['posts'], ['posts', 1], ['posts', { filter: 'published' }]

// 3. Invalidate everything
queryClient.invalidateQueries();

// 4. Direct cache update — no refetch needed when you have fresh data
queryClient.setQueryData(['post', newPost.id], newPost);

// 5. Merge update into list
queryClient.setQueryData(['posts'], (oldData) => {
  if (!oldData) return [newPost];
  return [...oldData, newPost]; // append to existing list
});

// 6. Remove from cache (useful after delete)
queryClient.removeQueries({ queryKey: ['post', deletedId] });`,
            )}
            <p>The tradeoff: invalidateQueries is always correct but causes a network request. setQueryData is faster (no request) but you must have the exact data the server would return. For mutations where the server applies transforms (timestamps, computed fields, generated IDs), invalidateQueries is safer.</p>

            <h2>Optimistic Updates — Instant Feedback with Safe Rollback</h2>
            <p>Optimistic updates show the user the expected result immediately, before the server confirms. React Query provides a structured pattern for this with automatic rollback:</p>
            ${code(
              "jsx",
              `const queryClient = useQueryClient();

const { mutate } = useMutation({
  mutationFn: (updatedPost) =>
    fetch(\`/api/posts/\${updatedPost.id}\`, {
      method: 'PATCH',
      body: JSON.stringify(updatedPost),
    }).then(r => r.json()),

  // Step 1: Before the request fires
  onMutate: async (updatedPost) => {
    // Cancel any in-flight refetches for this query
    // (prevents them from overwriting our optimistic update)
    await queryClient.cancelQueries({ queryKey: ['post', updatedPost.id] });

    // Snapshot the previous value for rollback
    const previousPost = queryClient.getQueryData(['post', updatedPost.id]);

    // Apply the optimistic update to the cache
    queryClient.setQueryData(['post', updatedPost.id], old => ({
      ...old,
      ...updatedPost,
    }));

    // Also update any list that contains this post
    queryClient.setQueryData(['posts'], old =>
      old?.map(p => p.id === updatedPost.id ? { ...p, ...updatedPost } : p)
    );

    // Return context for rollback
    return { previousPost };
  },

  // Step 2: On error, roll back to the snapshot
  onError: (error, updatedPost, context) => {
    // Restore the snapshot
    if (context?.previousPost) {
      queryClient.setQueryData(
        ['post', updatedPost.id],
        context.previousPost
      );
    }
  },

  // Step 3: Always refetch to ensure server and client are in sync
  onSettled: (data, error, updatedPost) => {
    queryClient.invalidateQueries({ queryKey: ['post', updatedPost.id] });
    queryClient.invalidateQueries({ queryKey: ['posts'] });
  },
});`,
            )}
            <p>The three-phase pattern — onMutate → onError → onSettled — is the correct structure for any optimistic update. Never skip onSettled; it ensures the cache reflects actual server state regardless of whether the optimistic update was correct.</p>

            <h2>Pagination and Infinite Queries</h2>
            <h3>Offset-based pagination</h3>
            ${code(
              "jsx",
              `function PostList() {
  const [page, setPage] = useState(1);

  const { data, isPlaceholderData } = useQuery({
    queryKey: ['posts', page],
    queryFn: () => fetchPosts({ page, limit: 10 }),
    placeholderData: keepPreviousData,
    // keepPreviousData: show old page data while fetching new page
    // prevents content jumping to loading state on every page change
  });

  // Prefetch next page for instant navigation
  useEffect(() => {
    const nextPage = page + 1;
    if (data?.hasNextPage) {
      queryClient.prefetchQuery({
        queryKey: ['posts', nextPage],
        queryFn: () => fetchPosts({ page: nextPage, limit: 10 }),
      });
    }
  }, [data, page]);

  return (
    <>
      <PostGrid posts={data?.posts ?? []} />
      <button
        onClick={() => setPage(p => Math.max(1, p - 1))}
        disabled={page === 1}
      >
        Previous
      </button>
      <span>Page {page}</span>
      <button
        onClick={() => setPage(p => p + 1)}
        disabled={!data?.hasNextPage || isPlaceholderData}
      >
        Next
      </button>
    </>
  );
}`,

            <p>React Query integrates with React's Suspense system. Instead of isLoading checks, use Suspense boundaries for a cleaner component model:</p>

              "jsx",

function UserProfile({ userId }) {
  const { data: user } = useSuspenseQuery({
    queryKey: ['user', userId],
    queryFn: () => fetchUser(userId),
    // Throws a Promise while loading -> Suspense catches it
    // Throws an Error on failure -> ErrorBoundary catches it

// Parent handles all loading and error states declaratively

            <h2>SWR — The Alternative Mental Model</h2>
            <p>SWR (Stale-While-Revalidate) from Vercel follows the same core idea as React Query but with a simpler, more minimal API. The name describes its caching strategy: return stale (cached) data immediately, then revalidate (refetch) in the background.</p>
            ${code(
              "jsx",
              `import useSWR, { mutate } from 'swr';

// SWR fetcher — just a function, can be anything
const fetcher = (url) => fetch(url).then(r => r.json());

function UserProfile({ userId }) {
  const { data, error, isLoading, mutate: revalidate } = useSWR(
    \`/api/users/\${userId}\`,  // key = URL (SWR convention)
    fetcher,
    {
      revalidateOnFocus: true,       // refetch on tab focus
      revalidateOnReconnect: true,   // refetch on network reconnect
      refreshInterval: 30_000,       // poll every 30s
      dedupingInterval: 2_000,       // deduplicate requests in 2s window
      errorRetryCount: 3,
      onSuccess: (data) => {},
      onError: (error) => {},
    }
  );

  if (isLoading) return <Spinner />;
  if (error) return <ErrorMessage />;
  return <Profile user={data} />;

async function updateUser(id, patch) {

    method: 'PATCH',
    body: JSON.stringify(patch),

  // Revalidate the key

}`,

class ApiError extends Error {
  constructor(
    message: string,
    public status: number,
    public data: unknown
  ) {
    super(message);
    this.name = 'ApiError';
  }
}

async function apiFetch<T>(
  path: string,
  options: RequestInit = {}
): Promise<T> {
  const token = getAuthToken(); // from auth store/cookie

  const response = await fetch(\`\${process.env.API_URL}\${path}\`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(token && { Authorization: \`Bearer \${token}\` }),
      ...options.headers,
    },
  });

  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    throw new ApiError(
      data.message ?? \`HTTP \${response.status}\`,
      response.status,
      data
    );
  }

  // Handle 204 No Content
  if (response.status === 204) return null as T;
  return response.json();
}

// api/users.ts — domain-specific API functions
export const usersApi = {
  getAll: (params: GetUsersParams) =>
    apiFetch<User[]>(\`/users?\${new URLSearchParams(params as any)}\`),

  getById: (id: string) =>
    apiFetch<User>(\`/users/\${id}\`),

  update: (id: string, patch: Partial<User>) =>
    apiFetch<User>(\`/users/\${id}\`, {
      method: 'PATCH',
      body: JSON.stringify(patch),
    }),

  delete: (id: string) =>
    apiFetch<void>(\`/users/\${id}\`, { method: 'DELETE' }),
};

// hooks/useUsers.ts — React Query hooks for user domain
export const userKeys = {
  all: ['users'] as const,
  lists: () => [...userKeys.all, 'list'] as const,
  list: (params: GetUsersParams) => [...userKeys.lists(), params] as const,
  details: () => [...userKeys.all, 'detail'] as const,
  detail: (id: string) => [...userKeys.details(), id] as const,
};

export function useUsers(params: GetUsersParams) {
  return useQuery({
    queryKey: userKeys.list(params),
    queryFn: ({ signal }) => usersApi.getAll(params),
    staleTime: 1000 * 60 * 2,
  });
}

export function useUser(id: string) {
  return useQuery({
    queryKey: userKeys.detail(id),
    queryFn: () => usersApi.getById(id),
    enabled: Boolean(id),
  });
}

export function useUpdateUser() {
  const queryClient = useQueryClient();

  return useMutation({
    mutationFn: ({ id, ...patch }: { id: string } & Partial<User>) =>
      usersApi.update(id, patch),

    onSuccess: (updatedUser) => {
      // Update specific user cache
      queryClient.setQueryData(userKeys.detail(updatedUser.id), updatedUser);
      // Invalidate list caches — updated data affects all filters
      queryClient.invalidateQueries({ queryKey: userKeys.lists() });
    },
  });
}`,
            )}
            <p>The userKeys object is the query key factory pattern — a standard way to produce consistent, hierarchical keys that can be invalidated at any level.</p>

          body: () => `
            <h2>Why Rendering Strategy Is an Architecture Decision</h2>
            <p>Most React developers learn one rendering model and apply it everywhere. Client-side rendering because that's what Create React App did. Or server-side rendering because they use Next.js and that's the default. Neither approach is wrong in isolation — but applying either one without understanding the tradeoffs produces applications that are slower, less accessible, or harder to maintain than they need to be.</p>
            <p>The senior mental model: rendering strategy is not a framework choice, it's a per-route decision driven by the data access patterns and user experience requirements of that specific page. A product listing page, a user dashboard, and a blog post have fundamentally different requirements. The right architecture treats them differently.</p>
            <p>This chapter maps every rendering pattern precisely — what it does, when it wins, when it loses, and how they compose.</p>

            ${reads(
              "The Evolution of Rendering",
              `
            <h2>Where We Started: Multi-Page Applications</h2>
            <p>Before single-page applications existed, every page was server-rendered. The browser made a request, the server ran code, produced HTML, and sent it back. The browser displayed it immediately. No JavaScript required to see content.</p>
            ${code(
              "txt",
              `Request -> Server generates full HTML -> Browser renders
                                              |
                                        Fully interactive`,
            )}
            <p>This was good for performance (especially on slow connections), excellent for SEO (crawlers could read the HTML), but painful for user experience — every navigation triggered a full page reload and a flash of blank content.</p>
            <h2>The SPA Era: Client-Side Rendering</h2>
            <p>React's rise popularized CSR. The server sends a near-empty HTML shell and a JavaScript bundle. The browser downloads the bundle, executes it, fetches data, and renders the UI — all on the client.</p>
            ${code(
              "txt",
              `Request -> Blank HTML + JS bundle -> Parse JS -> Fetch data -> Render
              |                                                |
         User sees nothing              User finally sees content
         (several seconds)`,
            )}
            <p>This eliminated page reloads and felt fast once loaded — but the initial experience was terrible on slow connections. The HTML was empty until JavaScript loaded, which meant search engines struggled and users on 3G connections stared at blank screens.</p>
            <h2>The Pendulum Swings Back: SSR</h2>
            <p>Server-side rendering for React brought back the server-generated HTML, but now powered by JavaScript components:</p>
            ${code(
              "txt",
              `Request -> Server renders React to HTML -> Browser displays HTML
              |                                    |
         JS downloads in background         User sees content immediately
              |
         React hydrates — UI becomes interactive`,
            )}
            <p>SSR improved first contentful paint dramatically. But it introduced hydration — the process of React "taking over" the server-rendered HTML and making it interactive — which had its own performance costs and complexity.</p>
            <h2>The Current Reality: A Spectrum</h2>
            <p>Today we don't choose one rendering strategy. We compose them. A single Next.js application might use static generation for the home page, server rendering for the product page, client rendering for the user dashboard, and streaming for the search results.</p>
            <p>Understanding the complete spectrum is what this chapter covers.</p>
            `,
              "The Complete Rendering Model",
              `
            <h2>Client-Side Rendering (CSR) — The Pure React Model</h2>
            <p>CSR renders everything in the browser. The server sends a minimal HTML shell. JavaScript loads, React initializes, data is fetched, UI renders.</p>
            <div class="spectrum-diagram">
              <div class="spec-axis"><span>← More client</span><span>More server →</span></div>
              <div class="spec-cards">
                <div class="spec-card c1"><b>CSR</b><small>client only</small><ul><li>Dashboards</li><li>Real-time data</li><li>Auth-gated UI</li></ul></div>
                <div class="spec-card c2"><b>SSG</b><small>build time</small><ul><li>Blogs</li><li>Docs</li><li>Landing pages</li></ul></div>
                <div class="spec-card c3"><b>ISR</b><small>revalidate</small><ul><li>Product pages</li><li>Marketing</li><li>Semi-static</li></ul></div>
                <div class="spec-card c4"><b>SSR</b><small>per request</small><ul><li>Search results</li><li>User profiles</li><li>Dynamic routes</li></ul></div>
                <div class="spec-card c5"><b>RSC + Streaming</b><small>server components</small><ul><li>Complex pages</li><li>Mixed static/dynamic</li><li>Large data needs</li></ul></div>

            </div>

            <h2>Static Site Generation (SSG) — Build-Time HTML</h2>
            <p>SSG generates HTML at build time. Every page is a pre-built HTML file stored on a CDN. When a request arrives, no server computation happens — the CDN serves the pre-built file immediately.</p>
            ${code(
              "jsx",
              `// Next.js App Router — SSG is the default for pages that don't use dynamic data
// This component renders at BUILD TIME, not at request time

async function BlogPost({ params }) {
  // This fetch runs during \`next build\`
  // The result is baked into the HTML file
  const post = await fetch(\`https://api.example.com/posts/\${params.slug}\`, {
    cache: 'force-cache', // default in Next.js — persists across builds until revalidated
  }).then(r => r.json());

    <article>
      <h1>{post.title}</h1>
      <p>{post.publishedAt}</p>

            <p><strong>Performance characteristics:</strong> Time to First Byte (TTFB) is near-zero — the CDN serves the file immediately. But the HTML is only as fresh as the last build. Stale content is the primary limitation.</p>
            <p>When SSG is the right choice:</p>
            <ul>
              <li>Content that changes rarely or never (documentation, blog posts, marketing pages)</li>
              <li>Content that is the same for every user (no personalization)</li>
              <li>Maximum possible performance matters (TTFB is the bottleneck metric)</li>

            <h2>Incremental Static Regeneration (ISR) — Revalidated Static</h2>
            <p>ISR is SSG with a refresh mechanism. Pages are still pre-built and served from cache, but they can be revalidated after a specified time — automatically in the background, without a full rebuild.</p>
            ${code(
              "jsx",
              `// Next.js ISR — page is static but revalidates periodically

async function ProductPage({ params }) {
  const product = await fetch(
    \`https://api.example.com/products/\${params.id}\`,
    {
      // Revalidate this data after 60 seconds
      // First request after 60s: serve stale data + trigger background revalidation
      // Subsequent requests: serve fresh data
      next: { revalidate: 60 }
    }
  ).then(r => r.json());

  return <ProductView product={product} />;
}

// On-demand revalidation — called from a webhook when product data changes
// Next.js route handler:
// POST /api/revalidate
export async function POST(request) {
  const { secret, slug } = await request.json();

  if (secret !== process.env.REVALIDATE_SECRET) {
    return Response.json({ error: 'Invalid secret' }, { status: 401 });
  }

  // Immediately invalidate the cached page
  revalidatePath(\`/products/\${slug}\`);
  return Response.json({ revalidated: true });
}`,
            )}
            <p>ISR is the right choice for content that changes periodically but doesn't need to be real-time. An e-commerce product's price changes a few times per day — 60-second revalidation gives users fresh-enough data with the performance benefits of static serving.</p>

            <h2>Server-Side Rendering (SSR) — Per-Request HTML</h2>
            <p>SSR runs on the server for every request. The HTML is generated fresh, with access to request-time data (cookies, headers, authenticated user). The browser receives fully-formed HTML immediately, then JavaScript loads and React hydrates the page.</p>
            ${code(
              "jsx",
              `// Next.js SSR — opt-in by using request-time data

  const cookieStore = cookies(); // accessing cookies forces SSR
  const sessionToken = cookieStore.get('session')?.value;

  if (!sessionToken) {
    redirect('/login');
  }

  // This fetch runs on every request, not at build time
  const user = await fetch('https://api.example.com/me', {
    headers: { Authorization: \`Bearer \${sessionToken}\` },

            <p>The hydration problem: SSR sends HTML to the browser, but that HTML is static until React "hydrates" it — attaches event listeners and initializes component state. Before hydration, the page looks interactive but isn't. After hydration, it works normally. This gap was a serious problem in older React:</p>
            ${code(

              `SSR timeline (React 17):
Server renders -> Sends full HTML -> Browser displays (visible)
                                           |
                               JS bundle downloads (unusable — no interactivity)
                                           |
                               React hydrates entire tree (CPU intensive)
                                           |
                               Page is interactive

The user sees the page but cannot interact until hydration completes`,
