          body: () => `
            <h2>What Senior Architecture Means</h2>
            <p>The previous nineteen chapters covered how to build React correctly. This chapter covers something different: how to build React systems that survive contact with reality — teams that grow, products that scale, requirements that change, and incidents that happen.</p>
            <p>Senior architecture is not about using the most sophisticated patterns. It is about making decisions that keep a system understandable, recoverable, and evolvable as complexity accumulates. The architecture decisions you make at the beginning of a product determine how fast you can move in year three. Most developers don't feel those consequences until it's expensive to change them.</p>
            <p>This chapter covers five areas where architectural decisions have the most long-term impact: error containment, frontend decomposition, controlled feature rollout, security at the component level, and the review process that enforces standards across a team.</p>

            <h2>Error Boundaries — Containment and Recovery</h2>
            <p>React's error boundary mechanism converts runtime JavaScript errors into recoverable UI states rather than complete application crashes. Without error boundaries, a single component throwing during render brings down the entire React tree. With them, errors are contained to the boundary nearest the failure point.</p>
            <h3>The mechanics</h3>
            <p>Error boundaries are class components that implement getDerivedStateFromError and optionally componentDidCatch. There is no hook equivalent — this is a deliberate API decision, and class components remain the correct implementation for this use case.</p>
            ${code(
              "tsx",
              `interface ErrorBoundaryState {
  hasError: boolean;
  error: Error | null;
  errorInfo: React.ErrorInfo | null;
}

interface ErrorBoundaryProps {
  fallback: React.ReactNode | ((error: Error, reset: () => void) => React.ReactNode);
  onError?: (error: Error, errorInfo: React.ErrorInfo) => void;
  children: React.ReactNode;
}

class ErrorBoundary extends React.Component<ErrorBoundaryProps, ErrorBoundaryState> {
  constructor(props: ErrorBoundaryProps) {
    super(props);
    this.state = { hasError: false, error: null, errorInfo: null };
  }

  // Runs during render phase — updates state to trigger fallback render
  static getDerivedStateFromError(error: Error): Partial<ErrorBoundaryState> {
    return { hasError: true, error };
  }

  // Runs after commit — for logging side effects
  componentDidCatch(error: Error, errorInfo: React.ErrorInfo) {
    this.setState({ errorInfo });
    // Report to your error tracking service
    this.props.onError?.(error, errorInfo);
    reportError(error, { componentStack: errorInfo.componentStack });
  }

  reset = () => {
    this.setState({ hasError: false, error: null, errorInfo: null });
  };

  render() {
    if (this.state.hasError && this.state.error) {
      const { fallback } = this.props;
      if (typeof fallback === 'function') {
        return fallback(this.state.error, this.reset);
      }
      return fallback;
    }
    return this.props.children;
  }
}

// Functional wrapper — cleaner API over the class
function withErrorBoundary<P extends object>(
  Component: React.ComponentType<P>,
  fallback: ErrorBoundaryProps['fallback'],
  onError?: ErrorBoundaryProps['onError']
) {
  return function WithErrorBoundary(props: P) {
    return (
      <ErrorBoundary fallback={fallback} onError={onError}>
        <Component {...props} />
      </ErrorBoundary>
    );
  };
}`,
            )}
            <h3>Architectural placement — where to put boundaries</h3>
            <p>Boundary placement is the most consequential decision. Too few boundaries means a single failing widget crashes the page. Too many means the overhead of managing fallbacks outweighs the benefit.</p>
            ${code(
              "tsx",
              `// LEVEL 1: Route-level boundary — contains page-level failures
// Every route gets its own boundary. A crash on /settings
// doesn't affect /dashboard.
function Router() {
  return (
    <Routes>
      <Route
        path="/dashboard"
        element={
          <ErrorBoundary fallback={<PageErrorFallback />}>
            <Dashboard />
          </ErrorBoundary>
        }
      />
      <Route
        path="/settings"
        element={
          <ErrorBoundary fallback={<PageErrorFallback />}>
            <Settings />
          </ErrorBoundary>
        }
      />
    </Routes>
  );
}

// LEVEL 2: Feature-level boundary — contains widget failures
// A crashing recommendations widget doesn't take down the product page
function ProductPage({ productId }) {
  return (
    <main>
      <ProductDetails productId={productId} />  {/* critical — no boundary */}

      <ErrorBoundary
        fallback={<p>Recommendations unavailable</p>}
        onError={(err) => analytics.track('recommendations_error')}
      >
        <Recommendations productId={productId} />  {/* non-critical */}
      </ErrorBoundary>

      <ErrorBoundary fallback={<p>Reviews unavailable</p>}>
        <ReviewList productId={productId} />  {/* non-critical */}
      </ErrorBoundary>
    </main>
  );
}

// LEVEL 3: Critical path — NO boundary
// Some failures should crash visibly. A payment form that silently fails
// is worse than one that crashes with a clear error.
// Don't wrap these:
// - Payment and checkout flows
// - Auth forms (silent failure = security issue)
// - Data submission with real consequences`,
            )}
            <h3>What error boundaries do NOT catch</h3>

// - render methods

// - constructors of class components
// - useEffect body (via React's error handling)

// They do NOT catch:

useEffect(() => {
  fetchData().then(setData).catch(err => {
    // This error is NOT caught by ErrorBoundary
    // Handle it in state: setError(err)

}, []);

// 2. Event handler errors
<button onClick={() => {
  throw new Error('This is NOT caught by ErrorBoundary');
  // Handle with try/catch in the handler
}}>

// 3. Errors in the error boundary itself
// 4. Errors in Server Components (use Next.js error.tsx instead)

// Production pattern: combine ErrorBoundary with React Query
// React Query catches async errors and surfaces them through isError/error
// ErrorBoundary catches synchronous render errors
// Together they cover all failure modes`,

            <h3>The reset mechanism — making errors recoverable</h3>
            ${code(
              "tsx",
              `// Route-level reset: retry when route changes
function RouteAwareErrorBoundary({ children }) {
  const location = useLocation();

  return (
    <ErrorBoundary
      key={location.pathname}  // remounts boundary (and resets state) on navigation
      fallback={(error, reset) => (
        <div role="alert">
          <h2>Something went wrong</h2>
          <p>{error.message}</p>
          <button onClick={reset}>Try again</button>
          <button onClick={() => window.location.reload()}>Reload page</button>
        </div>
      )}
    >
      {children}
    </ErrorBoundary>
  );
}

// With React Query — reset on refetch
function DataBoundary({ queryKey, children }) {
  const queryClient = useQueryClient();

  return (
    <ErrorBoundary
      fallback={(error, reset) => (
        <button onClick={() => {
          queryClient.invalidateQueries({ queryKey });
          reset();
        }}>
          Retry
        </button>
      )}
    >
      {children}
    </ErrorBoundary>
  );
}`,

            <h2>Micro-frontends — Decomposing at Scale</h2>
            <p>Micro-frontends apply microservice thinking to the frontend: independent teams own independent slices of the UI, deploy independently, and use potentially different technology stacks. The need arises when:</p>
            <ul>
              <li>Multiple teams need to work on the same application without constant coordination</li>
              <li>Different parts of the application have meaningfully different release cadences</li>
              <li>An existing monolith needs to be incrementally modernized</li>
            </ul>
            <p>The three principal implementation approaches have different tradeoffs:</p>
            <h3>Approach 1: Build-time composition (Module Federation)</h3>
            <p>Webpack Module Federation allows one application to consume components from another at runtime — they share a single page but are deployed and built independently.</p>

        checkout: 'checkout@https://checkout.example.com/remoteEntry.js',
        catalog:  'catalog@https://catalog.example.com/remoteEntry.js',

            <p>Tradeoffs: Teams are fully independent. Shared state between micro-frontends requires a shared mechanism (URL, events, shared store). Bundle size and performance require careful management of shared dependencies. TypeScript types across remote boundaries need explicit contracts.</p>
            <h3>Approach 2: Runtime composition (iframes)</h3>
            <p>iframes provide complete isolation — separate JavaScript runtime, separate DOM, separate network origin. The strongest isolation model, at the cost of UX complexity.</p>
            ${code(
              "tsx",

function PaymentMicrofrontend({ orderId, onComplete }) {
  const iframeRef = useRef(null);

  useEffect(() => {
    const handleMessage = (event) => {
      // ALWAYS validate origin in production
      if (event.origin !== 'https://payments.example.com') return;

      if (event.data.type === 'payment_complete') {
        onComplete(event.data.transactionId);
      }
    };

    window.addEventListener('message', handleMessage);
    return () => window.removeEventListener('message', handleMessage);
  }, [onComplete]);

  return (
    <iframe
      ref={iframeRef}
      src={\`https://payments.example.com/embed?orderId=\${orderId}\`}
      title="Payment form"
      // Security: limit capabilities
      sandbox="allow-scripts allow-same-origin allow-forms"
      // Prevent clickjacking in the payment app itself
    />
  );
}

// payment app — sending events to parent
function PaymentForm({ orderId }) {
  const handleSuccess = (transactionId) => {
    // Post message to parent shell
    window.parent.postMessage(
      { type: 'payment_complete', transactionId },
      'https://shell.example.com'  // ALWAYS specify target origin
    );
  };
}`,
            )}
            <p>Tradeoffs: Maximum isolation — a crash in the payment iframe never affects the shell. Shared authentication, styles, and state are difficult. Performance overhead of multiple page loads. URL and history management is complex.</p>
            <h3>Approach 3: Server-side composition (Edge / CDN)</h3>
            <p>Pages are assembled at the CDN/edge from fragments owned by different teams. This is the model used by large-scale platforms.</p>

  ↓
Fetches fragments in parallel:
  - Header fragment from team-navigation (CDN cached)
  - Product details fragment from team-catalog (SSR)
  - Reviews fragment from team-social (SSR)
  - Recommendations fragment from team-ml (SSR)
  ↓
Assembles response and streams to browser
  ↓
Client-side hydration per fragment`,

            <p>This approach keeps each fragment's bundle separate, each team's deployment independent, and the final page assembled without any client-side coordination. It is what companies like Zalando (MOSAIC) and DAZN use in production.</p>
            <h3>The shared state problem</h3>
            <p>The hardest micro-frontend problem is state that legitimately needs to be shared: authentication, cart contents, user preferences, feature flags. Solutions by isolation level:</p>

  Works but creates a coupling point

Medium isolation (iframes + postMessage):

  Good decoupling, limited to serializable data

High isolation (Server-side composition):

            <h2>Feature Flags — Controlled Rollout</h2>
            <p>Feature flags decouple deployment from release. Code is deployed to production continuously; features are enabled for specific users, percentages, or segments based on runtime configuration. This enables:</p>
            <ul>
              <li>Percentage rollouts that detect problems before 100% exposure</li>
              <li>A/B testing without separate deployments</li>
              <li>Kill switches for features that cause incidents</li>
              <li>Beta programs for early access users</li>
              <li>Environment-specific behavior without build-time configuration</li>
            </ul>
            <h3>A production-grade feature flag implementation</h3>
            ${code(
              "tsx",
              `// featureFlags/types.ts
type FlagValue = boolean | string | number | Record<string, unknown>;

interface FeatureFlag {
  key: string;
  value: FlagValue;
  enabled: boolean;
}

interface FlagContext {
  userId: string;
  userRole: string;
  environment: 'development' | 'staging' | 'production';
  percentile?: number; // 0-100, deterministic per user
}

// featureFlags/client.ts
class FeatureFlagClient {
  private flags: Map<string, FeatureFlag> = new Map();
  private context: FlagContext;

  constructor(context: FlagContext) {
    this.context = context;
  }

  async initialize(apiUrl: string): Promise<void> {
    const response = await fetch(\`\${apiUrl}/flags\`, {
      headers: { 'X-User-Id': this.context.userId },
    });
    const data = await response.json();
    data.flags.forEach((flag: FeatureFlag) => {
      this.flags.set(flag.key, flag);
    });
  }

  isEnabled(key: string, defaultValue = false): boolean {
    const flag = this.flags.get(key);
    if (!flag) return defaultValue;
    return flag.enabled;
  }

  getValue<T extends FlagValue>(key: string, defaultValue: T): T {
    const flag = this.flags.get(key);
    if (!flag || !flag.enabled) return defaultValue;
    return flag.value as T;
  }
}

// featureFlags/context.tsx
const FlagContext = createContext<FeatureFlagClient | null>(null);

export function FeatureFlagProvider({
  children,
  context,
  apiUrl,
}: {
  children: React.ReactNode;
  context: FlagContext;
  apiUrl: string;
}) {
  const [client, setClient] = useState<FeatureFlagClient | null>(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    const flagClient = new FeatureFlagClient(context);
    flagClient.initialize(apiUrl).then(() => {
      setClient(flagClient);
      setReady(true);
    });
  }, [context.userId, apiUrl]);

  if (!ready) return null; // or a loading state

  return (
    <FlagContext.Provider value={client}>
      {children}
    </FlagContext.Provider>
  );
}

export function useFlag(key: string, defaultValue = false): boolean {
  const client = useContext(FlagContext);
  if (!client) return defaultValue;
  return client.isEnabled(key, defaultValue);
}

export function useFlagValue<T extends FlagValue>(key: string, defaultValue: T): T {
  const client = useContext(FlagContext);
  if (!client) return defaultValue;
  return client.getValue(key, defaultValue);
}`,
            )}

            <h2>Security at the Component Level</h2>
            <p>React's architecture prevents many classical web vulnerabilities, but introduces some of its own. Senior developers know both.</p>
            <h3>XSS — what React prevents and what it doesn't</h3>
            ${code(
              "tsx",
              `// ✅ React escapes this automatically
// User input rendered as text content is safe
function Comment({ text }) {
  return <p>{text}</p>;
  // If text = '<scr\ipt>alert("xss")</scr\ipt>'
  // React renders it as literal text — the tags are escaped
  // Rendered HTML: <p>&lt;script&gt;alert("xss")&lt;/script&gt;</p>
}

// ❌ dangerouslySetInnerHTML bypasses React's protection
function RichContent({ html }) {
  return <div dangerouslySetInnerHTML={{ __html: html }} />;
  // If html = '<img onerror="stealCookies()" src="x">'
  // This executes the script — XSS vulnerability
}

// ✅ Sanitize before dangerouslySetInnerHTML
import DOMPurify from 'dompurify';

function SafeRichContent({ html }) {
  const sanitized = DOMPurify.sanitize(html, {
    ALLOWED_TAGS: ['b', 'i', 'em', 'strong', 'a', 'p', 'br'],
    ALLOWED_ATTR: ['href', 'target', 'rel'],
  });
  return <div dangerouslySetInnerHTML={{ __html: sanitized }} />;
}

// ❌ Dynamic href — javascript: URL injection
function Link({ href, children }) {
  return <a href={href}>{children}</a>;
  // If href = 'javascript:stealCookies()'
  // Clicking this link executes JavaScript
}

// ✅ Validate URL scheme before rendering
function SafeLink({ href, children }) {
  const isSafeUrl = /^https?:\\/\\//.test(href);
  if (!isSafeUrl) return <span>{children}</span>;
  return (
    <a href={href} rel="noopener noreferrer" target="_blank">
      {children}
    </a>
  );
}`,

            <h3>CSRF — Server Actions and form security</h3>
            ${code(
              "tsx",
              `// Server Actions in Next.js have built-in CSRF protection
// The framework validates the Origin header automatically

// For traditional API routes, implement CSRF tokens:
// 1. Server generates a token and sets it as a cookie
// 2. Client reads the cookie value (httpOnly=false for this one)
// 3. Client sends it as a header (X-CSRF-Token)
// 4. Server validates header matches cookie

function useCSRFToken() {
  return document.cookie
    .split('; ')
    .find(row => row.startsWith('csrf='))
    ?.split('=')[1];
}

async function secureFetch(url: string, options: RequestInit = {}) {
  const csrfToken = useCSRFToken(); // in practice: call outside hooks or read directly
  return fetch(url, {
    ...options,
    headers: {
      ...options.headers,
      'X-CSRF-Token': csrfToken ?? '',
    },
  });
}`,
            )}

class EventEmitter {
  private listeners = new Map<string, Set<Function>>();

  on(event: string, listener: Function) {
    if (!this.listeners.has(event)) {
      this.listeners.set(event, new Set());
    }
    this.listeners.get(event)!.add(listener);
    return () => this.off(event, listener); // returns unsubscribe
  }

  off(event: string, listener: Function) {
    this.listeners.get(event)?.delete(listener);
  }

  emit(event: string, ...args: any[]) {
    this.listeners.get(event)?.forEach(l => l(...args));
  }
}

const emitter = new EventEmitter();

// Hook that subscribes to events safely
function useEventEmitter(event: string, handler: Function) {
  useEffect(() => {
    return emitter.on(event, handler); // cleanup unsubscribes
  }, [event, handler]);
}

// ComponentA fires — doesn't know who's listening
function NotificationButton() {
  return (
    <button onClick={() => emitter.emit('notification', { text: 'Hello' })}>
      Notify
    </button>
  );
}

// ComponentB listens — doesn't know who fired
function NotificationDisplay() {
  const [message, setMessage] = useState('');
  useEventEmitter('notification', ({ text }) => setMessage(text));
  return <p>{message}</p>;
}`,
            )}
            <p>When to use: Cross-cutting concerns where neither component should know about the other — analytics events, toast notifications, modal triggers from deeply nested components.</p>

            <h3>3. Strategy Pattern — Swappable Algorithms</h3>
            <p>Inject different behavior implementations through props, keeping the component itself generic:</p>
            ${code(
              "jsx",
              `// A sortable list where the sort strategy is injected
interface SortStrategy<T> {
  compare: (a: T, b: T) => number;
  label: string;
}

const sortStrategies = {
  nameAsc:   { compare: (a, b) => a.name.localeCompare(b.name),  label: 'Name A-Z' },
  nameDesc:  { compare: (a, b) => b.name.localeCompare(a.name),  label: 'Name Z-A' },
  priceAsc:  { compare: (a, b) => a.price - b.price,             label: 'Price low-high' },
  priceDesc: { compare: (a, b) => b.price - a.price,             label: 'Price high-low' },
  rating:    { compare: (a, b) => b.rating - a.rating,           label: 'Top rated' },
};

function SortableList({ items, strategy, renderItem }) {
  const sorted = useMemo(
    () => [...items].sort(strategy.compare),
    [items, strategy]
  );

  return <ul>{sorted.map(renderItem)}</ul>;
}

// Consumer picks the strategy — component doesn't care which
function ProductPage() {
  const [strategy, setStrategy] = useState(sortStrategies.nameAsc);

  return (
    <>
      <select onChange={e => setStrategy(sortStrategies[e.target.value])}>
        {Object.entries(sortStrategies).map(([key, s]) => (
          <option key={key} value={key}>{s.label}</option>
        ))}
      </select>

      <SortableList
        items={products}
        strategy={strategy}
        renderItem={p => <ProductCard key={p.id} product={p} />}
      />
    </>
  );
}`,
            )}
            <p>When to use: Any component where the "how" varies but the "what" stays the same — sorting, filtering, formatting, validation.</p>

            <h3>4. Facade Pattern — Simplified Interface Over Complexity</h3>
            <p>Wrap a complex or third-party API with a simpler, domain-specific interface:</p>
            ${code(
              "jsx",
              `// Raw Stripe — complex API surface
import { loadStripe } from '@stripe/stripe-js';
import { Elements, CardElement, useStripe, useElements } from '@stripe/react-stripe-js';

// ❌ Every payment form needs to know about Stripe internals
function CheckoutForm() {
  const stripe = useStripe();
  const elements = useElements();

  const handleSubmit = async (e) => {
    e.preventDefault();
    const cardElement = elements.getElement(CardElement);
    const { error, paymentMethod } = await stripe.createPaymentMethod({
      type: 'card', card: cardElement,
    });
    if (error) { /* ... */ }
    // ... more Stripe API calls
  };
}

// ✅ Facade — hides Stripe complexity behind a clean interface
function usePayment() {
  const stripe = useStripe();
  const elements = useElements();
  const [state, setState] = useState({ status: 'idle', error: null });

  const processPayment = async (amount: number) => {
    setState({ status: 'loading', error: null });
    try {
      const cardElement = elements.getElement(CardElement);
      const { paymentMethod, error } = await stripe.createPaymentMethod({
        type: 'card', card: cardElement,
      });
      if (error) throw error;
      await chargeAPI(paymentMethod.id, amount);
      setState({ status: 'success', error: null });
    } catch (err) {
      setState({ status: 'error', error: err.message });
    }
  };

  return { processPayment, ...state };
}

// Consumer only sees processPayment — no Stripe knowledge needed
function CheckoutForm({ amount }) {
  const { processPayment, status, error } = usePayment();

  return (
    <form onSubmit={() => processPayment(amount)}>
      <CardElement />
      {error && <p>{error}</p>}
      <button disabled={status === 'loading'}>
        {status === 'loading' ? 'Processing...' : 'Pay'}
      </button>
    </form>
  );
}`,
            )}
            <p>When to use: Wrapping third-party libraries (Stripe, Google Maps, D3, WebSockets), complex browser APIs, or legacy code integrations.</p>

            <h3>5. Builder Pattern — Fluent Component Configuration</h3>
            <p>For components with many optional configurations, a builder API is often cleaner than a massive props interface:</p>
            ${code(
              "tsx",
              `// For very complex components — used in data grid / chart libraries

class TableBuilder<T> {
  private config = {
    columns: [] as Column<T>[],
    data:    [] as T[],
    pageSize: 10,
    sortable: false,
    selectable: false,
  };

  withData(data: T[]) {
    this.config.data = data;
    return this;
  }

  withColumn(column: Column<T>) {
    this.config.columns.push(column);
    return this;
  }

  withPagination(pageSize: number) {
    this.config.pageSize = pageSize;
    return this;
  }

  withSorting() {
    this.config.sortable = true;
    return this;
  }

  withSelection() {
    this.config.selectable = true;
    return this;
  }

  build() {
    return <DataTable {...this.config} />;
  }
}

// Usage — fluent, readable configuration
const table = new TableBuilder<User>()
  .withData(users)
  .withColumn({ key: 'name', header: 'Name' })
  .withColumn({ key: 'email', header: 'Email' })
  .withPagination(20)
  .withSorting()
  .build();`,
            )}
            <p>In React, this is more commonly seen as a configuration object pattern rather than a full class-based builder — but the concept is the same.</p>

            <h3>6. Slot Pattern — Named Content Injection</h3>
            <p>An alternative to render props for injecting content into specific named locations in a component:</p>
            ${code(
              "tsx",
              `// Card with named slots — more readable than multiple render props
interface CardProps {
  header?:  React.ReactNode;  // slot: header area
  body:     React.ReactNode;  // slot: main content (required)
  footer?:  React.ReactNode;  // slot: footer area
  aside?:   React.ReactNode;  // slot: sidebar
}

function Card({ header, body, footer, aside }: CardProps) {
  return (
    <div className="card">
      {header && <div className="card__header">{header}</div>}
      <div className="card__layout">
        <main className="card__body">{body}</main>
        {aside && <aside className="card__aside">{aside}</aside>}
      </div>
      {footer && <div className="card__footer">{footer}</div>}
    </div>
  );
}

// Usage — each slot receives whatever the consumer wants
<Card
  header={<h2>User Profile</h2>}
  body={<ProfileForm user={user} />}
  aside={<ActivityFeed userId={user.id} />}
  footer={
    <>
      <Button variant="ghost" onClick={onCancel}>Cancel</Button>
      <Button variant="primary" onClick={onSave}>Save</Button>
    </>
  }
/>`,
            )}
            <p>This is essentially how Radix UI's Dialog.Title, Dialog.Content, Dialog.Footer work — they're named slots implemented as compound components.</p>

            <h3>7. Proxy / Wrapper Pattern — Transparent Augmentation</h3>
            <p>Wrap a component to add behavior without changing its API:</p>
            ${code(
              "tsx",
              `// Add logging to ANY component without modifying it
function withLogging<P extends object>(
  Component: React.ComponentType<P>,
  componentName: string
) {
  return function LoggedComponent(props: P) {
    useEffect(() => {
      analytics.track('component_mounted', { component: componentName });
      return () => analytics.track('component_unmounted', { component: componentName });
    }, []);

    return <Component {...props} />;
  };
}

// Add error boundary to any component
function withErrorBoundary<P extends object>(
  Component: React.ComponentType<P>,
  fallback: React.ReactNode
) {
  return function SafeComponent(props: P) {
    return (
      <ErrorBoundary fallback={fallback}>
        <Component {...props} />
      </ErrorBoundary>
    );
  };
}

// Compose: logging + error boundary + suspense
const SafeUserProfile = withLogging(
  withErrorBoundary(
    withSuspense(UserProfile, <ProfileSkeleton />),
    <ProfileError />
  ),
  'UserProfile'
);`,
            )}

    </script>

    <script>
      /* =========================================================
         APP — navigation, rendering, state, interactions
         ========================================================= */
      const LS_KEY = "react-course-progress";
      const LS_THEME = "react-course-theme";
      const LS_CHAPTER = "react-course-chapter";

      const state = {
        current: parseInt(localStorage.getItem(LS_CHAPTER) || "1", 10),
        done: new Set(JSON.parse(localStorage.getItem(LS_KEY) || "[]")),
      };

      const $ = (sel) => document.querySelector(sel);
      const navEl = $("#nav");
      const articleEl = $("#article");

      /* ---------- Build sidebar ---------- */
      function buildNav() {
        const q = ($("#search").value || "").toLowerCase().trim();
        navEl.innerHTML = "";
        PARTS.forEach((part) => {
          const chapters = CHAPTERS.filter(
            (c) =>
              c.part === part.id &&
              (!q ||
                c.title.toLowerCase().includes(q) ||
                c.lede.toLowerCase().includes(q) ||
                String(c.id) === q),
          );
          if (!chapters.length) return;

          const partEl = document.createElement("div");
          partEl.className = "part";
          partEl.innerHTML = `
            <div class="part-header">
              <span class="part-num">Part ${part.id}</span>
              <span class="part-title">${part.title}</span>
              <svg class="part-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
            </div>
            <ul class="chapter-list"></ul>`;
          const list = partEl.querySelector(".chapter-list");

          chapters.forEach((c) => {
            const li = document.createElement("li");
            const isActive = c.id === state.current;
            const isDone = state.done.has(c.id);
            li.className =
              "chapter-link" +
              (isActive ? " active" : "") +
              (isDone ? " done" : "");
            li.innerHTML = `
              <span class="chapter-dot"><span class="num">${c.id}</span></span>
              <span class="chapter-name">${c.title}</span>`;
            li.addEventListener("click", () => goTo(c.id));
            list.appendChild(li);
          });

          partEl
            .querySelector(".part-header")
            .addEventListener("click", () =>
              partEl.classList.toggle("collapsed"),
            );
          navEl.appendChild(partEl);
        });
      }

      /* ---------- Render a chapter ---------- */
      function render() {
        const c = CHAPTERS.find((x) => x.id === state.current);
        if (!c) return;
        const part = PARTS.find((p) => p.id === c.part);
        const prev = CHAPTERS.find((x) => x.id === c.id - 1);
        const next = CHAPTERS.find((x) => x.id === c.id + 1);
        const isDone = state.done.has(c.id);

        articleEl.innerHTML = `
          <div class="chapter-hero">
            <span class="chapter-eyebrow">Part ${part.id} · ${part.title} · Chapter ${c.id}</span>
            <h1>${c.title}</h1>
            <p class="lede">${c.lede}</p>
          </div>
          <div class="prose">${c.body()}</div>
          <button class="complete-btn ${isDone ? "done" : ""}" id="completeBtn">
            ${isDone ? "✓ Completed" : "Mark chapter complete"}
          </button>
          <div class="chapter-nav">
            <button class="cnav-btn prev" ${prev ? "" : "disabled"}>
              <div class="cnav-label">← Previous</div>
              <div class="cnav-title">${prev ? prev.title : "Start of course"}</div>
            </button>
            <button class="cnav-btn next" ${next ? "" : "disabled"}>
              <div class="cnav-label">Next →</div>
              <div class="cnav-title">${next ? next.title : "Course complete 🎉"}</div>
            </button>
          </div>`;

        // Crumbs
        $("#crumbs").innerHTML = `
          <span>Part ${part.id}</span><span class="sep">/</span>
          <span>${part.title}</span><span class="sep">/</span>
          <b>${c.title}</b>`;

        // Wire interactions
        wireCodeCopy();
        wireReadTabs();
        wireSteppers();
        wirePrevNext(prev, next);
        $("#completeBtn").addEventListener("click", toggleComplete);

        // Persist + reset scroll
        localStorage.setItem(LS_CHAPTER, String(c.id));
        document.querySelector(".content").scrollIntoView({ block: "start" });
        window.scrollTo(0, 0);
        buildNav();
        updateProgress();
      }

      function goTo(id) {
        if (id < 1 || id > CHAPTERS.length) return;
        state.current = id;
        render();
        closeSidebar();
      }

      function toggleComplete() {
        if (state.done.has(state.current)) state.done.delete(state.current);
        else {
          state.done.add(state.current);
          showToast("Chapter marked complete ✓");
        }
        localStorage.setItem(LS_KEY, JSON.stringify([...state.done]));
        render();
      }

      /* ---------- Progress ---------- */
      function updateProgress() {
        const pct = Math.round((state.done.size / CHAPTERS.length) * 100);
        $("#progressFill").style.width = pct + "%";
        $("#progressPct").textContent = pct + "%";
        $("#footProgress").textContent =
          `${state.done.size} / ${CHAPTERS.length} complete`;
      }

      /* ---------- Code copy buttons ---------- */
      function wireCodeCopy() {
        document.querySelectorAll(".copy-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const codeEl = btn.closest(".code-block").querySelector("code");
            navigator.clipboard
              .writeText(codeEl.innerText)
              .then(() => {
                btn.textContent = "Copied!";
                btn.classList.add("copied");
                setTimeout(() => {
                  btn.textContent = "Copy";
                  btn.classList.remove("copied");
                }, 1600);
              })
              .catch(() => showToast("Copy failed"));
          });
        });
      }

      /* ---------- Old/New read tabs ---------- */
      function wireReadTabs() {
        document.querySelectorAll(".reads").forEach((reads) => {
          const tabs = reads.querySelectorAll(".read-tab");
          const panels = reads.querySelectorAll(".read-panel");
          tabs.forEach((tab, i) => {
            tab.addEventListener("click", () => {
              tabs.forEach((t) => t.classList.remove("active"));
              panels.forEach((p) => p.classList.remove("active"));
              tab.classList.add("active");
              panels[i].classList.add("active");
            });
          });
        });
      }

      function wirePrevNext(prev, next) {
        const prevBtn = articleEl.querySelector(".cnav-btn.prev");
        const nextBtn = articleEl.querySelector(".cnav-btn.next");
        if (prev) prevBtn.addEventListener("click", () => goTo(prev.id));
        if (next) nextBtn.addEventListener("click", () => goTo(next.id));
      }

      /* ---------- Interactive steppers ---------- */
      const STEPPERS = {
        usememo: {
          scenarios: [
            {
              name: "First render",
              steps: [
                {
                  t: "React calls your component function",
                  d: "Dashboard() is invoked. React walks through each hook call in order.",
                  c: `function Dashboard({ userId, theme }) {\n  // hook 0\n  const [count, setCount] = useState(0);\n  // hook 1 — we're here\n  const config = useMemo(\n    () => buildConfig(userId, theme),\n    [userId, theme]\n  );\n}`,
                },
                {
                  t: "useMemo hook slot is created",
                  d: "No previous deps exist on the fiber. React must run the factory for the first time.",
                  c: `fiber.memoizedState = {\n  // slot for hook 1 — currently empty\n  memoizedState: null,\n  next: /* next hook */\n}`,
                },
                {
                  t: "Factory function runs",
                  d: "buildConfig(userId, theme) executes and produces the initial value.",
                  c: `const value = buildConfig(userId, theme);\n// e.g. { userId, colorScheme, gridLines }`,
                },
                {
                  t: "Store [value, deps] in the slot",
                  d: "React saves the result and the current deps array together in the hook slot.",
                  c: `slot.memoizedState = [\n  value,            // cached result\n  [userId, theme],  // deps snapshot\n];`,
                },
                {
                  t: "Return the value",
                  d: "The computed config is returned and used in this render's output.",
                  c: `return config; // first computed reference`,
                },
              ],
            },
            {
              name: "Cache hit (deps same)",
              steps: [
                {
                  t: "Re-render triggered",
                  d: "An unrelated state change (e.g. count) re-renders Dashboard. The function runs again.",
                  c: `setCount(c => c + 1); // userId & theme unchanged`,
                },
                {
                  t: "Read stored deps",
                  d: "React reads the previous depsArray from hook slot 1.",
                  c: `const [prevValue, prevDeps] = slot.memoizedState;\n// prevDeps = [userId, theme]`,
                },
                {
                  t: "Compare with Object.is",
                  d: "Each dep is compared positionally. All comparisons return true.",
                  c: `Object.is(prevDeps[0], userId); // true\nObject.is(prevDeps[1], theme);  // true`,
                },
                {
                  t: "All deps match → skip factory",
                  d: "buildConfig does NOT run. No new object is allocated.",
                  c: `// factory skipped entirely`,
                },
                {
                  t: "Return cached value",
                  d: "The same config reference from the previous render is returned — referentially stable.",
                  c: `return prevValue; // identical reference`,
                },
              ],
            },
            {
              name: "Cache miss (dep changed)",
              steps: [
                {
                  t: "Re-render triggered",
                  d: "theme changes from 'light' to 'dark'. Dashboard re-renders.",
                  c: `setTheme('dark'); // theme dep will change`,
                },
                {
                  t: "Read stored deps",
                  d: "React reads the previous deps from the slot.",
                  c: `const [prevValue, prevDeps] = slot.memoizedState;\n// prevDeps = [userId, 'light']`,
                },
                {
                  t: "Compare with Object.is",
                  d: "At least one comparison returns false — a dependency changed.",
                  c: `Object.is(prevDeps[0], userId); // true\nObject.is('light', 'dark');     // false`,
                },
                {
                  t: "Run the factory again",
                  d: "buildConfig(userId, 'dark') executes, producing a brand new config object.",
                  c: `const value = buildConfig(userId, 'dark');\n// NEW reference`,
                },
                {
                  t: "Store new [value, deps]",
                  d: "React overwrites the slot with the new value and the new deps snapshot.",
                  c: `slot.memoizedState = [value, [userId, 'dark']];`,
                },
                {
                  t: "Return the new value",
                  d: "The new reference flows down — React.memo children that receive it will re-render.",
                  c: `return config; // changed reference → memo child updates`,
                },
              ],
            },
            {
              name: "Component unmounts",
              steps: [
                {
                  t: "Component removed",
                  d: "Dashboard is unmounted from the render tree.",
                  c: `// <Dashboard /> no longer rendered`,
                },
                {
                  t: "Hook slots discarded",
                  d: "The fiber and its linked list of hook states are released by React.",
                  c: `fiber.memoizedState = null; // list detached`,
                },
                {
                  t: "Cached value freed",
                  d: "The cached config and depsArray become eligible for garbage collection.",
                  c: `// [value, deps] → GC reclaims memory`,
                },
              ],
            },
          ],
        },
      };

      function wireSteppers() {
        document.querySelectorAll("[data-stepper]").forEach((el) => {
          const data = STEPPERS[el.getAttribute("data-stepper")];
          if (!data) return;
          let sc = 0;
          let st = 0;

          el.innerHTML = `
            <div class="stp-scenarios">
              ${data.scenarios
                .map(
                  (s, i) =>
                    `<button class="stp-tab${
                      i === 0 ? " active" : ""
                    }" data-sc="${i}">${s.name}</button>`,
                )
                .join("")}
            </div>
            <div class="stp-progress"></div>
            <div class="stp-body"></div>
            <div class="stp-controls">
              <button class="stp-btn stp-back">← Back</button>
              <button class="stp-btn stp-next">Next step →</button>
              <button class="stp-btn stp-reset">Reset</button>
            </div>`;

          const tabs = el.querySelectorAll(".stp-tab");
          const progress = el.querySelector(".stp-progress");
          const bodyEl = el.querySelector(".stp-body");
          const backBtn = el.querySelector(".stp-back");
          const nextBtn = el.querySelector(".stp-next");
          const resetBtn = el.querySelector(".stp-reset");

          function draw() {
            const steps = data.scenarios[sc].steps;
            const step = steps[st];
            tabs.forEach((t, i) => t.classList.toggle("active", i === sc));
            progress.innerHTML = steps
              .map(
                (_, i) =>
                  `<span class="stp-dot${i === st ? " active" : ""}${
                    i < st ? " done" : ""
                  }"></span>`,
              )
              .join("");
            bodyEl.innerHTML = `
              <div class="stp-num">${st + 1}</div>
              <div class="stp-step">
                <div class="stp-step-title">${step.t}</div>
                <p class="stp-step-desc">${step.d}</p>
                ${step.c ? `<pre class="stp-code">${esc(step.c)}</pre>` : ""}
                <div class="stp-count">Step ${st + 1} of ${steps.length}</div>
              </div>`;
            backBtn.disabled = st === 0;
            nextBtn.disabled = st === steps.length - 1;
          }

          tabs.forEach((tab) =>
            tab.addEventListener("click", () => {
              sc = parseInt(tab.getAttribute("data-sc"), 10);
              st = 0;
              draw();
            }),
          );
          backBtn.addEventListener("click", () => {
            if (st > 0) st--;
            draw();
          });
          nextBtn.addEventListener("click", () => {
            if (st < data.scenarios[sc].steps.length - 1) st++;
            draw();
          });
          resetBtn.addEventListener("click", () => {
            st = 0;
            draw();
          });

          draw();
        });
      }

      /* ---------- Theme ---------- */
      function initTheme() {
        const saved = localStorage.getItem(LS_THEME);
        const theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      }
      $("#themeBtn").addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme");
        const next = cur === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem(LS_THEME, next);
      });

      /* ---------- Reading progress bar ---------- */
      window.addEventListener("scroll", () => {
        const h =
          document.documentElement.scrollHeight -
          document.documentElement.clientHeight;
        const pct = h > 0 ? (window.scrollY / h) * 100 : 0;
        $("#readBar").style.width = pct + "%";
      });

      /* ---------- Mobile sidebar ---------- */
      const sidebar = $("#sidebar");
      const overlay = $("#overlay");
      function closeSidebar() {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
      }
      $("#menuBtn").addEventListener("click", () => {
        sidebar.classList.toggle("open");
        overlay.classList.toggle("show");
      });
      overlay.addEventListener("click", closeSidebar);

      /* ---------- Search ---------- */
      $("#search").addEventListener("input", buildNav);

      /* ---------- Keyboard nav ---------- */
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        if (e.key === "ArrowRight") goTo(state.current + 1);
        if (e.key === "ArrowLeft") goTo(state.current - 1);
      });

      /* ---------- Toast ---------- */
      let toastTimer;
      function showToast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
      }

      /* ---------- Boot ---------- */
      initTheme();
      buildNav();
      render();
    </script>
  </body>
</html>
