                  <li><span class="ff-key">3b</span> Any changed → run factory, store new [value, deps]</li>
                  <li><span class="ff-key">!</span> Hook order is the identity — conditional hooks shift positions → wrong slot → wrong value. Cached value stays in memory until component unmounts.</li>

            <h2>Memory Usage — What Each Tool Allocates</h2>
            <p>This is what most articles never tell you. Every memoization tool holds memory for the lifetime of the component — not just until the next render.</p>
            <h3>useMemo memory footprint</h3>
            ${code(
              "txt",
              `useMemo(() => expensiveComputation(a, b), [a, b])

Allocates and holds in memory for component lifetime:
┌──────────────────────────────────────────────────┐
│  Hook slot on fiber                               │
│  ├── cachedValue     → the result object/array    │
│  │   (held in memory even if nothing uses it)     │
│  └── depsArray       → [a, b]                      │
│      (previous values, one slot per dep)          │
└──────────────────────────────────────────────────┘

Per render overhead (even on cache hit):
- Read depsArray from fiber memory
- Run Object.is() for each dep
- Return cached value reference`,
            )}
            <p>The cachedValue is retained in memory as long as the component is mounted. If you useMemo a large array of processed records, that entire array stays in memory even while the user has scrolled away and the component is hidden. The garbage collector cannot reclaim it until the component unmounts.</p>
            <h3>useCallback memory footprint</h3>
            ${code(
              "txt",
              `useCallback((id) => deleteItem(userId, id), [userId])

Allocates and holds in memory:
┌──────────────────────────────────────────────────┐
│  Hook slot on fiber                               │
│  ├── cachedFunction  → the function object        │
│  │   (closure over userId — holds userId in scope)│
│  └── depsArray       → [userId]                   │
└──────────────────────────────────────────────────┘`,
            )}
            <p>The function object itself is tiny — a few bytes. But the closure is the important part. The memoized function closes over every variable in its scope at creation time. If userId is a large object, the cached function keeps a reference to it — preventing garbage collection.</p>
            <h3>React.memo memory footprint</h3>
            ${code(
              "txt",
              `React.memo wraps the component in a special fiber type.
It stores the PREVIOUS render's props for comparison.

Memory held per memoized component instance:
┌──────────────────────────────────────────────────┐
│  Previous props object (entire snapshot)          │
│  ├── prop1: value                                 │
│  ├── prop2: value                                 │
│  └── ...every prop passed to the component        │
└──────────────────────────────────────────────────┘

This is why React.memo on a component receiving large
object props doubles the memory footprint of those props —
you now hold both current AND previous versions.`,
            )}
            <p>This matters in list components. If you have 1000 memoized &lt;Row&gt; components each receiving a large data prop, React holds 1000 previous data snapshots in memory simultaneously for comparison purposes.</p>

            <h2>The Object.is Algorithm — Exactly What React Compares</h2>
            <p>Every comparison in React's memoization system uses Object.is. Understanding its precise rules prevents an entire class of bugs.</p>
            ${code(
              "js",
              `// Object.is is almost identical to === with two special cases:

Object.is(NaN, NaN)   // true  (=== returns false)
Object.is(+0, -0)     // false (=== returns true)

// Everything else behaves like ===:
Object.is(1, 1)           // true
Object.is('a', 'a')       // true
Object.is(null, null)     // true
Object.is(undefined, undefined) // true
Object.is({}, {})         // false — different references
Object.is([], [])         // false — different references
Object.is(fn, fn)         // true — SAME function reference
Object.is(fn, () => {})   // false — different function objects`,
            )}
            <p>Now trace exactly what happens when React compares deps in useMemo:</p>
            ${code(
              "jsx",
              `// Render 1:
const results = useMemo(() => process(data, filters), [data, filters]);
// React stores: prevDeps = [data_ref_1, filters_ref_1]
// React stores: cachedResult = result_1

// Render 2 — filters changes:
// React reads prevDeps = [data_ref_1, filters_ref_1]
// Object.is(data_ref_1, data_ref_1) -> true (same ref, unchanged)
// Object.is(filters_ref_1, filters_ref_2) -> false (new ref, changed)
// At least one dep changed -> recompute
// React stores: prevDeps = [data_ref_1, filters_ref_2]
// React stores: cachedResult = result_2

// Render 3 — only count changes (unrelated state):
// React reads prevDeps = [data_ref_1, filters_ref_2]
// Object.is(data_ref_1, data_ref_1) -> true
// Object.is(filters_ref_2, filters_ref_2) -> true
// All deps same -> return cachedResult (result_2)
// No recomputation`,
            )}
            <p>The critical insight: Object.is on objects and arrays compares memory addresses, not content. Two objects with identical content at different addresses are not equal:</p>
            ${code(
              "js",
              `const a = { x: 1 };
const b = { x: 1 };
Object.is(a, b); // false — different addresses in memory
Object.is(a, a); // true — same address

// This is why:
const dep = { userId: 1 };    // new object every render
useMemo(() => compute(dep), [dep]); // ALWAYS recomputes — dep is always new`,
            )}

            <h2>How useMemo Works Step by Step — The Algorithm</h2>
            <p>Here is the precise execution flow React uses internally, rendered as an interactive stepper:</p>
            <div class="stepper" data-stepper="usememo"></div>

            <h2>How React.memo Works Internally — The Wrapper Mechanism</h2>
            <p>React.memo doesn't modify your component. It creates a new fiber type — REACT_MEMO_TYPE — that wraps it. During reconciliation React handles this type specially:</p>
            ${code(
              "txt",
              `Without React.memo:
  Parent renders -> React calls Child() unconditionally

With React.memo:
  Parent renders -> React checks MemoizedChild fiber type
                 -> reads stored prevProps
                 -> runs compare(prevProps, nextProps)
                 -> if equal: reuses previous fiber output (bails out)
                 -> if different: calls Child() with new props`,
            )}
            <p>The stored prevProps is literally the entire props object from the last render, kept alive in the fiber. This is what enables the comparison — and this is what costs memory.</p>
            ${code(
              "jsx",
              `// React.memo source (simplified conceptually)
function memo(Component, compare) {
  return {
    $$typeof: REACT_MEMO_TYPE,
    type: Component,
    compare: compare ?? null,  // null = use default shallowEqual
  };
}

// During reconciliation, React does:
function updateMemoComponent(current, workInProgress, newProps) {
  const prevProps = current.memoizedProps; // stored last render props
  const compare = workInProgress.type.compare;

  const shouldUpdate = compare
    ? !compare(prevProps, newProps)         // custom comparator
    : !shallowEqual(prevProps, newProps);   // default shallow equal

  if (!shouldUpdate) {
    // Bail out — reuse previous render output
    return bailoutOnAlreadyFinishedWork(current, workInProgress);
  }

  // Re-render
  return updateFunctionComponent(current, workInProgress, Component, newProps);
}`,
            )}
            <p>The shallowEqual function iterates every key in both objects and runs Object.is on each value pair. This is why it's called "shallow" — it only goes one level deep. Nested objects are compared by reference, not content.</p>
            ${code(
              "js",
              `function shallowEqual(objA, objB) {
  if (Object.is(objA, objB)) return true;       // same reference -> equal
  if (typeof objA !== 'object') return false;   // primitives already handled above

  const keysA = Object.keys(objA);
  const keysB = Object.keys(objB);

  if (keysA.length !== keysB.length) return false; // different number of props

  for (let i = 0; i < keysA.length; i++) {
    const key = keysA[i];
    if (!Object.is(objA[key], objB[key])) return false; // any mismatch -> not equal
  }

  return true; // all keys matched
}`,
            )}
            <p>The cost: n Object.is comparisons per render where n is the number of props. For a component with 10 props, that's 10 comparisons on every parent render. For 100 memoized list items each with 5 props, that's 500 comparisons on every parent render — even when nothing changed.</p>

            <h2>The Closure Capture Problem — Memory Leak Pattern</h2>
            <p>useCallback specifically has a memory implication that developers consistently miss. Every memoized function captures its closure — the variables in scope at creation time. If those variables are large, the memoized function keeps them alive in memory even after they're no longer needed elsewhere.</p>
            ${code(
              "jsx",
              `function ReportViewer({ reportId }) {
  // This is 10MB of data
  const [rawData, setRawData] = useState(fetchHugeDataset());

  // MEMORY RETENTION — useCallback captures rawData in closure
  // Even if rawData changes and the old value is "stale",
  // the cached function object holds a reference to the OLD rawData
  // preventing garbage collection of the old 10MB dataset
  const handleExport = useCallback(() => {
    exportToCSV(rawData); // rawData captured in closure
  }, [rawData]);
  // Each time rawData changes:
  // - new function allocated (capturing new rawData)
  // - old function still alive until next render completes
  // - Briefly, TWO 10MB datasets are in memory simultaneously

  // BETTER — use a ref to always read latest value
  // No closure capture, no memory retention
  const rawDataRef = useRef(rawData);
  useEffect(() => { rawDataRef.current = rawData; }, [rawData]);

  const handleExport = useCallback(() => {
    exportToCSV(rawDataRef.current); // reads current value, no closure
  }, []); // stable forever — no deps, no re-creation
}`,
            )}
            <p>The ref pattern for stable callbacks that need current values is a senior-level pattern worth knowing. It avoids the closure capture entirely.</p>

            <h2>Structural Sharing — Why Memoization Doesn't Duplicate the Whole Tree</h2>
            <p>One thing that confuses developers: if useMemo caches a large nested object and only one field changes, does it duplicate the entire object?</p>
            <p>No. React's immutability convention combined with JavaScript's reference semantics means that unchanged sub-trees share the same memory:</p>
            ${code(
              "txt",
              `Before update:
config = {
  userId: 1,         <- 8 bytes
  settings: {        <- ref to Settings object (shared)
    gridLines: true,
    pageSize: 20,
  },
  colorScheme: [...]  <- ref to Array (shared)
}

After update (userId changes to 2):
newConfig = {
  userId: 2,          <- 8 bytes (changed)
  settings: same ref, <- SAME Settings object in memory (shared, no copy)
  colorScheme: same ref <- SAME Array in memory (shared, no copy)
}

Memory overhead = only the new top-level object shell (~50 bytes)
NOT a full deep copy of the entire structure`,
            )}
            <p>This is structural sharing — unchanged nested objects are reused by reference. You're paying for a new container object but not copying any of the contents that haven't changed. This is why immutable updates are efficient despite never mutating in place.</p>

            <h2>The React Compiler's Memory Model</h2>
            <p>The React Compiler (React 19) inserts memoization automatically. Understanding what it does differently from manual memoization is important for knowing when you still need to intervene manually.</p>
            <p>The compiler performs escape analysis — it determines which values actually "escape" their render scope and need to be stable. A value that is only used locally (never passed down as a prop or used as a dep) doesn't need memoization even if it's an object. The compiler knows this. Manual memoization cannot know this without you making the judgment call.</p>
            ${code(
              "jsx",
              `// What you write:
function Component({ items }) {
  const sorted = items.slice().sort((a, b) => a.name.localeCompare(b.name));
  const total = sorted.reduce((sum, item) => sum + item.price, 0);
  return <div>{total} items: {sorted.map(i => <span key={i.id}>{i.name}</span>)}</div>;
}

// What the compiler understands:
// - \`sorted\` escapes into JSX -> needs stable reference (useMemo candidate)
// - \`total\` is a primitive (number) -> no memoization needed
// - The map callback creates new <span> elements -> React.memo on span is useless

// What the compiler generates (conceptually):
function Component({ items }) {
  const sorted = useMemo(() =>
    items.slice().sort((a, b) => a.name.localeCompare(b.name)),
    [items]
  );
  const total = sorted.reduce((sum, item) => sum + item.price, 0); // not memoized
  return <div>{total} items: {sorted.map(i => <span key={i.id}>{i.name}</span>)}</div>;
}`,
            )}
            <p>The compiler is more conservative about memory allocation too — it avoids memoizing values that change frequently enough that the cache would almost always miss, since a cache miss costs more than no cache at all.</p>

            <p>Now you can build the complete mental model for what each tool costs:</p>

            <h2>Three More Topics Worth Knowing Deeply</h2>
            <h3>1. Why Hook Order Is Sacred — The Linked List Invariant</h3>
            <p>The reason hooks cannot be called conditionally comes directly from the linked list structure. React identifies each hook by its position in the list, not by any name or key. If you add or remove a hook between renders, every subsequent hook reads the wrong slot:</p>
            ${code(
              "jsx",
              `// CONDITIONAL HOOK — destroys the linked list order
function Component({ userId }) {
  const [count, setCount] = useState(0);    // slot 0

  if (userId) {
    const [name, setName] = useState('');   // slot 1 on some renders
  }

  const data = useMemo(() => fetch(userId), [userId]); // slot 1 or 2?
}

// Render 1: userId exists
// slot 0 -> useState(0)
// slot 1 -> useState('')   <- conditional hook
// slot 2 -> useMemo(...)

// Render 2: userId is null — conditional hook skipped
// slot 0 -> useState(0)
// slot 1 -> useMemo(...)   <- WRONG! React reads slot 1 expecting useState
//                            but gets useMemo's [cachedValue, deps]
// React now thinks your useMemo is your useState — corrupt state`,
            )}
            <p>This is not a rule React imposes for philosophical reasons. It's a direct consequence of the linked list implementation. The list has no keys — position is identity.</p>
            <h3>2. The Dependency Comparison Performance Trap</h3>
            <p>A subtle performance trap appears when you have many dependencies in a useMemo or useCallback:</p>
            ${code(
              "jsx",
              `// EXPENSIVE COMPARISON — 10 deps means 10 Object.is calls per render
const result = useMemo(() => compute(a, b, c, d, e, f, g, h, i, j), [a, b, c, d, e, f, g, h, i, j]);

// If this component renders 60 times per second (animation):
// 60 × 10 = 600 Object.is calls per second just for this one useMemo
// On a mobile device this is measurable

// BETTER — if all these values come from one source, memoize the source
const config = useMemo(() => buildConfig(source), [source]);
const result = useMemo(() => compute(config), [config]);
// Now: 1 Object.is for the outer memo, 1 for the inner memo = 2 per render`,
            )}
            <p>The number of dependencies has a direct cost. Designing deps to be minimal — by grouping related values upstream — reduces the comparison overhead proportionally.</p>
            <h3>3. StrictMode and Double-Invocation of Factory Functions</h3>
            <p>React 18 Strict Mode calls your component function twice in development. This extends to useMemo factories:</p>
            ${code(
              "jsx",
              `function Component() {
  const result = useMemo(() => {
    console.log('factory running'); // logs TWICE in Strict Mode development
    return expensiveComputation();
  }, []);
}
// In production: logs once
// In development (Strict Mode): logs twice
// React runs the factory, discards the result, runs it again, keeps second result`,
            )}

            <h2>Summary of What We Covered</h2>

  return (

  return (

            <h2>The Context + useReducer Pattern — The Senior Architecture</h2>
            <p>The most powerful and scalable context pattern combines useContext with useReducer. This gives you Redux-like architecture without any external library — a single source of truth, explicit action-based state transitions, and clean separation of state from dispatch.</p>
            <p>The key insight: separate the state context from the dispatch context. State changes cause re-renders. Dispatch never changes (it's a stable function from useReducer). Components that only dispatch actions — they never need to re-render just because state changed.</p>
            ${code(
              "jsx",
              `// State and dispatch live in separate contexts
const AuthStateContext    = createContext(null);
const AuthDispatchContext = createContext(null);

const initialState = { user: null, status: 'idle', error: null };

function authReducer(state, action) {
  switch (action.type) {
    case 'login/start':
      return { ...state, status: 'loading', error: null };
    case 'login/success':
      return { status: 'authenticated', user: action.payload, error: null };
    case 'login/error':
      return { ...state, status: 'error', error: action.error };
    case 'logout':
      return initialState;
    default:
      throw new Error(\`Unknown action: \${action.type}\`);
  }
}

// Provider encapsulates all auth logic
function AuthProvider({ children }) {
  const [state, dispatch] = useReducer(authReducer, initialState);

  return (
    // dispatch is stable — never causes AuthDispatchContext consumers to re-render
    <AuthDispatchContext.Provider value={dispatch}>
      {/* state changes DO cause AuthStateContext consumers to re-render */}
      <AuthStateContext.Provider value={state}>
        {children}
      </AuthStateContext.Provider>
    </AuthDispatchContext.Provider>
  );
}

// Custom hooks — the clean public API for this context
function useAuthState() {
  const ctx = useContext(AuthStateContext);
  if (!ctx) throw new Error('useAuthState must be used within AuthProvider');
  return ctx;
}

function useAuthDispatch() {
  const ctx = useContext(AuthDispatchContext);
  if (!ctx) throw new Error('useAuthDispatch must be used within AuthProvider');
  return ctx;
}

// Components that only dispatch — NEVER re-render due to auth state changes
function LoginButton() {
  const dispatch = useAuthDispatch(); // stable — no re-renders from state changes

  const handleLogin = async (credentials) => {
    dispatch({ type: 'login/start' });
    try {
      const user = await loginAPI(credentials);
      dispatch({ type: 'login/success', payload: user });
    } catch (err) {
      dispatch({ type: 'login/error', error: err.message });
    }
  };

  return <button onClick={handleLogin}>Log in</button>;

  const { user, status } = useAuthState();
  if (status !== 'authenticated') return null;
  return <img src={user.avatar} alt={user.name} />;

function UserProvider({ initialUser, children }) {

            <h2>Production-Grade Context Pattern — Everything Together</h2>

  | { status: 'authenticated'; user: AuthUser }
  | { status: 'error'; message: string };

type AuthAction =
  | { type: 'login/start' }
  | { type: 'login/success'; payload: AuthUser }
  | { type: 'login/error'; message: string }
  | { type: 'logout' };

// context.tsx
const AuthStateCtx    = createContext<AuthState | null>(null);
const AuthDispatchCtx = createContext<Dispatch<AuthAction> | null>(null);

function authReducer(state: AuthState, action: AuthAction): AuthState {
  switch (action.type) {
    case 'login/start':   return { status: 'loading' };
    case 'login/success': return { status: 'authenticated', user: action.payload };
    case 'login/error':   return { status: 'error', message: action.message };
    case 'logout':        return { status: 'idle' };
  }
}

export function AuthProvider({ children }: { children: ReactNode }) {
  const [state, dispatch] = useReducer(authReducer, { status: 'idle' });

  return (
    <AuthDispatchCtx.Provider value={dispatch}>
      <AuthStateCtx.Provider value={state}>
        {children}
      </AuthStateCtx.Provider>
    </AuthDispatchCtx.Provider>
  );
}

// Custom hooks — the only public API consumers use
export function useAuthState(): AuthState {
  const ctx = useContext(AuthStateCtx);
  if (!ctx) throw new Error('useAuthState must be inside AuthProvider');
  return ctx;
}

export function useAuthDispatch(): Dispatch<AuthAction> {
  const ctx = useContext(AuthDispatchCtx);
  if (!ctx) throw new Error('useAuthDispatch must be inside AuthProvider');
  return ctx;
}

// Convenience hooks that derive from state
export function useCurrentUser(): AuthUser | null {
  const state = useAuthState();
  return state.status === 'authenticated' ? state.user : null;
}

export function useIsAuthenticated(): boolean {
  const state = useAuthState();
  return state.status === 'authenticated';
}`,

            <p>For local state-driven computation (filtering an array, computing derived data), useTransition/useDeferredValue is strictly better than debouncing. There is no debounce delay, work starts immediately, and it can be interrupted.</p>

function SearchBox() {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);
  const [isPending, startTransition] = useTransition();
  const debounceRef = useRef(null);

  const handleChange = (e) => {
    const value = e.target.value;
    setQuery(value); // immediate — SyncLane

    // Debounce the NETWORK REQUEST (avoid spamming the server)
    clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => {
      // But wrap the state update in a transition (non-urgent)
      startTransition(async () => {
        const data = await searchAPI(value);
        setResults(data);
      });
    }, 300);
  };
}`,
            )}

  startTransition(() => {
    setQuery(e.target.value);
  });

  // ❌ MISTAKE — putting urgent input inside transition
  // The input now lags because setQuery is in TransitionLane
  // Use startTransition only for the heavy/non-urgent updates
};

// ✅ CORRECT
const handleChange = (e) => {
  setQuery(e.target.value);          // URGENT — outside transition
  startTransition(() => {
    setResults(filter(e.target.value)); // NON-URGENT — inside transition
  });
};`,

}

            <h2>useActionState — The Complete Deep Dive</h2>
            <p>useActionState is the central hook of React 19's Actions system. It manages the full lifecycle of an async action: initial state, pending state, result state, and error state — all in one hook.</p>
            <h3>The signature</h3>
            ${code(
              "jsx",
              `const [state, dispatchAction, isPending] = useActionState(
  actionFn,      // async function: (previousState, payload) => newState
  initialState,  // the starting value of state
  permalink?     // optional: URL for progressive enhancement
);`,
            )}
            <p>The return value:</p>
            <ul>
              <li><strong>state</strong> — the current state value, starts as initialState, updates to whatever actionFn returns</li>
              <li><strong>dispatchAction</strong> — a stable function you pass to <code>&lt;form action={...}&gt;</code> or call directly</li>
              <li><strong>isPending</strong> — true while the action is in flight</li>
            </ul>
            <h3>How the action function works</h3>
            <p>The action function receives two arguments: the previous state and the payload (either FormData for form actions, or whatever you pass when calling dispatchAction directly).</p>
            ${code(
              "jsx",
              `const [state, submitAction, isPending] = useActionState(
  async (previousState, formData) => {
    // previousState: current value of \`state\` before this action
    // formData: FormData if connected to a form, or direct argument

    const name = formData.get('name');

    // Validate
    if (!name || name.trim().length < 2) {
      // Return the new state — becomes the new \`state\` value
      return { error: 'Name must be at least 2 characters', name };
    }

    // Call API
    const result = await updateUserName(name);

    if (result.error) {
      return { error: result.error, name };
    }

    // Success — return null to clear error state
    return { error: null, name: result.updatedName };
  },
  { error: null, name: '' } // initial state
);`,
            )}
            <h3>The state machine model</h3>
            <p>useActionState is a state machine with three states. Understanding this precisely prevents bugs:</p>
            ${code(
              "txt",
              `IDLE    -> PENDING    -> IDLE (with new state)
         | action starts
         isPending = true
         state = previous state (no flash of empty)
         | action resolves/rejects
         isPending = false
         state = return value of actionFn (or previous state on throw)`,
            )}
            <p>When the action throws (uncaught error), React propagates it to the nearest Error Boundary — it does not update state. If you want to show an error in the UI rather than an error boundary, return the error from the action function instead of throwing.</p>
            ${code(
              "jsx",
              `// ❌ Throwing — sends error to Error Boundary
async (prev, formData) => {
  const result = await api(formData);
  if (!result.ok) throw new Error(result.message); // goes to Error Boundary
  return result.data;
}

// ✅ Returning error — stays in component as state
async (prev, formData) => {
  const result = await api(formData);
  if (!result.ok) return { error: result.message }; // handled in component
  return { error: null, data: result.data };
}`,
            )}
            <h3>previousState — the composable power</h3>
            <p>The previousState parameter enables composable, accumulating patterns that are impossible to express cleanly with useState:</p>
            ${code(
              "jsx",
              `// Todo list — each action receives the current list as previous state
const [todos, addTodo, isPending] = useActionState(
  async (previousTodos, formData) => {
    const text = formData.get('text');
    const newTodo = await createTodo(text); // server round-trip
    return [...previousTodos, newTodo]; // append to list
  },
  [] // start with empty list
);

// Delete also uses previousState to filter
const deleteTodo = async (id) => {
  await dispatchAction({ type: 'delete', id });
};

// This patterns replaces an entire useReducer in many cases`,
            )}

            <h2>Form Actions — The New Native Integration</h2>
            <p>React 19 adds native support for passing functions to the action prop of <code>&lt;form&gt;</code>, <code>&lt;input&gt;</code>, and <code>&lt;button&gt;</code>. This connects the Actions system directly to the HTML form model.</p>
            ${code(
              "jsx",

<form action={submitAction}>
  <input name="username" type="text" />
  <button type="submit">Save</button>
  {/* On submit: React calls submitAction(formData) */}
  {/* On success: React auto-resets the form */}
  {/* No onSubmit handler, no e.preventDefault() needed */}

            <p>This is important for several reasons:</p>
            <p><strong>Auto-reset on success:</strong> When an action function returns (without throwing), React automatically resets all uncontrolled form inputs. You don't call form.reset() or manage controlled input state for the form fields.</p>
            <p><strong>Progressive enhancement:</strong> Form actions work even before JavaScript loads (with Server Actions + React DOM streaming). The permalink parameter to useActionState enables the URL to be bookmarkable in that scenario.</p>

  </button>

            <h2>useFormStatus — Reading Form State from Deep Inside</h2>
            <p>useFormStatus is a hook from react-dom (not react) that lets a component read the pending state of the nearest ancestor <code>&lt;form&gt;</code> that uses an action function. It solves a real composability problem.</p>
            ${code(
              "jsx",
              `import { useFormStatus } from 'react-dom';

// SubmitButton lives deep in a design system
// It doesn't know which form it's in, or what that form does
// useFormStatus connects it to the ancestor form's action state
function SubmitButton({ children }) {
  const { pending, data, method, action } = useFormStatus();

  return (
    <button type="submit" disabled={pending}>
      {pending ? 'Saving...' : children}
    </button>
  );
}

// Used anywhere inside a form with an action
function ProfileForm() {
  const [state, formAction] = useActionState(updateProfile, null);

  return (
    <form action={formAction}>
      <input name="bio" />
      {/* SubmitButton automatically knows this form is pending */}
      <SubmitButton>Update profile</SubmitButton>
      {state?.error && <p>{state.error}</p>}
    </form>
  );
}`,
            )}
            <p>The useFormStatus object contains:</p>
            <ul>
              <li><strong>pending</strong> — true while the form's action is running</li>
              <li><strong>data</strong> — the FormData that was submitted (the current submission)</li>
              <li><strong>method</strong> — "get" or "post"</li>
              <li><strong>action</strong> — the action function or URL</li>
            </ul>
            <h3>The critical constraint</h3>
            <p>useFormStatus must be called from a component that is a child of the <code>&lt;form&gt;</code> element — not from the same component that renders the form. This is the component composition boundary:</p>
            ${code(
              "jsx",
              `// ❌ WRONG — useFormStatus in the same component as the form
function Form() {
  const { pending } = useFormStatus(); // reads its OWN form, which doesn't exist yet
  return (
    <form action={action}>
      <button disabled={pending}>Submit</button>
    </form>
  );
}

// ✅ CORRECT — useFormStatus in a CHILD of the form
function Form() {
  return (
    <form action={action}>
      <SubmitButton /> {/* reads the parent form's status */}
    </form>
  );
}

function SubmitButton() {
  const { pending } = useFormStatus(); // reads the ancestor form
  return <button disabled={pending}>Submit</button>;
}`,
            )}
            <p>This mirrors the Context lookup model from Chapter 6 — it walks up the tree to find the nearest form provider.</p>

            <h2>useOptimistic — Instant UI with Safe Rollback</h2>
            <p>useOptimistic enables optimistic updates — immediately showing the user the result they expect, before the server confirms. If the operation fails, the optimistic state automatically reverts.</p>
            ${code(
              "jsx",
              `const [optimisticState, addOptimistic] = useOptimistic(
  realState,          // the source of truth state
  updateFn            // (currentState, optimisticValue) => newOptimisticState
);`,
            )}
            <p>The mental model: optimisticState is a derived view of realState with pending optimistic updates layered on top. When the async operation completes (success or failure), optimisticState snaps back to realState.</p>
            <h3>The canonical example — optimistic todo list</h3>
            ${code(
              "jsx",
              `function TodoList({ todos, onAddTodo }) {
  // optimisticTodos = todos + any pending items
  const [optimisticTodos, addOptimisticTodo] = useOptimistic(
    todos,
    (currentTodos, newTodo) => [...currentTodos, newTodo]
    //               the optimistic value passed to addOptimisticTodo
  );

  const [, submitAction] = useActionState(
    async (_, formData) => {
      const text = formData.get('text');

      // Show it immediately — before the server responds
      addOptimisticTodo({
        id: 'temp-' + Date.now(), // temporary ID
        text,
        sending: true,            // flag for UI styling
      });

      // Actually persist it
      const savedTodo = await createTodoOnServer(text);
      onAddTodo(savedTodo); // update the real state
    },
    null
  );

  return (
    <div>
      <ul>
        {optimisticTodos.map(todo => (
          <li
            key={todo.id}
            style={{ opacity: todo.sending ? 0.6 : 1 }}
          >
            {todo.text}
            {todo.sending && ' (saving...)'}
          </li>
        ))}
      </ul>

      <form action={submitAction}>
        <input name="text" placeholder="New todo" />
        <button type="submit">Add</button>
      </form>
    </div>
  );

            )}
            <h3>How the rollback works</h3>
            <p>useOptimistic doesn't roll back manually. The rollback is automatic and structural:</p>
            ${code(
              "txt",
              `realState = ['Buy milk', 'Walk dog']
User submits 'Call Alice'

optimisticState = ['Buy milk', 'Walk dog', 'Call Alice (sending...)']
                 immediately — before server responds

Server responds:
  SUCCESS: onAddTodo updates realState -> ['Buy milk', 'Walk dog', 'Call Alice']
           optimisticState snaps to match realState (the temp item disappears)
           The persisted item takes its place

  FAILURE: realState unchanged -> ['Buy milk', 'Walk dog']
           optimisticState snaps back -> ['Buy milk', 'Walk dog']
           'Call Alice' disappears — visual rollback
           Error shown to user`,
            )}
            <p>The rollback happens because optimisticState is derived from realState. When the operation fails and realState doesn't update, optimisticState reverts to exactly realState.</p>
            <h3>useOptimistic with multiple concurrent actions</h3>
            <p>A subtlety that matters in production: multiple pending optimistic updates stack correctly. If the user submits two items in quick succession before either resolves:</p>
            ${code(
              "txt",
              `realState = ['A']
Submit 'B' -> optimisticState = ['A', 'B (sending)']
Submit 'C' -> optimisticState = ['A', 'B (sending)', 'C (sending)']

B resolves -> realState = ['A', 'B']
           -> optimisticState = ['A', 'B', 'C (sending)']  <- C still pending

C resolves -> realState = ['A', 'B', 'C']
           -> optimisticState = ['A', 'B', 'C']  <- clean`,
            )}

            <h2>The use() API — Reading Resources in Render</h2>
            <p>use() is fundamentally different from every other hook. It's not just a hook — it's a new React primitive that can read any resource during render.</p>
            <h3>Reading context conditionally</h3>
            <p>As covered in Chapter 6, use(Context) can be called after early returns — impossible with useContext:</p>
            ${code(
              "jsx",
              `import { use } from 'react';

function Greeting({ isLoggedIn }) {
  if (!isLoggedIn) return <p>Please log in</p>; // early return

  // ✅ use() after early return — works
  const user = use(UserContext);
  return <p>Hello {user.name}</p>;
}`,
            )}
            <h3>Reading promises — the suspension model</h3>
            <p>use() can read a Promise. If the Promise is pending, the component suspends. If the Promise resolves, the component re-renders with the value. If it rejects, the error propagates to the nearest error boundary.</p>
            ${code(
              "jsx",
              `import { use, Suspense } from 'react';

function UserProfile({ userPromise }) {
  // If userPromise is pending: component suspends, Suspense shows fallback
  // If userPromise resolves: component renders with user data
  // If userPromise rejects: error propagates to Error Boundary
  const user = use(userPromise);

  return (
    <div>
      <h1>{user.name}</h1>
      <p>{user.bio}</p>
    </div>
  );
}

// Parent passes a promise — doesn't await it
function Page({ userId }) {
  const userPromise = fetchUser(userId); // promise, not the value

  return (
    <Suspense fallback={<Skeleton />}>
      <UserProfile userPromise={userPromise} />
    </Suspense>
  );
}`,
            )}
            <h3>The critical constraint: promises must be stable</h3>
            <p>use() has one requirement that trips developers up: the promise must be created outside the component (or memoized) — not created inline in render:</p>
            ${code(
              "jsx",
              `// ❌ BROKEN — new Promise created on every render
function Component({ id }) {
  const data = use(fetchUser(id)); // fetchUser() called on every render
  // React warns: "A component was suspended by an uncached promise"
  // Each render creates a new Promise -> infinite suspension loop
}

// ✅ CORRECT — promise created in parent, stable reference
function Page({ id }) {
  const userPromise = useMemo(() => fetchUser(id), [id]);
  return (
    <Suspense fallback={<Skeleton />}>
      <Component promise={userPromise} />
    </Suspense>
  );
}

function Component({ promise }) {
  const data = use(promise); // stable reference — works correctly
  return <div>{data.name}</div>;
}

// ✅ ALSO CORRECT — with a caching layer (React Query, SWR, or custom cache)
// These libraries ensure the same promise is returned for the same key`,
            )}
            <h3>use() vs useEffect for data fetching</h3>
            <p>A common question: should you use use(promise) or useEffect + useState for data fetching?</p>
            ${code(
              "jsx",
              `// useEffect pattern — runs after render, shows loading state manually
function WithEffect({ id }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const controller = new AbortController();
    fetchUser(id, { signal: controller.signal })
      .then(setData)
      .finally(() => setLoading(false));
    return () => controller.abort();
  }, [id]);

  if (loading) return <Spinner />;
  return <div>{data?.name}</div>;
}

// use() pattern — suspends, Suspense handles loading state
function WithUse({ promise }) {
  const data = use(promise); // suspends until resolved
  return <div>{data.name}</div>;
}
// Parent wraps in <Suspense fallback={<Spinner />}>`,

  return <input ref={ref} {...props} />;

<FancyInput ref={inputRef} placeholder="Type here" />`,

import { useFormStatus } from 'react-dom';

// Design system button — reads form status automatically
function SubmitButton({ label, pendingLabel }) {
  const { pending } = useFormStatus();
  return (
    <button type="submit" disabled={pending}>
      {pending ? pendingLabel : label}
    </button>
  );
}

// Comment form with optimistic updates
function CommentSection({ postId, commentsPromise }) {
  // use() reads the promise — Suspense handles loading state
  const initialComments = use(commentsPromise);

  // Optimistic layer — shows comments before server confirms
  const [optimisticComments, addOptimistic] = useOptimistic(
    initialComments,
    (current, newComment) => [...current, { ...newComment, sending: true }]
  );

  // useActionState manages the full async lifecycle
  const [error, submitAction, isPending] = useActionState(
    async (prevState, formData) => {
      const text = formData.get('text');

      if (!text?.trim()) return { error: 'Comment cannot be empty' };

      // Immediately show optimistic comment
      addOptimistic({ id: crypto.randomUUID(), text, author: 'You' });

      const result = await submitComment(postId, text);
      if (result.error) return { error: result.error };

      return { error: null };
    },
    { error: null }
  );

  return (
    <>
      {/* Document metadata — hoisted to <head> automatically */}
      <title>Comments — {postId}</title>

      {/* Comment list */}
      <ul>
        {optimisticComments.map(comment => (
          <li
            key={comment.id}
            style={{ opacity: comment.sending ? 0.5 : 1 }}
          >
            <strong>{comment.author}:</strong> {comment.text}
            {comment.sending && <span> (sending...)</span>}
          </li>
        ))}
      </ul>

      {/* Form — auto-resets on success, no e.preventDefault needed */}
      <form action={submitAction}>
        <textarea name="text" placeholder="Write a comment..." />
        {error?.error && <p role="alert">{error.error}</p>}
        <SubmitButton label="Post comment" pendingLabel="Posting..." />
      </form>
    </>
  );
}

// Page — passes promise, wraps in Suspense
function PostPage({ postId }) {
  const commentsPromise = useMemo(
    () => fetchComments(postId),
    [postId]
  );

  return (
    <Suspense fallback={<CommentsSkeleton />}>
      <CommentSection
        postId={postId}
        commentsPromise={commentsPromise}
      />
    </Suspense>
  );
}`,

            <h2>Why These Hooks Exist</h2>
            <p>Every hook in this chapter solves a problem that the more common hooks cannot. They are not alternatives to useState or useEffect — they fill gaps in specific, well-defined scenarios. Senior developers know exactly what those scenarios are, because using the wrong hook in these situations produces bugs that are nearly impossible to diagnose without understanding what's happening under the hood.</p>

            <h2>useLayoutEffect — Synchronous After DOM, Before Paint</h2>
            <h3>The one-sentence definition</h3>
            ${callout(
              "key",
              "useLayoutEffect runs synchronously after React has updated the DOM but before the browser has painted those changes to the screen.",
            )}
            <p>This is the critical difference from useEffect, which runs after paint. The gap between those two moments — post-DOM-update, pre-paint — is small but it's the only window where you can make DOM changes that the user will never see as a flash. Let's start with the precise execution timeline showing where each effect type fits in the pipeline.</p>
            <div class="setstate-flow">
              <div class="ss-step start">Render phase<small>Component fn called, virtual DOM built</small></div>
              <div class="ss-arrow">↓</div>
              <div class="ss-step">Commit — mutation phase<small>Real DOM updated — refs attached</small></div>
              <div class="ss-arrow">↓</div>
              <div class="ss-step boundary">useLayoutEffect runs here<small>Synchronous — blocks paint. Safe to read/write DOM. (BEFORE PAINT)</small></div>
              <div class="ss-arrow">↓</div>
              <div class="ss-step">Browser paints screen<small>User sees the updated UI</small></div>
              <div class="ss-arrow">↓</div>
              <div class="ss-step">useEffect runs here<small>Asynchronous — does not block paint. For subscriptions, fetches. (AFTER PAINT)</small></div>
              <div class="ss-key">useLayoutEffect blocks paint — use only when that synchronous timing is required.</div>
            </div>
            <h3>The exact use cases for useLayoutEffect</h3>
            <p>The rule is precise: use useLayoutEffect only when you need to read or write the DOM before the user can see it. There are three canonical scenarios:</p>
            <h4>Scenario 1 — Measuring DOM geometry before paint</h4>
            ${code(
              "jsx",
              `function Tooltip({ children, content }) {
  const tooltipRef = useRef(null);
  const [position, setPosition] = useState({ top: 0, left: 0 });

  useLayoutEffect(() => {
    // DOM is updated — tooltip element exists
    // But browser hasn't painted yet
    // We can measure its size and adjust position BEFORE the user sees it
    const rect = tooltipRef.current.getBoundingClientRect();
    const viewportWidth = window.innerWidth;

    // If tooltip would overflow right edge, flip it left
    if (rect.right > viewportWidth) {
      setPosition(pos => ({ ...pos, left: pos.left - rect.width }));
    }
    // This correction happens before paint — user never sees the wrong position
  });

  // ❌ With useEffect — user WOULD see:
  //   1. Tooltip renders at wrong position (paint 1)
  //   2. Position correction runs (paint 2 = flash of wrong position)
  //   useLayoutEffect collapses this into one paint

  return (
    <div ref={tooltipRef} style={position}>
      {content}
    </div>
  );
}`,
            )}
            <h4>Scenario 2 — Synchronizing scroll position</h4>
            ${code(
              "jsx",
              `function ChatWindow({ messages }) {
  const bottomRef = useRef(null);

  // ❌ useEffect — user briefly sees the old scroll position
  //    before it snaps to bottom (jarring flash)

  // ✅ useLayoutEffect — scroll happens before paint
  //    user sees the list already at the bottom
  useLayoutEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'instant' });
  }, [messages]);

  return (
    <div className="chat">
      {messages.map(m => <Message key={m.id} data={m} />)}
      <div ref={bottomRef} />
    </div>
  );
}`,
            )}
            <h4>Scenario 3 — Third-party library initialization that reads DOM</h4>
            ${code(
              "jsx",
              `function Chart({ data }) {
  const canvasRef = useRef(null);

  useLayoutEffect(() => {
    // D3, Canvas-based charting libraries, or WebGL contexts
    // need accurate DOM dimensions to initialize
    // These dimensions are only available after DOM commit
    const { width, height } = canvasRef.current.getBoundingClientRect();
    const chart = initializeChart(canvasRef.current, { width, height, data });

    return () => chart.destroy();
  }, [data]);

  return <canvas ref={canvasRef} />;
}`,
            )}
            <h3>useLayoutEffect and SSR — The Hydration Warning</h3>
            <p>useLayoutEffect does not run on the server — there is no DOM to read. This produces a React warning when using SSR (Next.js, Remix) because the server renders without the effect but the client hydrates expecting it to have run.</p>
            ${code(
              "jsx",
              `// ❌ SSR warning: "useLayoutEffect does nothing on the server"
function Component() {
  useLayoutEffect(() => {
    // This warning fires even if the effect body is empty
    // because React detects useLayoutEffect in a server context
  }, []);
}

// ✅ Solution 1: useIsomorphicLayoutEffect custom hook
const useIsomorphicLayoutEffect =
  typeof window !== 'undefined' ? useLayoutEffect : useEffect;

function Component() {
  useIsomorphicLayoutEffect(() => {
    // Server: runs as useEffect (no warning, no DOM access)
    // Client: runs as useLayoutEffect (correct timing)
  }, []);
}

// ✅ Solution 2: suppress only when genuinely safe to do so
useLayoutEffect(() => { /* ... */ }, []); // eslint-disable-line
// Use only when you're certain the component never SSR-renders`,
            )}
            <p>useIsomorphicLayoutEffect is a standard pattern in virtually every component library codebase. It's so common it's worth memorizing and extracting into a shared utility.</p>

            <h2>useId — Stable, SSR-Safe Unique IDs</h2>
            <p>useId generates a unique ID that is stable across server and client renders. It solves a specific and previously painful problem: accessible <code>&lt;label&gt;</code> and <code>&lt;input&gt;</code> associations in SSR applications.</p>
            <h3>The problem it solves</h3>
            <p>HTML accessibility requires <code>&lt;label htmlFor&gt;</code> to match the id of the associated input. If you generate IDs with Math.random() or counter++, you get a mismatch between server-rendered HTML (with one ID) and the client hydration (which generates a different ID). React complains about the mismatch and accessibility tools see broken associations.</p>
            ${code(
              "jsx",
              `// ❌ WRONG — different ID on server vs client
let counter = 0;
function FormField({ label }) {
  const id = \`field-\${++counter}\`; // increments differently on server vs client
  // Server renders: id="field-1"
  // Client hydrates: id="field-1" (if first render) or "field-2" (if second)
  // Hydration mismatch — React warning, broken accessibility
}

// ❌ WRONG — Math.random()
function FormField({ label }) {
  const [id] = useState(() => \`field-\${Math.random()}\`);
  // Different on server vs client — hydration mismatch
}

// ✅ CORRECT — useId
function FormField({ label }) {
  const id = useId();
  // React generates the SAME ID on server and client
  // Because it's derived from the component's position in the tree
  // which is deterministic across both environments

  return (
    <div>
      <label htmlFor={id}>{label}</label>
      <input id={id} type="text" />
    </div>
  );
}`,
            )}
            <h3>How useId generates its value</h3>
            <p>useId generates IDs by traversing the component's position in the fiber tree and encoding it as a string — something like :r0:, :r1:, :r0h:. Because the component tree structure is deterministic (same components in same positions), the generated ID is the same on the server and the client.</p>
            ${code(
              "jsx",
              `function Component() {
  const id = useId();
  console.log(id); // ":r0:" or similar

  // The ID encodes the component's tree position
  // Children get IDs derived from their parent:
  // Parent: ":r0:"
  // First child: ":r0h:"
  // Second child: ":r0i:"
}`,
            )}
            <h3>Multiple IDs from one useId call</h3>
            <p>For components that need multiple related IDs (a field with a label, an error message, and a description — all needing their own IDs for aria-labelledby and aria-describedby), you append suffixes to a single useId result:</p>
            ${code(
              "jsx",
              `function AccessibleInput({ label, description, error }) {
  const baseId = useId();
  // Derive multiple stable IDs from one useId call
  const inputId     = \`\${baseId}-input\`;
  const descId      = \`\${baseId}-desc\`;
  const errorId     = \`\${baseId}-error\`;

  return (
    <div>
      <label htmlFor={inputId}>{label}</label>
      <input
        id={inputId}
        aria-describedby={\`\${descId} \${error ? errorId : ''}\`}
        aria-invalid={!!error}
      />
      <p id={descId}>{description}</p>
      {error && <p id={errorId} role="alert">{error}</p>}
    </div>
  );
}`,
            )}
            <h3>What useId is NOT for</h3>
            <p>A critical misuse to catch in code reviews:</p>
            ${code(
              "jsx",
              `// ❌ WRONG — useId for list keys
function List({ items }) {
  return items.map(item => (
    // useId generates ONE id per component instance
    // Calling it inside a .map() is a violation of rules of hooks
    // (conditional/dynamic hook calls)
    <li key={useId()}>{item.name}</li> // runtime error
  ));
}

// ✅ CORRECT for list keys — use data IDs
{items.map(item => <li key={item.id}>{item.name}</li>)}`,
            )}
            <p>useId generates one stable ID per hook call per component instance. It is not a general-purpose ID factory for runtime-created elements.</p>

            <h2>useSyncExternalStore — The Right Way to Subscribe to External State</h2>
            <p>useSyncExternalStore is the hook React provides for subscribing to external data sources — anything outside React's state system. Browser APIs, third-party stores, WebSocket state, localStorage, Redux (internally) all use this pattern.</p>
            <h3>Why it exists</h3>
            <p>Before useSyncExternalStore, developers subscribed to external stores using useEffect + useState. This approach had a subtle concurrency bug: in Concurrent Mode, React can render a component multiple times before committing. If the external store changes between two renders of the same component, different renders could see different values — producing a "tearing" bug where parts of the UI show inconsistent state from the same data source.</p>
            ${code(
              "jsx",
              `// ❌ The broken approach — tears in Concurrent Mode
function useWindowWidth() {
  const [width, setWidth] = useState(window.innerWidth);

  useEffect(() => {
    const handler = () => setWidth(window.innerWidth);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

  return width;
  // Problem: in Concurrent Mode, React may render this component
  // at different times. If a resize happens mid-render cycle,
  // two renders of this component see different widths.
  // The final committed UI could have mismatched values.
}

// ✅ The correct approach — useSyncExternalStore prevents tearing
function useWindowWidth() {
  return useSyncExternalStore(
    (callback) => {
      // Subscribe — called when store changes
      window.addEventListener('resize', callback);
      return () => window.removeEventListener('resize', callback);
    },
    () => window.innerWidth,    // getSnapshot — client value
    () => 1024,                 // getServerSnapshot — SSR value (optional)
  );
}`,
            )}
            <h3>The three arguments</h3>
            ${code(
              "txt",
              `useSyncExternalStore(subscribe, getSnapshot, getServerSnapshot?)
                        |            |                |
                        |            |                +-- SSR: what value to use
                        |            |                    on the server (optional)
                        |            +------------------- Returns current value
                        |                                 Must be pure, idempotent
                        +-------------------------------- Called with a callback
                                                          Returns unsubscribe fn`,
            )}
            <p>The getSnapshot function has one strict requirement: it must return the same reference if the data hasn't changed. React calls it after every render to check if the store changed. If it returns a new object reference even when the data is identical, React will infinitely re-render.</p>
            ${code(
              "jsx",
              `// ❌ BROKEN — new object every call
useSyncExternalStore(subscribe, () => ({
  user: store.getUser(), // new object every call -> infinite re-render
}));

// ✅ CORRECT — return primitive or same reference
useSyncExternalStore(subscribe, () => store.getUser()); // reference stable
useSyncExternalStore(subscribe, () => store.count);     // primitive`,
            )}
            <h3>Building a complete external store</h3>
            ${code(
              "jsx",
              `// A mini observable store — works correctly with useSyncExternalStore
function createStore(initialState) {
  let state = initialState;
  const listeners = new Set();

  return {
    getState: () => state,

    setState: (updater) => {
      state = typeof updater === 'function' ? updater(state) : updater;
      // Notify all subscribers — React will call getSnapshot
      // and re-render any component whose snapshot changed
      listeners.forEach(l => l());
    },

    subscribe: (listener) => {
      listeners.add(listener);
      return () => listeners.delete(listener); // return unsubscribe
    },
  };
}

const counterStore = createStore({ count: 0 });

// Hook — connects React component to the store
function useCounter() {
  return useSyncExternalStore(
    counterStore.subscribe,
    counterStore.getState,
    () => ({ count: 0 }) // server snapshot
  );
}

// Any component using this gets tearing-safe reactive updates
function CounterDisplay() {
  const { count } = useCounter();
  return <p>Count: {count}</p>;
}

// Update from anywhere — even outside React
document.getElementById('external-btn').addEventListener('click', () => {
  counterStore.setState(s => ({ count: s.count + 1 }));
});`,
            )}
            <h3>Selector support — reading a slice</h3>
            <p>For large stores, subscribing to the entire store causes every component to re-render on any change. You can add selector support using the same pattern libraries like Zustand use internally:</p>
            ${code(
              "jsx",
              `function useStoreSelector(store, selector) {
  // Only re-render when the selected slice changes
  return useSyncExternalStore(
    store.subscribe,
    () => selector(store.getState()),
    () => selector(store.getInitialState()),
  );
}

// Usage
function UserName() {
  // Only re-renders when user.name changes
  // NOT when user.avatar or user.email changes
  const name = useStoreSelector(appStore, state => state.user.name);
  return <p>{name}</p>;
}`,

            <p>The getSnapshot function here returns selector(store.getState()). React compares this with Object.is — if the selected slice returns the same primitive or reference, the component doesn't re-render.</p>

            <h2>useInsertionEffect — For CSS-in-JS Libraries Only</h2>
            <p>useInsertionEffect runs before useLayoutEffect and before any DOM mutations. It exists for one very specific purpose: allowing CSS-in-JS libraries to inject styles before any layout reads happen.</p>
            <h3>The timing problem it solves</h3>
            ${code(
              "txt",
              `Without useInsertionEffect:
  DOM mutation committed
  useLayoutEffect runs (reads DOM -> WRONG — styles not injected yet -> stale layout values)
  CSS-in-JS injects styles
  Browser recalculates layout
  Repaints

With useInsertionEffect:
  CSS-in-JS injects styles (useInsertionEffect)
  DOM mutation committed
  useLayoutEffect runs (reads DOM -> CORRECT — styles already exist)
  Browser paints once`,
            )}
            <h3>The rule</h3>
            <p>Do not use useInsertionEffect in application code. This hook is specifically designed for CSS-in-JS library authors (styled-components, Emotion, vanilla-extract). Using it in application components is the wrong tool and signals a misunderstanding of its purpose.</p>
            ${code(
              "jsx",
              `// What styled-components and Emotion do internally:
function useInsertStyles(id, css) {
  useInsertionEffect(() => {
    if (!document.getElementById(id)) {
      const style = document.createElement('style');
      style.id = id;
      style.textContent = css;
      document.head.appendChild(style);
    }
    // Note: cannot access refs here — DOM mutations are not yet committed
    // Can only insert into document.head
  });
}

// Application code should NEVER use this
// If you find yourself reaching for useInsertionEffect,
// you're either building a CSS library or solving the wrong problem`,
            )}

            <h2>useDebugValue — DevTools Labels for Custom Hooks</h2>
            <p>useDebugValue adds a label to custom hooks in React DevTools. It has no effect on runtime behavior — it exists purely to make debugging easier.</p>
            ${code(
              "jsx",
              `function useOnlineStatus() {
  const [isOnline, setIsOnline] = useState(navigator.onLine);

  useEffect(() => {
    const handleOnline = () => setIsOnline(true);
    const handleOffline = () => setIsOnline(false);
    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);
    return () => {
      window.removeEventListener('online', handleOnline);
      window.removeEventListener('offline', handleOffline);
    };
  }, []);

  // Without this: DevTools shows "OnlineStatus" with no value

            <h2>What Custom Hooks Actually Are</h2>
            <p>A custom hook is a JavaScript function whose name starts with use and which may call other hooks. That's the complete technical definition. But the conceptual definition is more important:</p>
            ${callout(
              "key",
              "A custom hook extracts stateful logic from a component so that logic can be reused, tested, and reasoned about in isolation — without extracting the component itself.",
            )}
            <p>Before hooks, sharing stateful logic between components required either Higher-Order Components (HOCs) or render props — both of which added wrapper components to the tree, making component hierarchies harder to read, debug, and compose. Custom hooks solve the same problem with zero added components, zero wrapper nesting, and full TypeScript inference.</p>
            <p>The mental model: a custom hook is a piece of behaviour, not a piece of UI. When you find yourself copying stateful logic between components, that's the signal to extract it into a hook.</p>

            <h2>The Rules of Hooks — Why They Exist</h2>
            <p>Custom hooks must follow the same rules as built-in hooks. Understanding why these rules exist (from Chapter 3 and Chapter 9) makes them obvious rather than arbitrary.</p>
            <p>React identifies hooks by their call order — position in the fiber's linked list of hook states. This means:</p>
            ${code(
              "jsx",
              `// ❌ Rule 1 violated — hook called conditionally
function useConditionalData(shouldFetch) {
  if (shouldFetch) {
    const [data, setData] = useState(null); // hook 0 on some renders, absent on others
  }
  const [error, setError] = useState(null); // hook 0 or hook 1 depending on branch
  // React reads wrong slot -> wrong state values
}

// ❌ Rule 2 violated — hook called outside a component or hook
function fetchData(url) {
  const [data, setData] = useState(null); // not inside a component or hook
  // No fiber context exists here -> runtime error
}

// ✅ Both rules satisfied
function useData(url, shouldFetch) {
  const [data, setData] = useState(null);   // always hook 0
  const [error, setError] = useState(null); // always hook 1

  useEffect(() => {
    if (!shouldFetch) return; // condition INSIDE effect, not around hook
    fetchData(url).then(setData).catch(setError);
  }, [url, shouldFetch]);

  return { data, error };
}`,
            )}
            <p>The use prefix is not just convention — it tells the ESLint plugin and React DevTools to treat the function as a hook and apply the rules accordingly. A function without use that calls hooks will bypass lint checks and produce confusing DevTools output.</p>

            <h2>The Extraction Pattern — When and How</h2>
            <p>The clearest signal that logic belongs in a custom hook: you've written the same useState + useEffect combination in more than one component, or a single component is so full of state management that its render return is buried under 80 lines of setup.</p>
            ${code(
              "jsx",
              `// Before extraction — logic and UI tangled together
function UserProfile({ userId }) {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    const controller = new AbortController();
    setLoading(true);
    setError(null);

    fetch(\`/api/users/\${userId}\`, { signal: controller.signal })
      .then(r => { if (!r.ok) throw new Error(\`HTTP \${r.status}\`); return r.json(); })
      .then(data => { setUser(data); setLoading(false); })
      .catch(err => {
        if (err.name === 'AbortError') return;
        setError(err.message);
        setLoading(false);
      });

    return () => controller.abort();
  }, [userId]);

  // 80 lines of logic above — render is buried here
  if (loading) return <Spinner />;
  if (error) return <ErrorMessage message={error} />;
  return <ProfileView user={user} />;
}

// After extraction — component expresses only what it renders
function UserProfile({ userId }) {
  const { data: user, loading, error } = useFetch(\`/api/users/\${userId}\`);

  if (loading) return <Spinner />;
  if (error) return <ErrorMessage message={error} />;
  return <ProfileView user={user} />;
}`,
            )}
            <p>The component is now a pure description of UI states. The logic lives where it can be tested, reused, and understood in isolation.</p>

            <h2>Building the Core Custom Hooks — One by One</h2>
            <h3>useFetch — Data Fetching with AbortController</h3>
            <p>This is the most commonly needed custom hook. A production-grade version handles loading state, error state, AbortController cleanup, and race conditions.</p>
            ${code(
              "jsx",
              `function useFetch(url) {
  const [state, setState] = useState({
    data: null,
    loading: true,
    error: null,
  });

  useEffect(() => {
    // Reset on every new URL
    setState({ data: null, loading: true, error: null });

    const controller = new AbortController();

    fetch(url, { signal: controller.signal })
      .then(response => {
        if (!response.ok) {
          throw new Error(\`HTTP error: \${response.status}\`);
        }
        return response.json();
      })
      .then(data => {
        setState({ data, loading: false, error: null });
      })
      .catch(err => {
        // AbortError means we intentionally cancelled — not a real error
        if (err.name === 'AbortError') return;
        setState({ data: null, loading: false, error: err.message });
      });

    // Cleanup: cancel in-flight request when url changes or component unmounts
    return () => controller.abort();
  }, [url]);

  return state;
}

// Usage
function PostList() {
  const { data: posts, loading, error } = useFetch('/api/posts');

  if (loading) return <Spinner />;
  if (error) return <p>Error: {error}</p>;
  return <ul>{posts.map(p => <li key={p.id}>{p.title}</li>)}</ul>;
}`,
            )}
            <p>A more flexible version accepts options and handles non-JSON responses:</p>
            ${code(
              "jsx",
              `function useFetch(url, options = {}) {
  const [state, setState] = useState({
    data: null,
    loading: Boolean(url), // don't load if url is null/undefined
    error: null,
  });

  // Stable reference to options — prevents re-fetching on every render
  // if options object is created inline
  const optionsRef = useRef(options);
  useEffect(() => { optionsRef.current = options; });

  useEffect(() => {
    // Skip fetch if no URL provided
    if (!url) {
      setState({ data: null, loading: false, error: null });
      return;
    }

    setState(prev => ({ ...prev, loading: true, error: null }));
    const controller = new AbortController();

    fetch(url, { ...optionsRef.current, signal: controller.signal })
      .then(async response => {
        if (!response.ok) throw new Error(\`HTTP \${response.status}\`);
        const contentType = response.headers.get('content-type');
        // Handle both JSON and text responses
        return contentType?.includes('application/json')
          ? response.json()
          : response.text();
      })
      .then(data => setState({ data, loading: false, error: null }))
      .catch(err => {
        if (err.name === 'AbortError') return;
        setState({ data: null, loading: false, error: err.message });
      });

    return () => controller.abort();
  }, [url]); // options deliberately excluded — managed via ref

  return state;
}`,
            )}
            <h3>useDebounce and useThrottle — Controlling Update Frequency</h3>
            <p>Debouncing delays a value update until a specified time has passed since the last change. Throttling limits how often a value can update regardless of how frequently it changes.</p>
            ${code(
              "jsx",
              `// useDebounce — delays value update
function useDebounce(value, delay = 300) {
  const [debouncedValue, setDebouncedValue] = useState(value);

  useEffect(() => {
    // Set up a timer that updates debouncedValue after \`delay\` ms of silence
    const timer = setTimeout(() => {
      setDebouncedValue(value);
    }, delay);

    // If value changes again before timer fires, clear it and start fresh
    // This is what makes it a "debounce" — only fires after value settles
    return () => clearTimeout(timer);
  }, [value, delay]);

  return debouncedValue;
}

// Usage: search input that only queries after typing stops
function SearchPage() {
  const [query, setQuery] = useState('');
  const debouncedQuery = useDebounce(query, 400);

  // Only fetches when user stops typing for 400ms
  const { data: results } = useFetch(
    debouncedQuery ? \`/api/search?q=\${debouncedQuery}\` : null
  );

  return (
    <>
      <input
        value={query}
        onChange={e => setQuery(e.target.value)}
        placeholder="Search..."
      />
      {results?.map(r => <Result key={r.id} data={r} />)}
    </>
  );
}`,
            )}
            ${code(
              "jsx",
              `// useThrottle — limits update rate
function useThrottle(value, limit = 200) {
  const [throttledValue, setThrottledValue] = useState(value);
  const lastUpdated = useRef(Date.now());

  useEffect(() => {
    const now = Date.now();
    const timeSinceLastUpdate = now - lastUpdated.current;

    if (timeSinceLastUpdate >= limit) {
      // Enough time has passed — update immediately
      lastUpdated.current = now;
      setThrottledValue(value);
    } else {
      // Too soon — schedule update for when the limit expires
      const timer = setTimeout(() => {
        lastUpdated.current = Date.now();
        setThrottledValue(value);
      }, limit - timeSinceLastUpdate);

      return () => clearTimeout(timer);
    }
  }, [value, limit]);

  return throttledValue;
}

// Usage: scroll position tracking (throttled to avoid overwhelming renders)
function ScrollTracker() {
  const [scrollY, setScrollY] = useState(0);
  const throttledScrollY = useThrottle(scrollY, 100); // max 10 updates/second

  useEffect(() => {
    const handler = () => setScrollY(window.scrollY);
    window.addEventListener('scroll', handler);
    return () => window.removeEventListener('scroll', handler);
  }, []);

  return <div>Scroll position: {throttledScrollY}px</div>;
}`,
            )}
            <p>Debounce vs throttle: debounce fires after activity stops; throttle fires during activity at a consistent rate. Use debounce for search inputs (fire when done typing), throttle for scroll/resize handlers (fire as the user scrolls, but not on every pixel).</p>
            <h3>usePrevious — Capturing the Last Value</h3>
            <p>A deceptively simple but frequently needed pattern. usePrevious gives you access to what a value was on the previous render.</p>
            ${code(
              "jsx",
              `function usePrevious(value) {
  const ref = useRef(undefined);

  // useEffect runs after render — so ref.current is the previous render's value
  // during the current render, and only updates to current value after render
  useEffect(() => {
    ref.current = value;
  });

  // Returns value from BEFORE this render
  return ref.current;
}

// Usage: animate when count changes, knowing direction
function AnimatedCounter({ count }) {
  const prevCount = usePrevious(count);
  const direction = count > (prevCount ?? count) ? 'up' : 'down';

  return (
    <div className={\`counter counter--\${direction}\`}>
      {count}
    </div>
  );
}

// Usage: skip initial-render effects
function DataSync({ data }) {
  const prevData = usePrevious(data);
  const isFirstRender = prevData === undefined;

  useEffect(() => {
    if (isFirstRender) return; // don't sync on mount, only on updates
    syncToServer(data);
  }, [data, isFirstRender]);
}`,
            )}
            <p>The mechanism works because useEffect runs after render. During render, ref.current holds the value from the previous render. After render, the effect updates ref.current to the current value, ready for the next render.</p>
            <h3>useLocalStorage — Persistent State</h3>
            <p>Synchronizes a state value with localStorage, with SSR safety and cross-tab synchronization.</p>
            ${code(
              "jsx",
              `function useLocalStorage(key, initialValue) {
  // Lazy initializer — reads localStorage only on first render
  const [storedValue, setStoredValue] = useState(() => {
    // SSR guard — localStorage doesn't exist on server
    if (typeof window === 'undefined') return initialValue;

    try {
      const item = localStorage.getItem(key);
      // Parse stored JSON or return initial value if nothing stored
      return item !== null ? JSON.parse(item) : initialValue;
    } catch (error) {
      // Handle corrupted localStorage data gracefully
      console.warn(\`useLocalStorage: failed to parse key "\${key}"\`, error);
      return initialValue;
    }
  });

  const setValue = useCallback((value) => {
    try {
      // Allow value to be a function (same API as useState)
      const valueToStore = value instanceof Function
        ? value(storedValue)
        : value;

      setStoredValue(valueToStore);

      if (typeof window !== 'undefined') {
        localStorage.setItem(key, JSON.stringify(valueToStore));
      }
    } catch (error) {
      console.warn(\`useLocalStorage: failed to set key "\${key}"\`, error);
    }
  }, [key, storedValue]);

  // Sync across tabs — storage event fires in OTHER tabs when localStorage changes
  useEffect(() => {
    const handleStorageChange = (event) => {
      if (event.key === key && event.storageArea === localStorage) {
        try {
          setStoredValue(
            event.newValue !== null
              ? JSON.parse(event.newValue)
              : initialValue
          );
        } catch {
          // Ignore parse errors from other tabs
        }
      }
    };

    window.addEventListener('storage', handleStorageChange);
    return () => window.removeEventListener('storage', handleStorageChange);
  }, [key, initialValue]);

  return [storedValue, setValue];
}

// Usage — identical API to useState
function ThemeToggle() {
  const [theme, setTheme] = useLocalStorage('theme', 'light');

  return (
    <button onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')}>
      Current theme: {theme}
    </button>
  );
}`,

            <h3>useEventListener — Safe DOM Event Subscriptions</h3>
            <p>Wraps DOM event listener subscriptions with automatic cleanup and correct dependency handling:</p>
            ${code(
              "jsx",
              `function useEventListener(eventName, handler, element = window, options) {
  // Store handler in ref so the effect doesn't re-run when handler changes
  // (handler identity changes every render if defined inline in the component)
  const savedHandler = useRef(handler);

  useEffect(() => {
    savedHandler.current = handler;
  }, [handler]);

  useEffect(() => {
    // Validate element supports addEventListener
    if (!element?.addEventListener) return;

    // Stable wrapper — always calls the latest handler via ref
    const listener = (event) => savedHandler.current(event);

    element.addEventListener(eventName, listener, options);
    return () => element.removeEventListener(eventName, listener, options);
  }, [eventName, element, options]);
}

// Usage
function KeyboardShortcuts() {
  useEventListener('keydown', (event) => {
    if (event.metaKey && event.key === 'k') {
      openCommandPalette();
    }
  });

  // No cleanup code needed in the component — hook handles it
  return null;
}

function DragTarget({ onDrop }) {
  const divRef = useRef(null);

  useEventListener('dragover', (e) => e.preventDefault(), divRef.current);
  useEventListener('drop', onDrop, divRef.current);

  return <div ref={divRef}>Drop here</div>;

            <h3>useMediaQuery — Responsive Logic in Hooks</h3>

            ${code(

    return window.matchMedia(query).matches;
  }, [query]);

  const subscribe = useCallback((callback) => {
    if (typeof window === 'undefined') return () => {};
    const mediaQuery = window.matchMedia(query);
    mediaQuery.addEventListener('change', callback);
    return () => mediaQuery.removeEventListener('change', callback);
  }, [query]);

  return useSyncExternalStore(
    subscribe,
    getSnapshot,
    () => false // server snapshot — assume not matching on server
  );

  const prefersReducedMotion = useMediaQuery('(prefers-reduced-motion: reduce)');
  const isDarkMode = useMediaQuery('(prefers-color-scheme: dark)');

            <h3>useIntersectionObserver — Visibility Detection</h3>
            <p>Tracks whether an element is visible in the viewport — for lazy loading, infinite scroll, and analytics:</p>
            ${code(
              "jsx",
              `function useIntersectionObserver(options = {}) {
  const [entry, setEntry] = useState(null);
  const ref = useRef(null);

  useEffect(() => {
    const element = ref.current;
    if (!element) return;

    // IntersectionObserver is not supported in all environments
    if (!window.IntersectionObserver) return;

    const observer = new IntersectionObserver(
      ([entry]) => setEntry(entry),
      {
        threshold: options.threshold ?? 0,
        rootMargin: options.rootMargin ?? '0px',
        root: options.root ?? null,
      }
    );

    observer.observe(element);
    return () => observer.disconnect();
  }, [options.threshold, options.rootMargin, options.root]);

  return { ref, entry, isIntersecting: entry?.isIntersecting ?? false };
}

// Usage — lazy image loading
function LazyImage({ src, alt }) {
  const { ref, isIntersecting } = useIntersectionObserver({ threshold: 0.1 });
  const [hasLoaded, setHasLoaded] = useState(false);

  // Only load image after it enters the viewport
  const shouldLoad = isIntersecting || hasLoaded;

  useEffect(() => {
    if (isIntersecting) setHasLoaded(true);
  }, [isIntersecting]);

  return (
    <img
      ref={ref}
      src={shouldLoad ? src : undefined}
      alt={alt}
