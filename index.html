    <script>
      /* =========================================================
         Helpers — escaping + lightweight syntax highlighter
         ========================================================= */
      const esc = (s) =>
        s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      const KEYWORDS =
        "const|let|var|function|return|if|else|for|while|switch|case|break|continue|default|new|class|extends|import|from|export|async|await|try|catch|finally|throw|typeof|instanceof|this|super|yield|delete|void|in|of|do|static|get|set";

      function hl(src) {
        let code = esc(src.replace(/^\n/, "").replace(/\s+$/, ""));
        const re = new RegExp(
          "(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)" + // comments
            "|('[^'\\n]*'|\"[^\"\\n]*\"|`[^`]*`)" + // strings
            "|\\b(" +
            KEYWORDS +
            ")\\b" + // keywords
            "|\\b(true|false|null|undefined|NaN)\\b" + // literals
            "|\\b(\\d+\\.?\\d*)\\b", // numbers
          "g",
        );
        return code.replace(re, (m, com, str, kw, lit, num) => {
          if (com) {
            let cls = "tok-com";
            if (m.includes("❌") || /BUG|WRONG|MUTATION|bad/i.test(m))
              cls = "tok-com tok-bad";
            else if (m.includes("✅") || /CORRECT|good/i.test(m))
              cls = "tok-com tok-good";
            return `<span class="${cls}">${com}</span>`;
          }
          if (str) return `<span class="tok-str">${str}</span>`;
          if (kw) return `<span class="tok-key">${kw}</span>`;
          if (lit) return `<span class="tok-bool">${lit}</span>`;
          if (num) return `<span class="tok-num">${num}</span>`;
          return m;
        });
      }

      function code(lang, src) {
        return `<div class="code-block" data-lang="${lang}">
          <div class="code-head">
            <div class="code-dots"><span></span><span></span><span></span></div>
            <span class="code-lang">${lang}</span>
            <button class="copy-btn">Copy</button>
          </div>
          <pre><code>${hl(src)}</code></pre>
        </div>`;
      }

      // Old vs New tabbed "reads"
      function reads(oldTitle, oldHtml, newTitle, newHtml) {
        return `<div class="reads">
          <div class="reads-tabs">
            <button class="read-tab active" data-kind="old">
              <span class="tag">Read 1</span> ${oldTitle}
            </button>
            <button class="read-tab" data-kind="new">
              <span class="tag">Read 2</span> ${newTitle}
            </button>
          </div>
          <div class="read-panel active">${oldHtml}</div>
          <div class="read-panel">${newHtml}</div>
        </div>`;
      }

      const callout = (kind, html) => {
        const icons = {
          tip: "💡",
          warn: "⚠️",
          danger: "🛑",
          ok: "✅",

        };
        return `<div class="callout ${kind}"><div class="callout-icon">${
          icons[kind] || "💡"
        }</div><div class="callout-body">${html}</div></div>`;
      };

      const qa = (q, a) =>

      const flow = (title, nodes) =>

          .map((n, i) =>
            n === ">"

VvisualizeVvisualize show_widget</pre></div>`;

      /* =========================================================

      const PARTS = [
        { id: 1, title: "Foundations" },

        { id: 4, title: "Performance & Testing" },

      ];

      const CHAPTERS = [
        /* ============== CH 1 ============== */
        {
          id: 1,
          part: 1,
          title: "Virtual DOM, Fiber & Reconciliation",
          lede: "How React works under the hood — the evolution from the synchronous Stack reconciler to the interruptible Fiber engine, and why every modern feature depends on it.",
          body: () => `
            ${reads(
              "The Old Way (React 15 and before)",
              `
            <h2>The Problem React Was Built to Solve</h2>
            <p>Before React, UI development meant directly manipulating the DOM. When data changed, you found the right DOM nodes and updated them yourself. At small scale this works. At scale it becomes a nightmare of cascading updates, missed nodes, and inconsistent UI state.</p>
            <p>React's answer was a simple idea: <strong>never touch the DOM directly. Instead, describe what the UI should look like, and let React figure out what DOM changes are needed.</strong></p>
            <p>That "figuring out" is what the Virtual DOM, Diffing, and Reconciliation are all about.</p>

            <h2>The Virtual DOM — Original Concept</h2>
            <p>The Virtual DOM is a <strong>lightweight JavaScript representation of the real DOM tree</strong> — plain objects describing what elements exist, their attributes, and their children.</p>
            <p>Every time your component renders, React builds a new virtual DOM tree. It then compares it against the previous one. Only the differences get applied to the real DOM.</p>
            <div class="dom-compare">
              <div class="dom-panel real">
                <div class="dom-head">Real DOM</div>
                <p class="dom-sub">Actual browser nodes</p>
                <ul class="dom-meta">
                  <li>Triggers reflow + repaint</li>
                  <li>Expensive to touch</li>
                </ul>
                <pre class="dom-tree">&lt;div&gt;
  &lt;h2&gt;  "Alice"
  &lt;p&gt;   "Engineer"</pre>
                <div class="dom-flag warn">⚠ Touching any node = browser work</div>
              </div>
              <div class="dom-mid">
                <div class="dom-mid-label">React applies<br />only changes</div>
                <div class="dom-mid-arrow">⟵</div>
              </div>
              <div class="dom-panel virtual">
                <div class="dom-head">Virtual DOM</div>
                <p class="dom-sub">Plain JS objects</p>
                <ul class="dom-meta">
                  <li>No browser involvement</li>
                  <li>Cheap to create + compare</li>
                </ul>
                <pre class="dom-tree">{ type: 'div',
  props: {
    children: [
      { type: 'h2',
        props: {
          children: 'Alice' }},
      ...
    ] } }</pre>
                <div class="dom-flag ok">✓ Just JavaScript — zero cost to create</div>
              </div>
            </div>
            <p class="dom-caption">React keeps a virtual copy, diffs it, and writes minimal changes to the real DOM</p>

            <h2>Diffing — The Original Algorithm (Stack Reconciler)</h2>
            <p>When state changes, React builds a completely new virtual DOM tree and runs its <strong>diffing</strong> algorithm to compare old vs new. The old algorithm was built on two core heuristics:</p>

            <h3>Heuristic 1 — Different element types = completely different trees</h3>
            <p>If the root element type changes, React tears everything down and rebuilds from scratch. It does not try to figure out if children are reusable.</p>
            ${code(
              "jsx",
              `// Before update
<div>
  <UserProfile name="Alice" />
</div>

// After update — root type changed from div → section
<section>
  <UserProfile name="Alice" />
</section>

// React's decision: destroy the entire old subtree including UserProfile
// and its state, then mount a fresh section with a fresh UserProfile`,
            )}
            <p>This seems wasteful — <code>UserProfile</code> is identical — but React's bet is that different element types almost always mean genuinely different content, and attempting to reuse would be more expensive than it saves.</p>

            <h3>Heuristic 2 — Same type, same position = same element (update it)</h3>
            ${code(
              "jsx",
              `// Before
<button className="primary" onClick={buy}>Buy</button>

// After
<button className="secondary" onClick={sell}>Sell</button>

// React's decision: SAME element (button), just update className and onClick
// The DOM node is reused — no unmount/remount`,
            )}

            <h3>Heuristic 3 — Lists need keys to preserve identity</h3>
            <div class="keys-diagram">
              <div class="keys-colheads">
                <span>Before</span>
                <span>After (Alice removed)</span>
                <span>What React does</span>
              </div>
              <div class="keys-scenario bad">
                <div class="keys-scenario-title">Without keys — React matches by index</div>
                <div class="keys-grid">
                  <div class="keys-col">
                    <div class="keys-item">index 0 → Alice</div>
                    <div class="keys-item">index 1 → Bob</div>
                    <div class="keys-item">index 2 → Carol</div>
                  </div>
                  <div class="keys-col">
                    <div class="keys-item">index 0 → Bob</div>
                    <div class="keys-item">index 1 → Carol</div>
                  </div>
                  <div class="keys-col">
                    <div class="keys-op update">UPDATE: Alice → Bob</div>
                    <div class="keys-op update">UPDATE: Bob → Carol</div>
                    <div class="keys-op delete">DELETE: Carol</div>
                  </div>
                </div>
                <div class="keys-result bad">3 DOM operations — wrong mental model, breaks component state</div>
              </div>
              <div class="keys-scenario good">
                <div class="keys-scenario-title">With stable keys — React matches by identity</div>
                <div class="keys-grid">
                  <div class="keys-col">
                    <div class="keys-item">key=alice → Alice</div>
                    <div class="keys-item">key=bob → Bob</div>
                    <div class="keys-item">key=carol → Carol</div>
                  </div>
                  <div class="keys-col">
                    <div class="keys-item">key=bob → Bob</div>
                    <div class="keys-item">key=carol → Carol</div>
                  </div>
                  <div class="keys-col">
                    <div class="keys-op delete">DELETE: key=alice only</div>
                    <div class="keys-op nochange">Bob: no change</div>
                    <div class="keys-op nochange">Carol: no change</div>
                  </div>
                </div>
                <div class="keys-result good">1 DOM operation — correct, preserves component state</div>
              </div>
              <div class="keys-footer">Index as key = same bug as no key when list is reordered or filtered</div>
            </div>

            <h2>The Stack Reconciler — How Old React Processed Updates</h2>
            <p>The original reconciler was called the <strong>Stack Reconciler</strong> because it worked exactly like JavaScript's native call stack — recursively, in one uninterrupted pass.</p>
            <p>When you called <code>setState()</code>, React would walk the entire component tree synchronously from the top, re-rendering every component that needed updating, building a new virtual DOM, diffing it, and committing changes — all in a single, unbreakable execution.</p>
            <div class="stack-timeline">
              <div class="st-title">Stack reconciler — synchronous and uninterruptible</div>
              <div class="st-axis">
                <span class="st-axis-label">Time →</span>
                <span class="st-marks"><span>16ms</span><span>32ms</span><span>48ms</span><span>64ms</span></span>
              </div>
              <div class="st-row">
                <div class="st-rowlabel">Main thread</div>
                <div class="st-track"><div class="st-bar block">Reconcile entire tree — 65ms — cannot be paused</div></div>
              </div>
              <div class="st-row">
                <div class="st-rowlabel">User types</div>
                <div class="st-track st-spread">
                  <span class="st-chip key">type "A"</span>
                  <span class="st-chip blocked">BLOCKED</span>
                  <span class="st-chip key">type "B"</span>
                  <span class="st-chip blocked">BLOCKED</span>
                  <span class="st-chip key">type "C"</span>
                </div>
              </div>
              <div class="st-row">
                <div class="st-rowlabel">Anim frame</div>
                <div class="st-track st-spread">
                  <span class="st-chip dropped">frame dropped 🔴</span>
                  <span class="st-chip dropped">frame dropped 🔴</span>
                  <span class="st-chip dropped">frame dropped 🔴</span>
                  <span class="st-chip dropped">frame dropped 🔴</span>
                </div>
              </div>
              <div class="st-row">
                <div class="st-rowlabel">Browser paints</div>
                <div class="st-track"><div class="st-bar block">No paint until reconcilation finishes</div></div>
                <div class="st-track end"><span class="st-paint">paint (finally)</span></div>
              </div>
            </div>
            <p>The problem is fundamental to the design. The recursive tree walk owns the call stack the entire time. There is no yield point, no pause mechanism, no way for the browser to handle a click or draw a frame until the entire reconciliation is done. For small apps this never matters. For data tables, dashboards, and complex UIs — users feel it as a frozen, unresponsive UI.</p>

            <h2>How setState Worked in the Old Model</h2>
            <p>In class components, <code>setState</code> was the only way to trigger a re-render. Its behaviour had several important rules:</p>
            ${code(
              "jsx",
              `class Counter extends React.Component {
  state = { count: 0 };

  // ❌ Classic mistake — setState is ASYNCHRONOUS in event handlers
  handleClick = () => {
    this.setState({ count: this.state.count + 1 });
    this.setState({ count: this.state.count + 1 });
    // Both lines read the same this.state.count
    // Result: count goes from 0 to 1, not 0 to 2
    // React batches these and applies ONE update
  };

  // ✅ Use updater function to get the latest queued state
  handleClickCorrect = () => {
    this.setState(prev => ({ count: prev.count + 1 }));
    this.setState(prev => ({ count: prev.count + 1 }));
    // Now React queues both, runs them in order
    // Result: count correctly goes from 0 to 2
  };
}`,
            )}
            <p>Batching in the old model was partial. React batched <code>setState</code> calls inside React event handlers — but if you called <code>setState</code> inside a <code>setTimeout</code>, a Promise <code>.then()</code>, or a native DOM event listener, React did NOT batch them. Each call triggered a separate re-render:</p>
            ${code(
              "jsx",
              `// Old React — setState inside setTimeout was NOT batched
handleClick = () => {
  setTimeout(() => {
    this.setState({ a: 1 }); // triggers re-render 1
    this.setState({ b: 2 }); // triggers re-render 2
    // TWO renders, not one
  }, 0);
};`,
            )}
            <p>This was a genuine performance gotcha that tripped up experienced developers.</p>

            <h2>Class Component Lifecycle — The Old Mental Model</h2>
            <p>The old model for managing side effects was the component lifecycle:</p>
            <div class="lifecycle-diagram">
              <div class="lc-phases">
                <div class="lc-phase">
                  <div class="lc-phase-title mount">Mount</div>
                  <div class="lc-step"><span class="lc-method">constructor()</span><small>init state, bind methods</small></div>
                  <div class="lc-step"><span class="lc-method">render()</span><small>returns JSX — pure</small></div>
                  <div class="lc-step ghost">DOM updated</div>
                  <div class="lc-step"><span class="lc-method">componentDidMount()</span><small>fetch data, subscriptions</small></div>
                </div>
                <div class="lc-phase">
                  <div class="lc-phase-title update">Update</div>
                  <div class="lc-step"><span class="lc-method">shouldComponentUpdate()</span><small>return false to bail out</small></div>
                  <div class="lc-step"><span class="lc-method">render()</span><small>re-renders with new data</small></div>
                  <div class="lc-step"><span class="lc-method">getSnapshotBeforeUpdate()</span><small>capture scroll pos etc.</small></div>
                  <div class="lc-step"><span class="lc-method">componentDidUpdate()</span><small>react to prop/state changes</small></div>
                </div>
                <div class="lc-phase">
                  <div class="lc-phase-title unmount">Unmount</div>
                  <div class="lc-step"><span class="lc-method">componentWillUnmount()</span><small>cancel subscriptions, timers</small></div>
                </div>
              </div>
              <div class="lc-warn">⚠ componentWillMount, componentWillReceiveProps, componentWillUpdate were deprecated in React 16.3 — unsafe for Concurrent Mode, prefixed UNSAFE_</div>
            </div>
            <p>The lifecycle model worked but had a significant practical problem<strong>: related logic was split across multiple methods.</strong> Setting up a subscription in <code>componentDidMount</code> and tearing it down in <code>componentWillUnmount</code> meant logic that belonged together was physically separated. As components grew complex, this led to bugs where cleanups were missed or mismatched.</p>

            <h2>Summary of the Old Model's Limitations</h2>
            ${tableHTML(
              ["Problem", "Root Cause", "Impact"],
              [
                [
                  "UI freezes on large updates",
                  "Stack reconciler blocks the main thread",
                  "Janky input, dropped frames",
                ],
                [
                  "No way to prioritize updates",
                  "All setState calls treated equally",
                  "Typing feels as slow as rendering a chart",
                ],
                [
                  "Partial batching",
                  "Only batched inside React event handlers",
                  "Extra renders in setTimeout/Promises",
                ],
                [
                  "Split logic in lifecycles",
                  "Mount/update/unmount are separate methods",
                  "Missed cleanups, hard to reason about",
                ],
                [
                  "Class complexity",
                  "<code>this</code> binding, HOCs for code reuse",
                  "Verbose, fragile code",
                ],
              ],
            )}
            <p>These limitations weren't bugs — they were the natural consequences of the original architecture. Fixing them required rebuilding React's internals from scratch.</p>

            `,
              "The New Way (React 16.8 → React 19)",
              `
            <h2>Fiber — The New Reconciliation Engine</h2>
            <p>React 16 introduced <strong>Fiber</strong> — a complete rewrite of the reconciler. The goal was one thing: make reconciliation <strong>interruptible.</strong></p>
            <p>Instead of a recursive function that owns the call stack until it finishes, Fiber processes the component tree as a <strong>linked list of small units of work</strong> — called fiber nodes. React processes one unit, then checks: "Does the browser need the thread back?" If yes, it pauses. If no, it processes the next unit.</p>
            <div class="fiber-diagram">
              <div class="fiber-title">Component tree → Fiber linked list</div>
              <div class="fiber-tree">
                <div class="fiber-level">
                  <div class="fiber-node root">App</div>
                </div>
                <div class="fiber-link">child ↓ &nbsp;&nbsp; return ↑</div>
                <div class="fiber-level">
                  <div class="fiber-node">Header</div>
                  <span class="fiber-sib">sibling →</span>
                  <div class="fiber-node">Main</div>
                  <span class="fiber-sib">sibling →</span>
                  <div class="fiber-node">Footer</div>
                </div>
                <div class="fiber-link">child ↓ (from Main)</div>
                <div class="fiber-level">
                  <div class="fiber-node">Feed</div>
                  <span class="fiber-sib">sibling →</span>
                  <div class="fiber-node">Sidebar</div>
                </div>
              </div>
              <div class="fiber-fields">
                <div class="fiber-fields-title">Each fiber node contains</div>
                <ul>
                  <li><span class="ff-key">type</span> — what component (string / function / class)</li>
                  <li><span class="ff-key">stateNode</span> — actual DOM node or class instance</li>
                  <li><span class="ff-key">pendingProps / memoizedProps</span> — incoming vs committed props</li>
                  <li><span class="ff-key">memoizedState</span> — committed state (hooks live here as a linked list)</li>
                  <li><span class="ff-key">effectTag</span> — what DOM operation is needed (INSERT / UPDATE / DELETE)</li>
                  <li><span class="ff-key">alternate</span> — pointer to the mirror node in the other tree</li>
                </ul>
              </div>
            </div>

            <h2>The Two-Tree Architecture — Current and Work-In-Progress</h2>
            <p>Fiber maintains two complete trees simultaneously. This is the architectural backbone of everything that makes modern React powerful.</p>

            <p>This mental model predicts every "why didn't my state update?" bug. The snapshot is immutable for the lifetime of that render. Setting state doesn't change the current snapshot — it schedules a new render with a new snapshot.</p>

            <h2>Closures and Stale State — The Deep Problem</h2>
            <p>The snapshot model leads directly to the most insidious class of React bugs: <strong>stale closures.</strong> This is where senior developers get separated from junior ones in code review.</p>
            <p>A stale closure happens when a function closes over a state value from a past render, but continues to be called in a future render where that value is outdated.</p>
            ${code(
              "jsx",
              `function Timer() {
  const [count, setCount] = useState(0);

  useEffect(() => {
    const interval = setInterval(() => {
      // ❌ STALE CLOSURE BUG
      // This function closes over \`count\` from the render when
      // this effect ran (count = 0). It never sees updated count.
      setCount(count + 1); // always: 0 + 1 = 1
      // The timer increments to 1 and stays there forever
    }, 1000);

    return () => clearInterval(interval);
  }, []); // empty deps — effect runs once, closes over count=0 forever

  return <p>{count}</p>;
}`,
            )}
            <p>The fix is the updater function form — it receives the latest state value from React's queue, bypassing the stale closure entirely:</p>
            ${code(
              "jsx",
              `function Timer() {
  const [count, setCount] = useState(0);

  useEffect(() => {
    const interval = setInterval(() => {
      // ✅ Updater form — doesn't close over count at all
      // React passes the current queued value as \`prev\`
      setCount(prev => prev + 1); // always correct
    }, 1000);

    return () => clearInterval(interval);
  }, []); // empty deps is now safe — we don't depend on count

  return <p>{count}</p>;
}`,
            )}
            <p>The stale closure also appears in async operations — and this variant is especially dangerous because it's harder to spot:</p>
            ${code(
              "jsx",
              `function SearchBox() {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);

  const handleSearch = async () => {
    // ❌ ASYNC STALE CLOSURE
    const data = await fetchResults(query);

    // By the time this line runs, query may have changed
    // (user typed more while the fetch was in flight)
    // But this closure still sees the OLD query
    setResults(data);
    // You've now shown results for the old query — silent data bug
  };

  // ✅ CORRECT: capture query value at the time of the call
  const handleSearch = async () => {
    const currentQuery = query; // capture snapshot
    const data = await fetchResults(currentQuery);

    // Use a functional update with a condition, or use AbortController
    // to cancel stale in-flight requests entirely
    setResults(prev =>
      // Only apply if query hasn't changed by the time this resolves
      query === currentQuery ? data : prev
    );
  };
}`,
            )}

            <h2>useState — Every Behaviour a Senior Must Know</h2>
            <h3>Behaviour 1: State updates are batched in React 18</h3>
            ${code(
              "jsx",
              `function Form() {
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [age, setAge] = useState(0);

  const handleSubmit = () => {
    setName('Alice');    // \\
    setEmail('a@b.com'); //  } React 18: one single re-render
    setAge(30);          // /

    // React 17: three separate re-renders (if inside setTimeout/Promise)
    // React 18: always one re-render, everywhere, automatically
  };
}`,
            )}

            <h3>Behaviour 2: React bails out if new state equals old state</h3>
            <p>React uses <code>Object.is</code> comparison. If new state is identical to old state, React skips the re-render entirely.</p>
            ${code(
              "jsx",
              `const [count, setCount] = useState(0);

setCount(0); // count is already 0 — React bails out, NO re-render
setCount(0); // same — no render

// This is why directly mutating objects doesn't trigger re-renders:
const [user, setUser] = useState({ name: 'Alice' });
user.name = 'Bob'; // mutates existing object
setUser(user); // same reference! Object.is(oldUser, user) = true
               // React bails out — NO re-render
               // UI never updates to show Bob

// ✅ Always create a new reference:
setUser({ ...user, name: 'Bob' }); // new object → different reference → re-render`,
            )}

            <h3>Behaviour 3: State initializer runs only once</h3>
            ${code(
              "jsx",
              `// ❌ Expensive computation runs on EVERY render
const [data, setData] = useState(parseHeavyCSV(rawData));

// ✅ Lazy initializer — function called only on FIRST render
const [data, setData] = useState(() => parseHeavyCSV(rawData));`,
            )}
            <p>Pass a function, not the result of calling a function. The distinction matters enormously when the initializer is expensive.</p>

            <h3>Behaviour 4: State updates schedule a render, they don't run immediately</h3>
            ${code(
              "jsx",
              `function Example() {
  const [count, setCount] = useState(0);

  console.log('rendering, count =', count); // runs during render

  const handleClick = () => {
    setCount(1);
    console.log(count); // still 0 — snapshot hasn't changed
    setCount(2);
    console.log(count); // still 0 — same snapshot
    // React schedules ONE render with final state = 2
  };
}`,
            )}

            <h2>Deriving State vs Storing State — A Senior-Level Design Decision</h2>
            <p>One of the most common architectural mistakes in React is storing values in state that should be derived from existing state. This creates <strong>duplicate state</strong> that must be kept in sync manually — and it will drift.</p>
            ${code(
              "jsx",
              `// ❌ DUPLICATE STATE — totalPrice must be manually kept in sync
function Cart() {
  const [items, setItems] = useState([]);
  const [totalPrice, setTotalPrice] = useState(0); // duplicated!

  const addItem = (item) => {
    setItems(prev => [...prev, item]);
    setTotalPrice(prev => prev + item.price); // must remember to update both
    // One day someone will update items without updating totalPrice
    // They will be correct, and the UI will be wrong
  };
}

// ✅ DERIVED VALUE — computed from the single source of truth
function Cart() {
  const [items, setItems] = useState([]);

  // totalPrice is always accurate — it's computed fresh each render
  const totalPrice = items.reduce((sum, item) => sum + item.price, 0);

  const addItem = (item) => {
    setItems(prev => [...prev, item]);
    // totalPrice automatically updates — no manual sync needed
  };
}`,
            )}
            <p>The rule: if a value can be computed from existing state or props during render, compute it. Don't store it. The only exception is when the computation is so expensive it needs memoization — which is a <code>useMemo</code> concern, not a <code>useState</code> concern.</p>

            <h2>Structuring State — Flat vs Nested</h2>
            <p>How you structure state has direct consequences for correctness and render performance.</p>
            ${code(
              "jsx",
              `// ❌ DEEPLY NESTED STATE — painful to update immutably
const [state, setState] = useState({
  user: {
    profile: {
      address: {
        city: 'Mumbai'
      }
    }
  }
});

// Updating city requires spreading at every level:
setState(prev => ({
  ...prev,
  user: {
    ...prev.user,
    profile: {
      ...prev.user.profile,
      address: {
        ...prev.user.profile.address,
        city: 'Delhi'
      }
    }
  }
}));
// Miss one spread and you've silently wiped out sibling data

// ✅ FLAT STATE — each piece of data is a separate useState
const [city, setCity] = useState('Mumbai');
const [userName, setUserName] = useState('');
const [profileBio, setProfileBio] = useState('');

// Update city:
setCity('Delhi'); // clean, obvious, impossible to accidentally wipe siblings`,
            )}
            <p><strong>When grouped state makes sense:</strong> Group state that always changes together. If <code>x</code> and <code>y</code> coordinates always update in the same event, one <code>useState({ x, y })</code> is cleaner than two. If they sometimes update independently, keep them separate.</p>

            <h2>The useState Update Cycle in React 18 — Complete Picture</h2>
            <div class="setstate-flow">

            <h2>State Colocation — Where State Lives Matters</h2>
            <p>A senior developer thinks carefully about where in the component tree state lives. The principle is <strong>colocate state as close as possible to where it is used.</strong></p>
            ${code(
              "jsx",
              `// ❌ STATE TOO HIGH — App holds state only one child needs
function App() {
  const [isDropdownOpen, setDropdownOpen] = useState(false); // only used in Nav

  return (
    <>
      <Nav isOpen={isDropdownOpen} onToggle={setDropdownOpen} />
      <Main /> {/* re-renders on every dropdown toggle — wasteful */}
      <Footer /> {/* re-renders on every dropdown toggle — wasteful */}
    </>
  );
}

// ✅ COLOCATED — state lives where it's actually used
function Nav() {
  const [isDropdownOpen, setDropdownOpen] = useState(false);
  // Main and Footer never know this state exists — they never re-render for it
  return <nav>...</nav>;
}`,
            )}
            <p>When multiple components need the same state, lift it to their closest common ancestor — not higher. This is <strong>state lifting</strong>, and it's the correct counterpart to colocation.</p>
            <p>Scenario: Both SearchInput and SearchResults need the query value.</p>
            ${code(

  App
  ├── SearchInput (has its own query state)
  └── SearchResults (has its own query state — will go out of sync)

After lifting — single source of truth at the closest common ancestor:
  App (holds query state, passes down as props)
  ├── SearchInput (receives query, calls setQuery)
  └── SearchResults (receives query, uses it to filter)`,

          body: () => `
            <h2>Why This Chapter Exists</h2>
            <p><code>useState</code> takes you far. But there's a class of state problems where <code>useState</code> starts producing messy, fragile code — multiple related state variables that must update together, state transitions that have rules, values that need to persist across renders without triggering them. This chapter covers exactly those cases.</p>

            ${reads(
              "The Old Way: Class Components and Complex State",
              `
            <h2>How Complex State Was Managed Before Hooks</h2>
            <p>In class components, all state lived in a single <code>this.state</code> object. For simple components this was fine. For complex ones it created two distinct problems.</p>

            <h3>Problem 1 — Everything in one object, manually merged</h3>
            ${code(
              "js",
              `class UserDashboard extends React.Component {
  state = {
    user: null,
    posts: [],
    comments: [],
    isLoadingUser: false,
    isLoadingPosts: false,
    userError: null,
    postsError: null,
    selectedPostId: null,
    isModalOpen: false,
    filterText: '',
    sortOrder: 'asc',
  };

  // Every update required manually spreading the rest of state
  // Miss one spread and you silently wipe unrelated data
  handleFilterChange = (text) => {
    this.setState({ filterText: text }); // fine — setState merges shallowly
  };

  handleUserLoad = (user) => {
    this.setState({
      user,
      isLoadingUser: false,
      userError: null,
      // If you forgot these ^ fields, they'd still persist
      // because class setState does a SHALLOW merge
    });
  };
}`,
            )}
            <p>Class <code>setState</code> did one helpful thing: it shallow-merged state automatically. You could call <code>this.setState({ filterText: 'hello' })</code> and the rest of <code>this.state</code> was preserved. This made class components tolerant of forgetting to spread — at the cost of making it hard to track what a g/iven <code>setState</code> call actually changed.</p>

            <h3>Problem 2 — State transitions had no rules</h3>
            <p>The second problem was more serious. In complex UIs, state doesn't just change — it transitions. A form goes from <code>idle</code> → <code>submitting</code> → <code>success</code> or <code>error</code>. A modal goes from <code>closed</code> → <code>open</code> → <code>closing</code>. These transitions have rules: you can't go from success directly back to <code>submitting</code>. You can't be both <code>loading</code> and <code>error</code> simultaneously.</p>
            <p>In class components, nothing enforced these rules:</p>
            ${code(
              "js",
              `// ❌ These three could be true simultaneously — nonsensical state
this.setState({ isLoading: true, isError: true, isSuccess: true });

// No mechanism prevented invalid combinations
// You'd catch it in testing (if you had tests) or in production (if you didn't)`,
            )}
            <p>This led to the classic boolean flag soup that every React developer has written and regretted:</p>
            ${code(
              "js",
              `state = {
  isLoading: false,
  isError: false,
  isSuccess: false,
  // These 3 booleans = 8 possible combinations
  // Only 4 are valid: idle, loading, error, success
  // 4 invalid states can silently exist in production
};`,
            )}

            <h2>The Pattern That Emerged — Reducers in Class Components</h2>
            <p>Experienced developers recognized this problem early and started centralizing state transitions into explicit functions before Redux even existed:</p>
            ${code(
              "js",
              `// Pre-hooks pattern: explicit state transition function
applyAction(action) {
  switch (action.type) {
    case 'FETCH_START':
      return { ...this.state, isLoading: true, isError: false };
    case 'FETCH_SUCCESS':
      return { ...this.state, isLoading: false, data: action.payload };
    case 'FETCH_ERROR':
      return { ...this.state, isLoading: false, isError: true, error: action.error };
    default:
      return this.state;
  }
}

handleAction = (action) => {
  this.setState(this.applyAction(action));
};`,
            )}
            <p>This pattern — a pure function that takes current state and an action, returns new state — is exactly what <code>useReducer</code> formalizes. React recognized that this pattern was so useful it deserved a first-class hook.</p>

            <h2>DOM Access in Class Components — Callback Refs and createRef</h2>
            <p>Directly accessing DOM nodes in class components required either callback refs or <code>React.createRef()</code>:</p>
            ${code(
              "js",
              `class TextInput extends React.Component {
  // React 16.3+: createRef
  inputRef = React.createRef();

  componentDidMount() {
    // DOM is ready after mount — safe to access
    this.inputRef.current.focus();
  }

  render() {
    return <input ref={this.inputRef} />;
  }
}

// Older pattern: callback ref
class TextInput extends React.Component {
  setInputRef = (element) => {
    this.inputNode = element; // stored directly on the instance
  };

  componentDidMount() {
    this.inputNode.focus();
  }

  render() {
    return <input ref={this.setInputRef} />;
  }
}`,
            )}
            <p>The instance itself (<code>this</code>) acted as a natural mutable container — you could store anything on <code>this</code> and it persisted for the component's lifetime without triggering re-renders. This was one of the genuine conveniences of class components that hooks had to explicitly replace.</p>

            `,
              "The New Way: useReducer and useRef",
              `
            <h2>useReducer — The Complete Mental Model</h2>
            <p><code>useReducer</code> is not just "useState for complex state." It represents a fundamentally different way of thinking about state changes — moving from <strong>"what should state be"</strong> to <strong>"what happened, and let a pure function decide what state should be."</strong></p>
            <p>The anatomy:</p>
            ${code(
              "txt",
              `const [state, dispatch] = useReducer(reducer, initialState);
         │        │           │           │
         │        │           │           └── Starting value
         │        │           └────────────── Pure function: (state, action) => newState
         │        └────────────────────────── Function to send actions to the reducer
         └─────────────────────────────────── Current state snapshot (same as useState)`,
            )}
            <p>The reducer itself is just a pure function. No side effects. Given the same state and action, it always returns the same new state:</p>
            ${code(
              "js",
              `function reducer(state, action) {
  switch (action.type) {
    case 'increment':
      return { ...state, count: state.count + 1 };
    case 'decrement':
      return { ...state, count: state.count - 1 };
    case 'reset':
      return { ...state, count: 0 };
    default:
      // Always handle the default — returning state unchanged
      // is safe; throwing is also valid for unknown actions in development
      throw new Error(\`Unknown action: \${action.type}\`);
  }
}

function Counter() {
  const [state, dispatch] = useReducer(reducer, { count: 0 });

  return (
    <>
      <p>{state.count}</p>
      <button onClick={() => dispatch({ type: 'increment' })}>+</button>
      <button onClick={() => dispatch({ type: 'decrement' })}>-</button>
      <button onClick={() => dispatch({ type: 'reset' })}>Reset</button>
    </>
  );
}`,
            )}
            <p>Let's now understand the full internal picture of how useReducer works inside Fiber.</p>

            <h3>The dispatch → reducer → new state pipeline</h3>
            <div class="setstate-flow">
              <div class="ss-step start">dispatch({ type: 'increment', payload: 5 })<small>any serializable object — type is convention</small></div>
              <div class="ss-arrow">↓</div>
              <div class="ss-step boundary">Update enqueued on fiber node<small>same queue as useState — batched with React 18</small></div>
              <div class="ss-arrow">↓</div>
              <div class="ss-step">reducer(currentState, action) → newState<small>pure function — no side effects, no mutation — same inputs always produce same output</small></div>
              <div class="ss-arrow">↓</div>
              <div class="ss-step">Object.is(oldState, newState)?<small>identical → bail out, no re-render</small></div>
              <div class="ss-bail">bail out → no render</div>
              <div class="ss-arrow">↓</div>
              <div class="ss-step">Component re-renders with new state snapshot</div>
            </div>
            <p>Two things stand out in this pipeline that catch developers off guard. First, <code>dispatch</code> is fully batched in React 18 — multiple <code>dispatch</code> calls in the same tick produce one re-render. Second, the <code>Object.is</code> bail-out applies to the object returned from the reducer. If you return the same state reference from your reducer, React skips re-rendering entirely — which is why reducers must always return a new object when state changes.</p>

            <h2>The Reducer Pattern — From Fragile Flags to Explicit Machines</h2>
            <p>Let's take the classic "boolean soup" problem and show exactly how a reducer solves it architecturally.</p>
            <h3>The problem — impossible states exist</h3>
            ${code(
              "jsx",
              `// ❌ 3 booleans = 8 combinations, only 4 are valid
function DataFetcher() {
  const [isLoading, setIsLoading] = useState(false);
  const [isError, setIsError]   = useState(false);
  const [isSuccess, setIsSuccess] = useState(false);
  const [data, setData]           = useState(null);

  // Nothing stops this from happening:
  setIsLoading(true);
  setIsError(true);   // loading AND error simultaneously — nonsense
  setIsSuccess(true); // loading AND error AND success — pure chaos

  // Real bugs from this pattern:
  // - Forgot to setIsLoading(false) on error
  // - Forgot to setIsError(false) before retry
  // - Showed both error message AND success message simultaneously
}`,
            )}
            <h3>The reducer solution — only valid states can exist</h3>
            ${code(
              "jsx",
              `// ✅ Explicit state machine — invalid combinations are structurally impossible
const initialState = { status: 'idle', data: null, error: null };
// status can ONLY be: 'idle' | 'loading' | 'success' | 'error'
// You physically cannot be in two statuses simultaneously

function fetchReducer(state, action) {
  switch (action.type) {
    case 'fetch/start':
      return { status: 'loading', data: null, error: null };
    case 'fetch/success':
      return { status: 'success', data: action.payload, error: null };
    case 'fetch/error':
      return { status: 'error', data: null, error: action.error };
    case 'fetch/reset':
      return initialState;
    default:
      throw new Error(\`Unhandled action: \${action.type}\`);
  }
}

function DataFetcher() {
  const [state, dispatch] = useReducer(fetchReducer, initialState);

  const load = async () => {
    dispatch({ type: 'fetch/start' });
    try {
      const data = await fetchData();
      dispatch({ type: 'fetch/success', payload: data });
    } catch (err) {
      dispatch({ type: 'fetch/error', error: err.message });
    }
  };

  // Rendering is now a simple map over a single status value
  return (
    <div>
      {state.status === 'idle'    && <button onClick={load}>Load</button>}
      {state.status === 'loading' && <Spinner />}
      {state.status === 'success' && <DataView data={state.data} />}
      {state.status === 'error'   && <ErrorMsg msg={state.error} />}
    </div>
  );
}`,
            )}
            <p>The reducer doesn't just organize code — it makes impossible states unrepresentable. There is no code path that produces <code>{ status: 'loading', error: 'something' }</code> because the <code>fetch/start</code> action always wipes <code>error</code> to <code>null</code>.</p>

            <h2>The Full Reducer Pattern with TypeScript — What Seniors Write</h2>
            <p>In a real codebase, reducers are typed with discriminated unions, making every action and every state shape explicit and compiler-enforced:</p>
            ${code(
              "tsx",
              `// State — each status owns its own shape
type State =
  | { status: 'idle' }
  | { status: 'loading' }
  | { status: 'success'; data: User[] }
  | { status: 'error';   error: string };

// Actions — discriminated union of every possible event
type Action =
  | { type: 'fetch/start' }
  | { type: 'fetch/success'; payload: User[] }
  | { type: 'fetch/error';   error: string }
  | { type: 'fetch/reset' };

function reducer(state: State, action: Action): State {
  switch (action.type) {
    case 'fetch/start':
      return { status: 'loading' };

    case 'fetch/success':
      return { status: 'success', data: action.payload };
      // TypeScript knows action.payload exists here because
      // the discriminant 'fetch/success' narrows the union

    case 'fetch/error':
      return { status: 'error', error: action.error };

    case 'fetch/reset':
      return { status: 'idle' };
  }
  // No default needed — TypeScript guarantees exhaustiveness
  // If you add a new action type and forget to handle it,
  // the compiler errors at build time — not at runtime
}`,
            )}
            <p>This is one of the most powerful combinations in React: <code>useReducer</code> + TypeScript discriminated unions. Every state transition is documented, every shape is verified, and impossible states are compile-time errors.</p>

            <h2>useReducer vs useState — The Senior Decision Framework</h2>
            <p>This is a question that comes up constantly in code review. Here's the complete decision matrix:</p>
            <div class="fullpic-diagram cmp-reducer">
              <div class="fp-head">
                <div>Factor</div>
                <div class="fp-old">Use useState</div>
                <div class="fp-new">Use useReducer</div>
              </div>
              <div class="fp-row">
                <div class="fp-concept">State shape<small>How complex is the data?</small></div>
                <div class="fp-cell old">Single primitive<small>count, isOpen, name</small></div>
                <div class="fp-cell new">Object with related fields<small>status + data + error</small></div>
              </div>
              <div class="fp-row">
                <div class="fp-concept">Transition rules<small>Are updates conditional?</small></div>
                <div class="fp-cell old">No rules — free updates<small>setCount, setName</small></div>
                <div class="fp-cell new">Explicit valid transitions<small>Can't go error → loading</small></div>
              </div>
              <div class="fp-row">
                <div class="fp-concept">Testability<small>How is logic tested?</small></div>
                <div class="fp-cell old">Test via component render<small>needs React testing tools</small></div>
                <div class="fp-cell new">Test reducer in isolation<small>plain unit tests, no React</small></div>
              </div>
              <div class="fp-row">
                <div class="fp-concept">Update coordination<small>Do fields update together?</small></div>
                <div class="fp-cell old">Fields update independently<small>separate useState per field</small></div>
                <div class="fp-cell new">Multiple fields update atomically<small>one action → consistent state</small></div>
              </div>
              <div class="fp-row">
                <div class="fp-concept">Debugging needs<small>How important is tracing?</small></div>
                <div class="fp-cell old">Simple — easy to trace<small>source visible in DevTools</small></div>
                <div class="fp-cell new">Action log = history<small>undo/redo, time travel</small></div>
              </div>
            </div>
            <div class="mental-model">
              <div class="mm-title">Rule of thumb</div>
              <p>If the next state depends on the previous state AND involves multiple related fields updating together — reach for useReducer.</p>
            </div>
            <h3>The killer advantage of reducers — pure function testability</h3>
            <p>This is something juniors rarely think about but seniors value deeply. A reducer is just a function. You can test every state transition without rendering a single component, without a DOM, without React Testing Library, without mocking anything:</p>
            ${code(
              "js",
              `// Pure unit tests — fast, isolated, exhaustive
describe('fetchReducer', () => {
  it('transitions to loading on fetch/start', () => {
    const state = { status: 'idle' };
    const next = fetchReducer(state, { type: 'fetch/start' });
    expect(next).toEqual({ status: 'loading' });
  });

  it('clears error when retrying', () => {
    const state = { status: 'error', error: 'Network failure' };
    const next = fetchReducer(state, { type: 'fetch/start' });
    expect(next.error).toBeNull();
    expect(next.status).toBe('loading');
  });

  it('preserves data on error during re-fetch', () => {
    const state = { status: 'success', data: [1, 2, 3] };
    const next = fetchReducer(state, { type: 'fetch/error', error: 'Timeout' });
    // Business rule: keep stale data visible while showing error
    expect(next.data).toEqual([1, 2, 3]);
    expect(next.status).toBe('error');
  });
});`,
            )}
            <p>Try doing this with <code>useState</code> scattered across a component. You can't — you'd need to render the whole component and simulate events. The reducer externalizes your business logic, making it trivially testable.</p>

            <h2>Lazy Initialization in useReducer</h2>
            <p>Just like <code>useState</code>, <code>useReducer</code> accepts a third argument — a lazy initializer function. This is especially important when the initial state is computed from props:</p>
            ${code(
              "jsx",
              `function initState(initialCount) {
  // This runs only ONCE — on first render
  // Safe to do expensive computation here
  return {
    count: initialCount,
    history: [],
    lastModified: null,
  };
}

function Counter({ initialCount }) {
  // ✅ Third argument: initializer function
  // React calls initState(initialCount) once
  // initialCount is passed as the argument to initState
  const [state, dispatch] = useReducer(reducer, initialCount, initState);
}`,
            )}
            <p>Without the lazy initializer, <code>initState(initialCount)</code> would run on every render and be discarded — exactly the same problem as passing a computed value to <code>useState</code> directly.</p>

            <h2>useRef — The Complete Mental Model</h2>
            <p>useRef is one of the most misunderstood hooks because it serves two completely different purposes under the same API. Understanding both clearly is what separates senior developers from intermediate ones.</p>
            <p>The core definition:</p>
            ${callout(
              "key",
              "<code>useRef</code> creates a plain mutable JavaScript object { current: initialValue } that persists for the full lifetime of the component — and changing .current never triggers a re-render.",
            )}
            <p>That last part is the key. <code>useRef</code> is React's escape hatch out of the rendering model. It's a place to store things that need to exist between renders but whose changes shouldn't cause renders.</p>

            <h3>Purpose 1 — DOM access</h3>
            <p>The most familiar use. You need a direct reference to a real DOM node — to focus it, measure it, integrate a third-party library, animate it, etc.</p>
            ${code(
              "jsx",
              `function SearchInput() {
  const inputRef = useRef(null);

  useEffect(() => {
    // After mount, DOM node is available on inputRef.current
    inputRef.current.focus();
  }, []);

  const handleClear = () => {
    inputRef.current.value = ''; // direct DOM manipulation
    inputRef.current.focus();
  };

  // ref prop connects the fiber node to the ref object
  // After commit, inputRef.current = the real <input> DOM node
  return (
    <input
      ref={inputRef}
      type="search"
      placeholder="Search..."
    />
  );
}`,
            )}
            <p>React sets <code>ref.current</code> during the commit phase — after the DOM is updated, before <code>useEffect</code> fires. So <code>ref.current</code> is always <code>null</code> during render, and always the real DOM node inside <code>useEffect</code>.</p>

            <h3>Purpose 2 — Mutable value that persists without triggering re-renders</h3>
            <p>This is the less obvious but equally important use. Any time you need a value that:</p>
            <ul>
              <li>persists across renders</li>
              <li>can be mutated freely</li>
              <li>should NOT cause re-renders when changed</li>
            </ul>
            <p>...you want <code>useRef</code>, not <code>useState</code>.</p>
            ${code(
              "jsx",
              `function Stopwatch() {
  const [time, setTime] = useState(0);
  const intervalRef = useRef(null); // stores the interval ID between renders

  const start = () => {
    // ✅ intervalRef.current mutated — no re-render triggered
    intervalRef.current = setInterval(() => {
      setTime(t => t + 1); // this DOES trigger re-renders (by design)
    }, 1000);
  };

  const stop = () => {
    clearInterval(intervalRef.current);
    intervalRef.current = null;
  };

  // If we used useState for intervalId:
  // setIntervalId(id) would trigger a re-render on start
  // That re-render would be completely wasted — UI doesn't show the ID
  // useRef is exactly right here
}`,
            )}
            <p>The canonical cases for ref-as-mutable-value:</p>
            ${code(
              "jsx",
              `// 1. Tracking whether the component is mounted (avoiding state update on unmounted component)
const isMountedRef = useRef(false);
useEffect(() => {
  isMountedRef.current = true;
  return () => { isMountedRef.current = false; };
}, []);

// 2. Storing previous value of a prop or state
function usePrevious(value) {
  const ref = useRef();
  useEffect(() => {
    ref.current = value; // runs after render — stores previous render's value
  });
  return ref.current; // returns value from BEFORE this render
}

// 3. Storing a timer ID, animation frame ID, subscription
const timerRef = useRef(null);
const rafRef = useRef(null);
const subscriptionRef = useRef(null);

// 4. Storing a callback that needs the latest value without re-subscribing
const callbackRef = useRef(onDataChange);
useEffect(() => {
  callbackRef.current = onDataChange; // always keep it fresh
}, [onDataChange]);`,
            )}
            <h3>The ref vs state decision — visualized</h3>
            <div class="refstate-diagram">
              <div class="rs-question">Should UI update when this value changes?<small>(precondition: does it change over time?)</small></div>
              <div class="rs-branches">
                <div class="rs-branch">
                  <div class="rs-edge">No</div>
                  <div class="rs-outcome ref">useRef<small>mutation, no re-render</small></div>
                  <div class="rs-examples">
                    <div class="rs-ex-title">useRef examples</div>
                    <ul>
                      <li>DOM node reference</li>
                      <li>Timer / interval ID</li>
                      <li>Previous value tracking</li>
                      <li>Mounted flag</li>
                      <li>Latest callback ref</li>
                      <li>AbortController ref</li>
                    </ul>
                  </div>
                </div>
                <div class="rs-branch">
                  <div class="rs-edge">Yes</div>
                  <div class="rs-outcome state">useState / useReducer<small>triggers re-render</small></div>
                  <div class="rs-examples">
                    <div class="rs-ex-title">useState / useReducer examples</div>
                    <ul>
                      <li>Counter shown in UI</li>
                      <li>Loading / error state</li>
                      <li>Form field values</li>
                      <li>Toggle open/closed</li>
                      <li>Selected item</li>
                      <li>Fetched data</li>
                    </ul>
                  </div>
                </div>
              </div>
              <div class="rs-warn">⚠ Reading ref.current during render is unreliable — refs update after commit, not during render</div>
            </div>

            <h2>forwardRef and useImperativeHandle</h2>
            <p>When a parent component needs to call methods on a child component's DOM node — or on the child component itself — you need <code>forwardRef</code> and <code>useImperativeHandle</code>.</p>
            <h3>forwardRef — passing refs through components</h3>
            <p>By default, you cannot attach a <code>ref</code> to a function component — refs are not props. <code>forwardRef</code> is the mechanism to explicitly pass a ref down:</p>
            ${code(
              "jsx",
              `// ✅ Without forwardRef, ref is silently ignored on function components
// This is a common silent bug

// Wrapping with forwardRef lets the parent pass a ref in
const FancyInput = React.forwardRef((props, ref) => {
  return (
    <div className="input-wrapper">
      <input ref={ref} {...props} />  {/* ref forwarded to real DOM node */}
    </div>
  );
});

// Parent can now access the underlying <input> directly
function Form() {
  const inputRef = useRef(null);

  useEffect(() => {
    inputRef.current.focus(); // works — ref points to <input> inside FancyInput
  }, []);

  return <FancyInput ref={inputRef} placeholder="Enter name" />;
}`,
            )}
            <p>In React 19, <code>forwardRef</code> is no longer needed — <code>ref</code> is now a regular prop:</p>
            ${code(
              "jsx",
              `// React 19 — ref is just a prop, no forwardRef wrapper needed
function FancyInput({ ref, ...props }) {
  return (
    <div className="input-wrapper">
      <input ref={ref} {...props} />
    </div>
  );
}`,
            )}
            <h3>useImperativeHandle — exposing a custom API instead of the raw DOM</h3>
            <p><code>forwardRef</code> exposes the raw DOM node. Sometimes you want to expose a higher-level API instead — specific methods only, not the full DOM:</p>
            ${code(
              "jsx",
              `const VideoPlayer = React.forwardRef((props, ref) => {
  const videoRef = useRef(null);

  // Expose ONLY these three methods to the parent
  // Parent cannot access the raw <video> DOM node — only this interface
  useImperativeHandle(ref, () => ({
    play() {
      videoRef.current.play();
    },
    pause() {
      videoRef.current.pause();
    },
    seekTo(time) {
      videoRef.current.currentTime = time;
    },
    // Parent cannot call videoRef.current.src = '...' directly
    // Encapsulation is preserved
  }), []); // deps array — when to re-create the imperative handle

  return <video ref={videoRef} src={props.src} />;
});

// Parent usage
function Page() {
  const playerRef = useRef(null);

  return (
    <>
      <VideoPlayer ref={playerRef} src="/movie.mp4" />
      <button onClick={() => playerRef.current.play()}>Play</button>
      <button onClick={() => playerRef.current.pause()}>Pause</button>
      <button onClick={() => playerRef.current.seekTo(30)}>Skip 30s</button>
    </>
  );
}`,
            )}
            <p>The rule for <code>useImperativeHandle</code>: use it only when the imperative API is genuinely cleaner than the declarative one. For most cases, passing state and handlers as props is the right model. <code>useImperativeHandle</code> is for cases like media players, canvas animations, third-party library wrappers, and focus management utilities.</p>

            <h2>Immer — Ergonomic Immutable Updates</h2>
            <p>One legitimate complaint about <code>useReducer</code> is that updating deeply nested state with spread operators is verbose and error-prone. Immer solves this by letting you write "mutating" code that is automatically converted to immutable updates:</p>
            ${code(
              "jsx",
              `import { produce } from 'immer';

// Without Immer — spreading at every nesting level
function reducer(state, action) {
  switch (action.type) {
    case 'update/city':
      return {
        ...state,
        user: {
          ...state.user,
          address: {
            ...state.user.address,
            city: action.city,  // only this changed
          },
        },
      };
  }
}

// With Immer — write directly as if mutating, Immer handles immutability
function reducer(state, action) {
  return produce(state, draft => {
    switch (action.type) {
      case 'update/city':
        draft.user.address.city = action.city; // looks like mutation, isn't
        break;
      case 'add/item':
        draft.cart.items.push(action.item);    // push is safe in Immer
        break;
      case 'remove/item':
        draft.cart.items = draft.cart.items.filter(i => i.id !== action.id);
        break;
    }
    // Immer compares draft to original, creates new state only for changed parts
  });
}`,
            )}
            <p>Immer's <code>produce</code> uses ES6 Proxies to intercept mutations on <code>draft</code>, tracks exactly what changed, and produces a new immutable state tree. Unchanged nested objects retain their same reference — meaning React's bail-out optimizations still work correctly.</p>

            <h2>State Normalization — The Senior Architecture Pattern</h2>
            <p>When working with relational data (users who have posts, posts who have comments), storing it as nested arrays causes a cascade of painful update problems:</p>
            ${code(
              "jsx",
              `// ❌ NESTED STATE — updating a comment requires finding it through 3 levels
const [posts, setPosts] = useState([
  {
    id: 1,
    title: 'React is great',
    comments: [
      { id: 101, text: 'Agreed!', likes: 5 },
      { id: 102, text: 'Very helpful', likes: 3 },
    ],
  },
  // ...
]);

// To update comment 101's likes, you must:
setPosts(posts.map(post =>
  post.id === 1
    ? {
        ...post,
        comments: post.comments.map(comment =>
          comment.id === 101
            ? { ...comment, likes: comment.likes + 1 }
            : comment
        ),
      }
    : post
));
// This is 8 lines for a 1-field update. With 5 nesting levels it's untenable.`,
            )}
            <p>The solution — normalize state like a database: entities stored by ID, relationships stored as arrays of IDs:</p>
            ${code(
              "jsx",
              `// ✅ NORMALIZED STATE — flat, fast, easy to update
const initialState = {
  posts: {
    byId: {
      1: { id: 1, title: 'React is great', commentIds: [101, 102] },
    },
    allIds: [1],
  },
  comments: {
    byId: {
      101: { id: 101, text: 'Agreed!', likes: 5 },
      102: { id: 102, text: 'Very helpful', likes: 3 },
    },
    allIds: [101, 102],
  },
};

// To update comment 101's likes — ONE level deep, always:
function reducer(state, action) {
  switch (action.type) {
    case 'comment/like':
      return produce(state, draft => {
        draft.comments.byId[action.id].likes += 1; // direct, simple, fast
      });
  }
}`,
            )}
            <p>The pattern directly mirrors how databases work: entities stored by primary key, relationships as foreign key arrays. <code>O(1)</code> lookups by ID instead of <code>O(n)</code> array scans. Updates always touch exactly one entity. This is the architecture used by Redux Toolkit's <code>createEntityAdapter</code> — which you'll see in Chapter 12.</p>

            <h2>Finite State Machines in React — The Complete Pattern</h2>
            <p>The most powerful application of useReducer is modeling UI as an explicit finite state machine. This is what distinguishes robust production components from fragile ones.</p>
            ${code(
              "jsx",
              `// A modal that manages its own animation lifecycle
// States: closed → opening → open → closing → closed
// Invalid transitions are rejected by the reducer

const MODAL_STATES = {
  CLOSED:   'closed',
  OPENING:  'opening',
  OPEN:     'open',
  CLOSING:  'closing',
};

function modalReducer(state, action) {
  switch (state.phase) {

    case MODAL_STATES.CLOSED:
      if (action.type === 'open') return { phase: MODAL_STATES.OPENING };
      return state; // all other actions ignored in CLOSED state

    case MODAL_STATES.OPENING:
      if (action.type === 'animation/done') return { phase: MODAL_STATES.OPEN };
      if (action.type === 'close') return { phase: MODAL_STATES.CLOSING }; // cancel opening
      return state;

    case MODAL_STATES.OPEN:
      if (action.type === 'close') return { phase: MODAL_STATES.CLOSING };
      return state;

    case MODAL_STATES.CLOSING:
      if (action.type === 'animation/done') return { phase: MODAL_STATES.CLOSED };
      return state; // cannot re-open while closing

    default:
      throw new Error(\`Unknown phase: \${state.phase}\`);
  }
}

function Modal({ children }) {
  const [state, dispatch] = useReducer(modalReducer, { phase: MODAL_STATES.CLOSED });

  return (
    <>
      <button onClick={() => dispatch({ type: 'open' })}>Open</button>

      {state.phase !== MODAL_STATES.CLOSED && (
        <div
          className={\`modal modal--\${state.phase}\`} // CSS handles animation
          onAnimationEnd={() => dispatch({ type: 'animation/done' })}
        >
          {children}
          <button onClick={() => dispatch({ type: 'close' })}>Close</button>
        </div>
      )}
    </>
  );
}`,
            )}
            <p>The UI can never be in <code>opening</code> and <code>closing</code> simultaneously. You can never trigger a re-open while a close animation is running. The state machine makes these guarantees structurally, not through careful boolean management.</p>
            `,
            )}

            <h2>The Dependency Array — Every Rule Explained</h2>
            <p>The dependency array is the source of more <code>useEffect</code> bugs than anything else. Most developers guess at it. Seniors understand exactly what it does and why.</p>
            <h3>What the dependency array actually is</h3>
            <p>The dependency array is not a performance optimization. It is a <strong>declaration of what values your effect depends on.</strong> React uses it to know when the effect's synchronization needs to re-run. The contract:</p>
            ${callout(

  const [user, setUser] = useState(null);

  useEffect(() => {
    // This effect uses \`userId\`
    // Therefore \`userId\` MUST be in the dep array
    fetchUser(userId).then(setUser);
  }, [userId]); // ✅ correct
}`,
            )}

// 2. Empty array — runs once after mount, cleanup on unmount

  const socket = connectWebSocket();
  return () => socket.disconnect();

// NOT correct when: you use props/state inside the effect (stale closure bug)

// 3. Specific deps — runs after mount AND whenever any dep changes
useEffect(() => {
  fetchUser(userId);
}, [userId]);

            <h2>Race Conditions — The Async useEffect Bug That Ships to Production</h2>
            <p>Race conditions in <code>useEffect</code> are one of the most common bugs in production React apps. They're subtle, hard to reproduce locally (requires specific timing), and dangerous because the UI silently shows wrong data.</p>
            <p>The scenario: a user navigates quickly between two profiles. Two fetches fire. The second resolves before the first. The first fetch resolves last and overwrites the correct data with stale data.</p>
            ${code(
              "txt",
              `User views Profile A → fetch A starts
User views Profile B → fetch B starts
fetch B resolves → shows Profile B data ✓
fetch A resolves → shows Profile A data ✗  (wrong — B is selected)`,

              "jsx",
              `// ❌ RACE CONDITION — no cancellation, last-write-wins
function Profile({ userId }) {
  const [profile, setProfile] = useState(null);

  useEffect(() => {
    fetchProfile(userId).then(data => {
      setProfile(data); // could be stale data from previous userId
    });
  }, [userId]);
}

// ✅ FIX 1 — AbortController (best for fetch)
function Profile({ userId }) {
  const [profile, setProfile] = useState(null);

  useEffect(() => {
    const controller = new AbortController();

    fetchProfile(userId, { signal: controller.signal })
      .then(data => setProfile(data))
      .catch(err => { if (err.name !== 'AbortError') throw err; });

    return () => controller.abort();
    // When userId changes, cleanup aborts the old fetch
    // before the new effect starts a fresh fetch
  }, [userId]);
}

// ✅ FIX 2 — ignore flag (for non-fetch async operations)
function Profile({ userId }) {
  const [profile, setProfile] = useState(null);

  useEffect(() => {
    let ignored = false; // local flag scoped to THIS effect invocation

    fetchProfile(userId).then(data => {
      if (!ignored) setProfile(data); // only apply if still relevant
    });

    return () => { ignored = true; }; // mark this invocation as stale
    // When userId changes:
    // - cleanup sets ignored=true for the old effect
    // - new effect runs with its own ignored=false
    // - if old fetch resolves after new effect starts → ignored=true → skipped
  }, [userId]);
}`,

            <h2>Effects That Should Not Exist</h2>
            <p>This is where the senior mental model separates from the intermediate one. A significant portion of <code>useEffect</code> calls in real codebases are wrong — not because the code doesn't work, but because the problem they're solving shouldn't be solved with an effect at all.</p>
            <h3>Anti-pattern 1: Deriving state in an effect</h3>

  }, [items]);

  // And total is briefly stale between the two renders

  // ✅ CORRECT — derive inline during render
  const total = items.reduce((sum, i) => sum + i.price, 0);
  // One render, always correct, no effect needed
}`,

  setError(null);

            <p>React 18 Strict Mode deliberately mounts, unmounts, and remounts every component in development. This means your effect runs twice on initial mount (setup → cleanup → setup). This is intentional.</p>
            ${code(
              "txt",

mount  → effect runs (setup)
       → effect cleanup runs
       → effect runs again (setup)

Production:
mount  → effect runs (setup) — once only`,

  // No cleanup → two open connections in dev, visible in network tab
}, []);

useEffect(() => {
  const ws = new WebSocket('wss://api.example.com');
  ws.onmessage = handleMessage;
  return () => ws.close(); // cleanup properly tears down the connection
}, []);`,

            <h2>The Custom Hook Pattern for Effects — Senior Architecture</h2>
            <p>Wrapping useEffect in a custom hook is one of the highest-leverage patterns in React. It takes an imperative, side-effectful concern and gives it a clean, declarative, reusable interface:</p>
            ${code(
              "jsx",
              `// useEffect scattered in component — hard to reuse, hard to test
function UserProfile({ userId }) {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    const controller = new AbortController();
    setLoading(true);

    fetch(\`/api/users/\${userId}\`, { signal: controller.signal })
      .then(r => r.json())
      .then(data => { setUser(data); setLoading(false); })
      .catch(err => {
        if (err.name === 'AbortError') return;
        setError(err.message); setLoading(false);
      });

    return () => controller.abort();
  }, [userId]);

  // ... render
}

// ✅ Extracted into a custom hook — reusable, testable, clean
function useFetch(url) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    const controller = new AbortController();
    setLoading(true);
    setError(null);

    fetch(url, { signal: controller.signal })
      .then(r => {
        if (!r.ok) throw new Error(\`HTTP \${r.status}\`);
        return r.json();
      })
      .then(data => { setData(data); setLoading(false); })
      .catch(err => {
        if (err.name === 'AbortError') return;
        setError(err.message); setLoading(false);
      });

    return () => controller.abort();
  }, [url]);

  return { data, loading, error };
}

// Component is now clean and declarative
function UserProfile({ userId }) {
  const { data: user, loading, error } = useFetch(\`/api/users/\${userId}\`);

  if (loading) return <Spinner />;
  if (error) return <ErrorMsg message={error} />;
  return <ProfileView user={user} />;
}`,
            )}

            ${code(
              "jsx",
              `const UserRow = React.memo(
  ({ user, onSelect }) => {
    return <tr onClick={() => onSelect(user.id)}><td>{user.name}</td></tr>;
  },
  (prevProps, nextProps) => {
    // Return TRUE to SKIP re-render (props are "equal")
    // Return FALSE to ALLOW re-render (props are "different")

    // Custom: only re-render when user ID or name changes
    // Ignore changes to other user fields (avatar, lastLogin, etc.)
    return (
      prevProps.user.id === nextProps.user.id &&
      prevProps.user.name === nextProps.user.name &&
      prevProps.onSelect === nextProps.onSelect
    );
  }
);`,
            )}
            <p>Use this sparingly. Every custom comparator is logic that can be wrong — and wrong comparators produce the hardest-to-debug React bugs: components that don't update when they should.</p>

            <h2>The React Compiler — How It Changes Everything</h2>
            <p>The React Compiler (previously <strong>"React Forget"</strong>), stable in React 19, is a build-time tool that automatically inserts memoization where it's safe and beneficial. It analyzes your component code statically and wraps values and callbacks in the equivalent of <code>useMemo</code> and <code>useCallback</code> without you writing a single one.</p>
            ${code(
              "jsx",
              `// What you write — no manual memoization
function ProductList({ products, filters, onSelect }) {
  const filtered = products
    .filter(p => matchesFilters(p, filters))
    .sort((a, b) => a.price - b.price);

  const handleSelect = (id) => {
    onSelect(id);
    trackAnalytics('product_selected', id);
  };

  return filtered.map(p =>
    <ProductCard key={p.id} product={p} onSelect={handleSelect} />
  );
}

// What the compiler produces (conceptually):
function ProductList({ products, filters, onSelect }) {
  const filtered = useMemo(() =>
    products.filter(p => matchesFilters(p, filters)).sort(...),
    [products, filters]
  );

  const handleSelect = useCallback((id) => {
    onSelect(id);
    trackAnalytics('product_selected', id);
  }, [onSelect]);

  return filtered.map(p =>
    <ProductCard key={p.id} product={p} onSelect={handleSelect} />
  );
}`,
            )}
            <p>The compiler is smarter than manual memoization in several ways. It understands escape analysis — whether a value "escapes" its scope and actually needs to be stable. It can bail out of memoizing values that change too frequently to benefit. It never makes the mistake of missing a dependency.</p>
            <h3>What this means for how you write code today</h3>
            <p>The compiler does not eliminate the need to understand memoization — it eliminates the need to write it manually in most cases. Understanding it remains essential for:</p>
            <ul>
              <li>Diagnosing performance issues the compiler doesn't fully solve</li>
              <li>Working on codebases not yet using the compiler</li>
              <li>Recognizing when your component structure is architecturally wrong (no compiler fixes badly structured components)</li>
              <li>Senior code review — you still need to spot patterns that defeat memoization</li>
            </ul>
            <p>The practical shift: write clean, simple components first. Don't manually add <code>useMemo</code> and <code>useCallback</code> unless you've profiled and found a specific problem. The compiler handles the routine cases. You handle the architectural ones.</p>

            <h2>useMemo for Referential Stability — A Critical Use Case</h2>

            ${code(
              "jsx",

function Component({ userId, role }) {
  const options = { userId, role, timestamp: Date.now() };

  useEffect(() => {
    subscribe(options);
    return () => unsubscribe(options);
  }, [options]); // new reference every render -> effect re-runs every render
}

// STABLE — useMemo breaks the infinite loop
function Component({ userId, role }) {
  const options = useMemo(() => ({
    userId,
    role,
    // timestamp intentionally excluded — we don't want to re-subscribe on time changes
  }), [userId, role]);

  useEffect(() => {
    subscribe(options);
    return () => unsubscribe(options);
  }, [options]); // only re-runs when userId or role changes
}`,
            )}

              "key",

            <h2>Behind the Scenes — Memory Model</h2>
            <p>Before explaining the mechanics, you need to know where in memory memoized values actually live. This is something most explanations skip entirely.</p>
            <p>When React renders a component, it maintains a fiber node for it. That fiber node has a linked list of hook states hanging off it — one node per hook, in call order. Every useState, useEffect, useMemo, and useCallback call gets exactly one slot in that list. Let's start with the full memory picture — where these hook states actually live in the fiber.</p>
            <div class="fiber-diagram">

                <div class="fiber-node root">&lt;Dashboard /&gt;<small>stateNode → DOM · memoizedState ↓</small></div>
              </div>
              <div class="fiber-link">memoizedState → linked list of hooks</div>
              <div class="fiber-level">
                <div class="fiber-node">Hook 0 — useState<small>memoizedState: 0 · queue: UpdateQueue</small></div>
                <span class="fiber-sib">next →</span>
                <div class="fiber-node">Hook 1 — useMemo<small>[cachedValue, deps]</small></div>
                <span class="fiber-sib">next →</span>
                <div class="fiber-node">Hook 2 — useCallback<small>[cachedFn, deps]</small></div>
                <span class="fiber-sib">next →</span>
                <div class="fiber-node">Hook 3 — useEffect<small>{ create, deps, destroy, tag } · next: null</small></div>
              </div>

                  <li><span class="ff-key">2</span> Compares each dep with Object.is()</li>
