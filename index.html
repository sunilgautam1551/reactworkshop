            <p>React 18's concurrent features and streaming SSR significantly improved this — but full-page hydration remains a cost.</p>

            <h2>React Server Components (RSC) — The Paradigm Shift</h2>
            <p>RSC is the most significant change to the React component model since hooks. Server Components run exclusively on the server — they never execute in the browser, never hydrate, and add zero JavaScript to the client bundle.</p>
            <p>This is not SSR. SSR renders the same components on the server for initial HTML, then re-renders them on the client for hydration. RSC renders components only on the server — those components literally do not exist in the browser.</p>
            <h3>The fundamental boundary</h3>
            ${code(
              "txt",
              `Server Components:                    Client Components:
- Run on server only                  - Run in browser (and also server for SSR)
- Can be async functions              - Must be regular React components
- Can access databases directly       - Can use useState, useEffect, hooks
- Can use server-only secrets         - Can handle user interactions
- Zero client bundle cost             - Add JS to bundle
- Cannot use hooks                    - Cannot be async at root level
- Cannot use browser APIs             - Can use browser APIs
- Cannot handle interactivity         - Handle all interactivity`,
            )}
            <p>The 'use client' directive marks the boundary:</p>
            ${code(
              "jsx",
              `// app/page.tsx — Server Component by default (no directive needed)
async function ProductPage({ params }) {
  // This runs on the server — direct DB access, no API round-trip
  const product = await db.products.findUnique({
    where: { slug: params.slug },
    include: { reviews: { take: 10 }, category: true },
  });

  if (!product) notFound();

  return (
    <main>
      {/* Server Component — renders to HTML, no JS bundle cost */}
      <ProductHeader product={product} />
      <ProductImages images={product.images} />
      <ProductDescription content={product.description} />

      {/* Client Component — needs interactivity */}
      <AddToCartButton productId={product.id} price={product.price} />

      {/* Server Component — pure data display */}
      <ReviewList reviews={product.reviews} />
    </main>
  );
}

// components/ProductHeader.tsx — Server Component (default)
function ProductHeader({ product }) {
  return (
    <header>
      <h1>{product.name}</h1>
      <p>{product.category.name}</p>
      <ProductBadges badges={product.badges} />
    </header>
  );

}

// components/AddToCartButton.tsx — Client Component
'use client';

import { useState } from 'react';

function AddToCartButton({ productId, price }) {
  const [loading, setLoading] = useState(false);

  const addToCart = async () => {
    setLoading(true);
    await cartApi.addItem(productId);
    setLoading(false);
  };

  return (
    <button onClick={addToCart} disabled={loading}>
      {loading ? 'Adding...' : \`Add to cart — $\${price}\`}

            <h3>The RSC data flow — critical rules</h3>
            <p>Understanding exactly what can and cannot cross the server/client boundary is essential:</p>
            ${code(
              "jsx",
              `// ❌ CANNOT: pass non-serializable values from Server to Client Component
function ServerComponent() {
  const fn = () => console.log('hello'); // function — not serializable
  const date = new Date();               // Date object — not serializable

  return <ClientComponent onAction={fn} date={date} />; // ERROR
}

// ✅ CORRECT: only serializable data crosses the boundary
function ServerComponent() {
  return (
    <ClientComponent
      label="Click me"          // string ✓
      count={42}                // number ✓
      isActive={true}           // boolean ✓
      tags={['a', 'b']}         // array of primitives ✓
      timestamp={Date.now()}    // number (not Date object) ✓
    />
  );
}

// ✅ ALSO CORRECT: Server Components can be children of Client Components
// The children prop carries RSC-rendered HTML, not a live component
'use client';
function ClientLayout({ children }) {
  const [isOpen, setIsOpen] = useState(false);
  return (
    <div>
      <button onClick={() => setIsOpen(o => !o)}>Toggle</button>
      {isOpen && children} {/* children is pre-rendered server HTML */}
    </div>
  );
}

// Usage — Server Component is passed as children to Client Component
function Page() {
  return (
    <ClientLayout>
      <ServerDataDisplay /> {/* Server Component — works as children */}
    </ClientLayout>
  );
}`,

            <h3>Server Actions — mutations from Client Components</h3>
            <p>Server Actions are async functions that run on the server, called from Client Components. They replace the need for API route handlers for most mutation operations:</p>
            ${code(
              "jsx",
              `// actions/cart.ts — Server Actions
'use server';

import { db } from '@/lib/db';
import { revalidatePath } from 'next/cache';
import { cookies } from 'next/headers';

export async function addToCart(productId: string) {
  // Runs on server — can access DB directly
  const sessionId = cookies().get('session')?.value;

  if (!sessionId) throw new Error('Not authenticated');

  await db.cartItems.create({
    data: { sessionId, productId, quantity: 1 },
  });

  // Revalidate the cart page
  revalidatePath('/cart');
}

export async function removeFromCart(itemId: string) {
  await db.cartItems.delete({ where: { id: itemId } });
  revalidatePath('/cart');
}

// Client Component — calls Server Action directly
'use client';

import { addToCart } from '@/actions/cart';
import { useTransition } from 'react';

function AddToCartButton({ productId }) {
  const [isPending, startTransition] = useTransition();

  return (
    <button
      onClick={() => startTransition(() => addToCart(productId))}
      disabled={isPending}
    >
      {isPending ? 'Adding...' : 'Add to cart'}
    </button>
  );
}

// Or with useActionState (React 19 — Chapter 8)
function AddToCartForm({ productId }) {
  const [error, submitAction, isPending] = useActionState(
    async (prev, formData) => {
      try {
        await addToCart(formData.get('productId'));
        return null;
      } catch (err) {
        return err.message;
      }
    },
    null
  );

  return (
    <form action={submitAction}>
      <input type="hidden" name="productId" value={productId} />
      <button type="submit" disabled={isPending}>Add to cart</button>
      {error && <p>{error}</p>}
    </form>
  );
}`,
            )}

            <h2>Streaming — Progressive HTML Delivery</h2>
            <p>Streaming sends HTML to the browser in chunks as it becomes ready, rather than waiting for everything to be complete. The browser can start rendering the first chunk while the server is still generating the rest.</p>
            <p>This fundamentally changes the performance model. Instead of "wait for all data, then send all HTML," streaming allows "send header and critical HTML immediately, stream slower sections as they complete."</p>
            ${code(
              "jsx",
              `// app/page.tsx — streaming with Suspense boundaries

import { Suspense } from 'react';

async function Page() {
  return (
    <html>
      <body>
        {/* Sent immediately — no data needed */}
        <Header />
        <nav>...</nav>

        {/* Sent immediately with skeleton */}
        <Suspense fallback={<HeroSkeleton />}>
          <HeroSection />  {/* needs fast data — sends quickly */}
        </Suspense>

        {/* Skeleton shown while slow data loads */}
        <Suspense fallback={<ProductGridSkeleton />}>
          <FeaturedProducts /> {/* needs slower data — streams in later */}
        </Suspense>

        {/* Skeleton shown while slowest data loads */}
        <Suspense fallback={<ReviewsSkeleton />}>
          <RecentReviews />   {/* needs slowest data — streams in last */}
        </Suspense>

        <Footer />
      </body>
    </html>
  );
}

// Each async Server Component resolves independently
async function FeaturedProducts() {
  // This awaits its own data — doesn't block other sections
  const products = await db.products.findMany({
    where: { featured: true },
    take: 8,
  });
  return <ProductGrid products={products} />;
}

async function RecentReviews() {
  const reviews = await db.reviews.findMany({
    orderBy: { createdAt: 'desc' },
    take: 5,
    include: { user: true, product: true },
  });
  return <ReviewList reviews={reviews} />;
}`,
            )}

export const dynamic = 'force-static'; // explicitly opt-in to SSG

async function AboutPage() {
  const content = await fetch('https://cms.example.com/about', {
    cache: 'force-cache',
  }).then(r => r.json());
  return <About content={content} />;
}

// Revalidated data — ISR
async function ProductsPage() {
  const products = await fetch('https://api.example.com/products', {
    next: { revalidate: 60 }, // revalidate every 60 seconds
  }).then(r => r.json());
  return <ProductGrid products={products} />;
}

// Per-request data — SSR
import { cookies } from 'next/headers';

async function DashboardPage() {
  const session = cookies().get('session'); // reading cookies opts into SSR
  const data = await fetch('https://api.example.com/dashboard', {
    headers: { Cookie: \`session=\${session?.value}\` },
    cache: 'no-store',
  }).then(r => r.json());
  return <Dashboard data={data} />;
}

// Parallel data fetching — avoid sequential waterfalls
async function ProductPage({ params }) {
  // Fetch in parallel — both start immediately
  const [product, reviews] = await Promise.all([
    fetch(\`/api/products/\${params.id}\`).then(r => r.json()),
    fetch(\`/api/reviews?productId=\${params.id}\`).then(r => r.json()),
  ]);

  return (
    <>
      <ProductView product={product} />
      <ReviewList reviews={reviews} />
    </>
  );
}`,
            )}
            <h3>The waterfall problem — streaming vs parallel</h3>
            <p>A sequential data fetching pattern creates a waterfall — each request waits for the previous one to complete. This is the primary performance anti-pattern to avoid:</p>
            ${code(
              "jsx",
              `// ❌ WATERFALL — sequential requests, each waits for previous
async function Page({ params }) {
  const product = await fetchProduct(params.id);       // 100ms
  const seller  = await fetchSeller(product.sellerId); // 200ms — waits for product
  const reviews = await fetchReviews(params.id);       // 150ms — waits for seller
  // Total: 450ms sequential

  return <ProductPage product={product} seller={seller} reviews={reviews} />;
}

// ✅ PARALLEL — independent requests run simultaneously
async function Page({ params }) {
  // All three start at the same time
  const [product, reviews] = await Promise.all([
    fetchProduct(params.id),     // 100ms
    fetchReviews(params.id),     // 150ms (runs in parallel)
  ]);
  const seller = await fetchSeller(product.sellerId); // 200ms — depends on product.sellerId
  // Total: max(100ms, 150ms) + 200ms = 350ms

  return <ProductPage product={product} seller={seller} reviews={reviews} />;
}

// ✅ STREAMING — independent sections stream as ready
async function Page({ params }) {
  return (
    <>
      <Suspense fallback={<ProductSkeleton />}>
        <ProductSection id={params.id} />
      </Suspense>
      <Suspense fallback={<ReviewsSkeleton />}>
        <ReviewsSection id={params.id} />  {/* streams independently */}
      </Suspense>
    </>
  );
  // Total perceived: header visible in ~0ms, product at ~100ms, reviews at ~150ms
  // User sees content progressively — not a single 450ms wait
}`,
            )}

            <h2>Code Splitting — Reducing the Initial Bundle</h2>
            <p>Every byte of JavaScript in your initial bundle is JavaScript that must be downloaded, parsed, and executed before your app becomes interactive. Code splitting breaks the bundle into smaller chunks loaded on demand.</p>

const AdminPanel = lazy(() => import('./AdminPanel'));
// The import() creates a separate chunk at build time
// The chunk downloads only when AdminPanel is about to render

function App() {
  const { isAdmin } = useAuth();

  return (
    <Suspense fallback={<AdminSkeleton />}>
      {isAdmin && <AdminPanel />}
    </Suspense>
  );
}

// Route-based splitting — the most impactful application
const Dashboard = lazy(() => import('./pages/Dashboard'));
const Settings  = lazy(() => import('./pages/Settings'));
const Reports   = lazy(() => import('./pages/Reports'));

function Router() {
  return (
    <Suspense fallback={<PageLoader />}>
      <Routes>

        <Route path="/settings"  element={<Settings />} />

            <h2>Virtualization — Rendering Only What's Visible</h2>
            <p>Rendering a list of 10,000 items creates 10,000 DOM nodes. Even if most are off-screen, they all exist in the DOM and participate in layout. Virtualization renders only the visible items plus a small buffer — dramatically reducing DOM size and render time.</p>
            ${code(
              "jsx",
              `import { useVirtualizer } from '@tanstack/react-virtual';
import { useRef } from 'react';

function VirtualizedList({ items }) {
  const parentRef = useRef(null);

  const rowVirtualizer = useVirtualizer({
    count: items.length,
    getScrollElement: () => parentRef.current,
    estimateSize: () => 60,    // estimated row height in px
    overscan: 10,              // render 10 extra rows above/below viewport
  });

  return (
    // Container with fixed height and scroll
    <div
      ref={parentRef}
      style={{ height: '600px', overflow: 'auto' }}
    >
      {/* Total height spacer — creates correct scrollbar size */}
      <div
        style={{ height: rowVirtualizer.getTotalSize(), position: 'relative' }}
      >
        {/* Only render virtual items — typically 15-25 rows, not 10,000 */}
        {rowVirtualizer.getVirtualItems().map(virtualRow => (
          <div
            key={virtualRow.index}
            style={{
              position: 'absolute',
              top: 0,
              left: 0,
              width: '100%',
              height: virtualRow.size,
              transform: \`translateY(\${virtualRow.start}px)\`,
            }}
          >
            <ListItem item={items[virtualRow.index]} />
          </div>
        ))}
      </div>
    </div>
  );
}

// Variable height items — measure each row's actual height
const rowVirtualizer = useVirtualizer({
  count: items.length,
  getScrollElement: () => parentRef.current,
  estimateSize: (index) => items[index].expanded ? 120 : 60,
  measureElement: (element) => element.getBoundingClientRect().height,
});`,

            <p>When to virtualize: lists with more than 100-200 items where rendering all causes visible jank. For smaller lists, the virtualization overhead (position:absolute layout, scroll event listening) may exceed the benefit.</p>

            <h2>The React Compiler — Automatic Memoization</h2>
            <p>The React Compiler (stable in React 19) analyzes your component code at build time and automatically inserts useMemo, useCallback, and React.memo where they would be beneficial — using escape analysis to determine which values actually need to be stable.</p>
            <h3>Setting it up</h3>
            ${code(
              "bash",
              `# Install
npm install babel-plugin-react-compiler

# babel.config.js
module.exports = {
  plugins: [
    ['babel-plugin-react-compiler', {
      target: '18', // or '19'
    }],
  ],
};

# Next.js — built-in support
# next.config.js
module.exports = {
  experimental: {
    reactCompiler: true,
  },
};`,
            )}
            <h3>What the compiler does</h3>
            ${code(
              "jsx",
              `// You write:
function ProductList({ products, onSelect }) {
  const sorted = products
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name));

  const handleSelect = (id) => {
    onSelect(id);
    analytics.track('product_selected', { id });
  };

  return sorted.map(p => (
    <ProductCard key={p.id} product={p} onSelect={handleSelect} />
  ));
}

// The compiler generates (conceptually):
function ProductList({ products, onSelect }) {
  // Compiler knows \`sorted\` escapes into JSX — needs stability
  const sorted = useMemo(
    () => products.slice().sort((a, b) => a.name.localeCompare(b.name)),
    [products]
  );

  // Compiler knows \`handleSelect\` is passed to a component — needs stability
  const handleSelect = useCallback(
    (id) => { onSelect(id); analytics.track('product_selected', { id }); },
    [onSelect]
  );

  // Compiler wraps ProductCard — it receives stable props
  return sorted.map(p => <ProductCard key={p.id} product={p} onSelect={handleSelect} />);
}`,
            )}

function App() {
  const [count, setCount] = useState(0); // high in tree
  // Every component below re-renders on count change
  // Compiler memoizes individual components but the structure is wrong
  return (
    <div>
      <SlowHeavyTree /> {/* re-renders even though count is irrelevant */}
      <Counter count={count} />
    </div>
  );
}

// ✅ Right structure — state colocated, heavy tree unaffected
function App() {
  return (
    <div>
      <SlowHeavyTree />    {/* never re-renders due to counter */}
      <CounterContainer /> {/* owns its own state */}
    </div>
  );
}

// ❌ N+1 render pattern — renders trigger more renders
function Parent() {
  const [data, setData] = useState([]);

  // Child calls setData on mount -> parent re-renders -> child re-mounts -> repeat
  return <Child onMount={(d) => setData(d)} />;
  // Compiler cannot fix circular update patterns
}`,
            )}

function DataView({ records, filters }) {
  // Runs on EVERY render — even when neither records nor filters changed
  const processed = records
    .filter(r => matchesAllFilters(r, filters))
    .sort(complexComparator)
    .map(transformRecord);

  return <Table rows={processed} />;
}

// Fix 1: useMemo — only recompute when inputs change
function DataView({ records, filters }) {
  const processed = useMemo(
    () => records
      .filter(r => matchesAllFilters(r, filters))
      .sort(complexComparator)
      .map(transformRecord),
    [records, filters] // recompute only when these change
  );

  return <Table rows={processed} />;
}

// Fix 2: For extremely heavy computation — Web Worker
function useWorkerSort(data) {
  const [sorted, setSorted] = useState([]);

  useEffect(() => {
    const worker = new Worker('/sort-worker.js');
    worker.postMessage(data);
    worker.onmessage = (e) => setSorted(e.data);
    return () => worker.terminate();
  }, [data]);

  return sorted;
}

// Fix 3: useTransition — mark expensive update as non-urgent
const [isPending, startTransition] = useTransition();

const handleFilterChange = (newFilters) => {
  setFilters(newFilters); // urgent — update filter UI immediately
  startTransition(() => {
    setProcessed(heavyProcess(records, newFilters)); // non-urgent — can be interrupted
  });
};`,

            <h2>The Testing Philosophy That Actually Works</h2>
            <p>Most React testing advice produces either too little confidence or too much maintenance burden. The wrong approach is either "test everything at the unit level, mock every dependency" or "only write E2E tests, nothing else." Both extremes fail in practice.</p>
            <p>The right philosophy is captured in one sentence from Kent C. Dodds, author of React Testing Library:</p>

            <h2>userEvent vs fireEvent — Why the Distinction Matters</h2>
            <p>userEvent simulates real browser behavior: keydown → keypress → keyup sequences, focus and blur events, pointer events. fireEvent dispatches a single synthetic event. For most tests, userEvent is the right choice:</p>
            ${code(
              "jsx",
              `// fireEvent — dispatches one synthetic event
// Doesn't trigger: focus, keydown/keypress/keyup sequence, input events
fireEvent.click(button);

// userEvent — simulates full user interaction chain
// Triggers: pointerdown, mousedown, focus, pointerup, mouseup, click
await user.click(button);

// The difference matters for:
// - Keyboard navigation tests
// - Focus-dependent UI (tooltips on focus, validation on blur)
// - Complex input handling (masked inputs, autocomplete)

// Typing example — userEvent fires all keyboard events
await user.type(input, 'hello');
// Fires: focus, keydown(h), keypress(h), input, keyup(h),
//        keydown(e), keypress(e), input, keyup(e), ...

// fireEvent.change — just one event, no keyboard events
fireEvent.change(input, { target: { value: 'hello' } });
// Only fires: change
// Skips: keydown, keypress, keyup, input
// Breaks: components that listen to keydown for shortcuts`,
            )}
            <p>Use userEvent for all user interactions. Reserve fireEvent for testing event handlers directly in edge cases where the interaction sequence doesn't matter.</p>

            <h2>MSW — Network Mocking at the Right Layer</h2>
            <p>Mock Service Worker intercepts requests at the network layer — not by mocking fetch or axios in your module. This means your component's actual fetch code runs, with real request construction, real error handling, and real response parsing. The mock operates exactly where the real server would.</p>
            <h3>Setup</h3>
            ${code(
              "js",
              `// src/test/mocks/handlers.ts
import { http, HttpResponse } from 'msw';

export const handlers = [
  // GET /api/users — success
  http.get('/api/users', () => {
    return HttpResponse.json([
      { id: 1, name: 'Alice', email: 'alice@example.com' },
      { id: 2, name: 'Bob',   email: 'bob@example.com' },
    ]);
  }),

  // GET /api/users/:id — dynamic route
  http.get('/api/users/:id', ({ params }) => {
    const { id } = params;
    return HttpResponse.json({ id, name: \`User \${id}\` });
  }),

  // POST /api/users — mutation
  http.post('/api/users', async ({ request }) => {
    const body = await request.json();
    return HttpResponse.json(
      { id: 3, ...body },
      { status: 201 }
    );
  }),
];

// src/test/mocks/server.ts
import { setupServer } from 'msw/node';
import { handlers } from './handlers';

export const server = setupServer(...handlers);

// src/test/setup.ts
import { server } from './mocks/server';

// Start before all tests
beforeAll(() => server.listen({ onUnhandledRequest: 'error' }));
// Reset handlers between tests (don't let one test's override bleed into another)
afterEach(() => server.resetHandlers());
// Clean up after all tests
afterAll(() => server.close());`,

    server.use(
      http.get('/api/users', () => {
        return HttpResponse.json(
          { message: 'Server error' },
          { status: 500 }
        );
      })
    );
    // handler.resetHandlers() in afterEach restores the default handler

    render(<UserList />);

    expect(
      await screen.findByRole('alert')
    ).toHaveTextContent(/failed to load users/i);
  });

  // Network error
  it('handles network failures gracefully', async () => {
    server.use(
      http.get('/api/users', () => {
        return HttpResponse.error(); // simulates network failure
      })
    );

    render(<UserList />);

    expect(
      await screen.findByText(/something went wrong/i)
    ).toBeInTheDocument();
  });
});`,
            )}

            <h2>Wrapping Components That Need Providers</h2>
            <p>Components that use context, routing, or React Query need their providers in tests. The clean approach is a custom render function:</p>
            ${code(
              "jsx",
              `// src/test/utils.tsx
import { render, type RenderOptions } from '@testing-library/react';
import { QueryClient, QueryClientProvider } from '@tanstack/react-query';
import { MemoryRouter } from 'react-router-dom';
import { ReactNode } from 'react';

// Create a fresh QueryClient per test to prevent cache bleeding
function makeQueryClient() {
  return new QueryClient({
    defaultOptions: {
      queries: { retry: false }, // don't retry in tests
      mutations: { retry: false },
    },
  });
}

interface CustomRenderOptions extends Omit<RenderOptions, 'wrapper'> {
  initialRoute?: string;
}

function AllProviders({ children }: { children: ReactNode }) {
  const queryClient = makeQueryClient();
  return (
    <QueryClientProvider client={queryClient}>
      <MemoryRouter>
        {children}
      </MemoryRouter>
    </QueryClientProvider>
  );
}

// Custom render — drop-in replacement for @testing-library/react's render
function customRender(
  ui: React.ReactElement,
  options?: CustomRenderOptions
) {
  return render(ui, { wrapper: AllProviders, ...options });
}

// Re-export everything from RTL — tests import from this file, not RTL directly
export * from '@testing-library/react';
export { customRender as render };

// Usage in tests
import { render, screen } from '../test/utils'; // custom render
// Everything else works identically`,
            )}

            <h2>Testing Custom Hooks — renderHook</h2>
            <p>Custom hooks contain logic that deserves isolated testing. renderHook renders a hook inside a minimal component wrapper, giving you direct access to its return values:</p>
            ${code(
              "jsx",
              `import { renderHook, act, waitFor } from '@testing-library/react';
import { useCounter } from './useCounter';
import { useDebounce } from './useDebounce';

describe('useCounter', () => {
  it('starts at the initial value', () => {
    const { result } = renderHook(() => useCounter(5));
    expect(result.current.count).toBe(5);
  });

  it('increments when increment is called', () => {
    const { result } = renderHook(() => useCounter(0));

    // act() ensures React processes all state updates before you assert
    act(() => {
      result.current.increment();
    });

    expect(result.current.count).toBe(1);
  });

  it('does not go below zero', () => {
    const { result } = renderHook(() => useCounter(0));

    act(() => {
      result.current.decrement();
    });

    expect(result.current.count).toBe(0);
  });
});

describe('useDebounce', () => {
  beforeEach(() => vi.useFakeTimers());
  afterEach(() => vi.useRealTimers());

  it('returns initial value immediately', () => {
    const { result } = renderHook(() => useDebounce('hello', 500));
    expect(result.current).toBe('hello');
  });

  it('does not update before delay elapses', () => {
    const { result, rerender } = renderHook(
      ({ value }) => useDebounce(value, 500),
      { initialProps: { value: 'hello' } }
    );

    rerender({ value: 'world' });
    act(() => vi.advanceTimersByTime(300));

    expect(result.current).toBe('hello'); // not yet
  });

  it('updates after the full delay', () => {
    const { result, rerender } = renderHook(
      ({ value }) => useDebounce(value, 500),
      { initialProps: { value: 'hello' } }
    );

    rerender({ value: 'world' });
    act(() => vi.advanceTimersByTime(500));

    expect(result.current).toBe('world');
  });

  it('resets the timer on rapid changes', () => {
    const { result, rerender } = renderHook(
      ({ value }) => useDebounce(value, 500),
      { initialProps: { value: 'a' } }
    );

    rerender({ value: 'ab' });
    act(() => vi.advanceTimersByTime(300));
    rerender({ value: 'abc' }); // resets the timer

    act(() => vi.advanceTimersByTime(300)); // only 300ms from last change
    expect(result.current).toBe('a'); // still original

    act(() => vi.advanceTimersByTime(200)); // now 500ms from 'abc'
    expect(result.current).toBe('abc');
  });
});`,
            )}

            <h2>What NOT to Test</h2>
            <p>Knowing what to skip is as important as knowing what to test. Testing these things creates fragile tests that break on every refactor:</p>
            ${code(
              "jsx",
              `// ❌ DON'T: Test CSS classes
expect(button).toHaveClass('btn-primary');
// Class names change during refactors — test visual behavior instead

// ❌ DON'T: Test component structure
expect(container.querySelector('div > span > p')).toBeInTheDocument();
// DOM structure changes constantly — test accessibility roles instead

// ❌ DON'T: Test implementation details
const { result } = renderHook(() => useForm());
expect(result.current.internalValidationState).toBe('valid');
// Internal state can be replaced — test what the user sees

// ❌ DON'T: Snapshot test complex component output
expect(container).toMatchSnapshot();
// Snapshots break on any markup change and developers approve them blindly

// ✅ DO: Test what users can observe
expect(screen.getByRole('button', { name: /submit/i })).toBeDisabled();
expect(screen.getByRole('alert')).toHaveTextContent(/required field/i);
expect(screen.queryByText('Error:')).not.toBeInTheDocument();

// ✅ Snapshots are fine for small, stable output (like a formatted date)
expect(formatDate(new Date('2024-01-15'))).toMatchInlineSnapshot(\`"Jan 15, 2024"\`);`,
            )}

            <h2>The Complete Testing Picture — Layers Working Together</h2>
            <p>A realistic component test covers four scenarios: initial render, successful interaction, loading states, and error states. This TodoList test demonstrates the full pattern:</p>
            ${code(
              "jsx",
              `import { render, screen, waitFor } from '../test/utils';
import userEvent from '@testing-library/user-event';
import { server } from '../test/mocks/server';
import { http, HttpResponse } from 'msw';
import { TodoList } from './TodoList';

describe('TodoList', () => {
  const user = userEvent.setup();

  describe('initial load', () => {
    it('shows a loading indicator while fetching', () => {
      render(<TodoList />);
      expect(screen.getByRole('status', { name: /loading/i }))
        .toBeInTheDocument();
    });

    it('renders todos after successful fetch', async () => {
      render(<TodoList />);

      expect(await screen.findByText('Buy groceries')).toBeInTheDocument();
      expect(await screen.findByText('Walk the dog')).toBeInTheDocument();
    });
  });

  describe('adding a todo', () => {
    it('adds a new todo when form is submitted', async () => {
      render(<TodoList />);
      await screen.findByText('Buy groceries'); // wait for initial load

      await user.type(
        screen.getByRole('textbox', { name: /new todo/i }),
        'Do laundry'
      );
      await user.click(screen.getByRole('button', { name: /add/i }));

      expect(await screen.findByText('Do laundry')).toBeInTheDocument();
    });

    it('clears the input after adding', async () => {
      render(<TodoList />);
      await screen.findByText('Buy groceries');

      const input = screen.getByRole('textbox', { name: /new todo/i });
      await user.type(input, 'New task');
      await user.click(screen.getByRole('button', { name: /add/i }));

      await waitFor(() => {
        expect(input).toHaveValue('');
      });
    });

    it('shows an error if adding fails', async () => {
      server.use(
        http.post('/api/todos', () =>
          HttpResponse.json({ message: 'Server error' }, { status: 500 })
        )
      );

      render(<TodoList />);
      await screen.findByText('Buy groceries');

      await user.type(
        screen.getByRole('textbox', { name: /new todo/i }),
        'Failing task'
      );
      await user.click(screen.getByRole('button', { name: /add/i }));

      expect(await screen.findByRole('alert'))
        .toHaveTextContent(/failed to add todo/i);
    });
  });

  describe('completing a todo', () => {
    it('marks a todo as complete when its checkbox is clicked', async () => {
      render(<TodoList />);
      const checkbox = await screen.findByRole('checkbox', {
        name: /buy groceries/i,
      });

      expect(checkbox).not.toBeChecked();
      await user.click(checkbox);
      expect(checkbox).toBeChecked();
    });
  });

  describe('error states', () => {
    it('shows an error message when initial load fails', async () => {
      server.use(
        http.get('/api/todos', () => HttpResponse.error())
      );

      render(<TodoList />);

      expect(await screen.findByRole('alert'))
        .toHaveTextContent(/failed to load/i);
    });
  });
});`,

            <h2>Why TypeScript Changes How You Think About React</h2>
            <p>Adding TypeScript to a React codebase is not just adding type annotations. Done well, TypeScript changes the architecture of your components. It forces you to make implicit contracts explicit — props that were "usually strings but sometimes numbers," state that was "either an error object or null," components that "work with any data as long as it has an id field" — all of these become precise, checked, and self-documenting.</p>
            <p>The senior level is not about knowing TypeScript syntax. It's about leveraging TypeScript to eliminate entire categories of runtime bugs through structural precision, and designing component APIs that are both safe and ergonomic.</p>

            <h2>The Foundational Types</h2>
            <p>Before generics and advanced patterns, the core types you use in every React codebase:</p>
            ${code(
              "tsx",
              `// Component props — always an interface (not type alias) for props
// Interfaces produce better error messages and support declaration merging
interface ButtonProps {
  label: string;
  onClick: () => void;
  disabled?: boolean;         // optional prop
  variant?: 'primary' | 'ghost' | 'danger'; // literal union
}

// Function components — React.FC is discouraged; annotate return type directly
function Button({ label, onClick, disabled = false, variant = 'primary' }: ButtonProps) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      className={\`btn btn--\${variant}\`}
    >
      {label}
    </button>
  );
}

// Children — multiple correct ways depending on what children must be
interface LayoutProps {
  children: React.ReactNode;           // anything React can render — most permissive
  // children: React.ReactElement;     // must be a React element (not string/number)
  // children: React.ReactElement[];   // must be array of elements
  // children?: React.ReactNode;       // optional children
}

// Event handlers — always use React's event types, not native DOM types
interface InputProps {
  onChange: (event: React.ChangeEvent<HTMLInputElement>) => void;
  onKeyDown?: (event: React.KeyboardEvent<HTMLInputElement>) => void;
  onFocus?: React.FocusEventHandler<HTMLInputElement>; // alias form
}

// Refs — generic parameter matches the DOM element type
const inputRef = useRef<HTMLInputElement>(null);
const divRef   = useRef<HTMLDivElement>(null);
const btnRef   = useRef<HTMLButtonElement>(null);`,

            ${code(

function processData(data: any) {
  return data.items.map((item: any) => item.value);
  // No checking. Crashes at runtime if data.items doesn't exist.
}

// ❌ Type assertion instead of type narrowing
const element = document.getElementById('app') as HTMLDivElement;
// If the element is actually an HTMLSpanElement, you've lied to TypeScript
// and will get a runtime error

// ❌ Using \`object\` or \`{}\` as a type
function merge(a: object, b: object) { /* ... */ }
// TypeScript can't tell you anything useful about the shape of these

const MyComponent: React.FC<Props> = ({ name }) => <div>{name}</div>;
// React.FC adds implicit children prop (misleading in React 18+)
// and provides no meaningful benefit over plain function annotation

// ❌ Ignoring TypeScript errors with @ts-ignore

const result = badFunction(incorrectArgs);

            <h2>Generic Components — Reusable with Type Safety</h2>
            <p>Generic components are the most powerful TypeScript pattern in React. They let a single component work across different data types while maintaining full type safety — no any, no casting, full inference.</p>
            <h3>The basic generic component</h3>
            ${code(
              "tsx",
              `// A list that renders any type of item
// Without generics: items: any[] — no safety
// With generics: items: T[] — safe, inferrable

interface ListProps<T> {
  items: T[];
  keyExtractor: (item: T) => string;
  renderItem: (item: T) => React.ReactNode;
  emptyState?: React.ReactNode;
}

function List<T>({
  items,
  keyExtractor,
  renderItem,
  emptyState = <p>No items</p>,
}: ListProps<T>) {
  if (items.length === 0) return <>{emptyState}</>;

  return (
    <ul>
      {items.map(item => (
        <li key={keyExtractor(item)}>
          {renderItem(item)}
        </li>
      ))}
    </ul>
  );
}

// Usage — TypeScript infers T from the \`items\` prop
// T is inferred as { id: string; name: string; email: string }
<List
  items={users}
  keyExtractor={user => user.id}
  renderItem={user => <UserCard user={user} />}
/>
// user inside renderItem is fully typed — autocomplete works

// T is inferred as { id: number; title: string; status: 'open' | 'closed' }
<List
  items={tickets}
  keyExtractor={ticket => String(ticket.id)}
  renderItem={ticket => <TicketRow ticket={ticket} />}
/>`,
            )}
            <h3>The constraint pattern — T must satisfy a shape</h3>
            ${code(
              "tsx",
              `// Constrain T to have certain required properties
interface SelectProps<T extends { id: string; label: string }> {
  options: T[];
  value: T | null;
  onChange: (option: T) => void;
  renderOption?: (option: T) => React.ReactNode;
}

function Select<T extends { id: string; label: string }>({
  options,
  value,
  onChange,
  renderOption,
}: SelectProps<T>) {
  return (
    <select
      value={value?.id ?? ''}
      onChange={e => {
        const selected = options.find(o => o.id === e.target.value);
        if (selected) onChange(selected);
      }}
    >
      {options.map(option => (
        <option key={option.id} value={option.id}>
          {renderOption ? renderOption(option) : option.label}
        </option>
      ))}
    </select>
  );
}

// Works with any object that has id and label
type Country = { id: string; label: string; flag: string; code: string };

<Select<Country>
  options={countries}
  value={selectedCountry}
  onChange={setSelectedCountry}
  renderOption={c => \`\${c.flag} \${c.label}\`}
/>
// Inside renderOption, c has full Country type — flag and code are accessible`,
            )}
            <h3>Generic with default type parameter (TypeScript 4.9+)</h3>
            ${code(
              "tsx",
              `// Default type parameter when T can't be inferred
function useLocalStorage<T = string>(key: string, initialValue: T) {
  const [value, setValue] = useState<T>(() => {
    const stored = localStorage.getItem(key);
    return stored ? JSON.parse(stored) : initialValue;
  });

  const setAndStore = (newValue: T) => {
    setValue(newValue);
    localStorage.setItem(key, JSON.stringify(newValue));
  };

  return [value, setAndStore] as const;
}

// Explicit type when you need it
const [theme, setTheme] = useLocalStorage<'light' | 'dark'>('theme', 'light');
// Inferred when possible
const [name, setName] = useLocalStorage('name', ''); // T inferred as string`,
            )}

            <h2>Discriminated Unions — The Most Powerful Pattern</h2>
            <p>Discriminated unions model state as precisely as the business domain requires. They eliminate the "impossible states" category of bugs by making invalid state combinations structurally unrepresentable.</p>
            <h3>The problem without discriminated unions</h3>
            ${code(
              "tsx",
              `// ❌ This type allows invalid combinations
interface QueryState {
  isLoading: boolean;
  data: User[] | null;
  error: string | null;
}

// Possible but semantically wrong:
// { isLoading: true, data: [...], error: "something" }
// — can't be loading AND have data AND have an error simultaneously

// TypeScript can't help you here:

            <h3>Compound components — typed with context</h3>

interface TabsContextValue {
  activeTab: string;
  setActiveTab: (id: string) => void;
}

const TabsContext = createContext<TabsContextValue | null>(null);

function useTabsContext(): TabsContextValue {
  const ctx = useContext(TabsContext);
  if (!ctx) throw new Error('Tab components must be used within <Tabs>');
  return ctx;
}

interface TabsProps {
  children: React.ReactNode;
  defaultTab: string;
  onChange?: (tab: string) => void;
}

function Tabs({ children, defaultTab, onChange }: TabsProps) {
  const [activeTab, setActiveTab] = useState(defaultTab);

  const handleTabChange = useCallback((id: string) => {
    setActiveTab(id);
    onChange?.(id);
  }, [onChange]);

  return (
    <TabsContext.Provider value={{ activeTab, setActiveTab: handleTabChange }}>
      {children}
    </TabsContext.Provider>
  );
}

interface TabProps {
  id: string;
  children: React.ReactNode;
  disabled?: boolean;
}

function Tab({ id, children, disabled = false }: TabProps) {
  const { activeTab, setActiveTab } = useTabsContext();
  return (
    <button
      role="tab"
      aria-selected={activeTab === id}
      disabled={disabled}
      onClick={() => !disabled && setActiveTab(id)}
    >
      {children}
    </button>
  );
}

interface TabPanelProps {
  id: string;
  children: React.ReactNode;
}

function TabPanel({ id, children }: TabPanelProps) {
  const { activeTab } = useTabsContext();
  return activeTab === id ? <div role="tabpanel">{children}</div> : null;
}

// Attach sub-components with types preserved
Tabs.Tab   = Tab;
Tabs.Panel = TabPanel;

type AsProp<C extends React.ElementType> = {
  as?: C;
};

type PropsToOmit<C extends React.ElementType, P> =
  keyof (AsProp<C> & P);

type PolymorphicComponentProp<
  C extends React.ElementType,
  Props = {}
> = React.PropsWithChildren<Props & AsProp<C>> &
  Omit<React.ComponentPropsWithoutRef<C>, PropsToOmit<C, Props>>;

// With ref support
type PolymorphicRef<C extends React.ElementType> =
  React.ComponentPropsWithRef<C>['ref'];

type PolymorphicComponentPropWithRef<
  C extends React.ElementType,
  Props = {}
> = PolymorphicComponentProp<C, Props> & { ref?: PolymorphicRef<C> };

// The component
interface ButtonOwnProps {
  variant?: 'primary' | 'ghost' | 'danger';
  size?: 'sm' | 'md' | 'lg';
}

type ButtonProps<C extends React.ElementType = 'button'> =
  PolymorphicComponentPropWithRef<C, ButtonOwnProps>;

type ButtonComponent = <C extends React.ElementType = 'button'>(
  props: ButtonProps<C>
) => React.ReactElement | null;

const Button: ButtonComponent = React.forwardRef(
  <C extends React.ElementType = 'button'>(
    { as, variant = 'primary', size = 'md', children, ...rest }: ButtonProps<C>,
    ref?: PolymorphicRef<C>
  ) => {
    const Component = as ?? 'button';
    return (
      <Component
        ref={ref}
        className={\`btn btn--\${variant} btn--\${size}\`}
        {...rest}
      >
        {children}
      </Component>
    );
  }
);

// TypeScript infers and validates props for each \`as\` value
<Button>Submit</Button>
// href not valid — it's a button

<Button as="a" href="/home">Go home</Button>
// href is valid — TypeScript knows anchor props
// onClick is also valid — both button and anchor support it

<Button as={Link} to="/profile">Profile</Button>
// to is valid — TypeScript knows React Router Link props
// href would be an error — Link doesn't accept href`,

            <h2>Typing Hooks — The Patterns That Matter</h2>
            <h3>useReducer with discriminated actions</h3>
            ${code(
              "tsx",
              `// Typed reducer with full action discrimination
type CartItem = {
  id: string;
  name: string;
  price: number;
  quantity: number;
};

type CartState = {
  items: CartItem[];
  couponCode: string | null;
};

// Discriminated union for actions — each action carries only what it needs
type CartAction =
  | { type: 'item/add'; item: Omit<CartItem, 'quantity'> }
  | { type: 'item/remove'; id: string }
  | { type: 'item/updateQuantity'; id: string; quantity: number }
  | { type: 'coupon/apply'; code: string }
  | { type: 'coupon/remove' }
  | { type: 'cart/clear' };

function cartReducer(state: CartState, action: CartAction): CartState {
  switch (action.type) {
    case 'item/add': {
      // action.item is typed as Omit<CartItem, 'quantity'> — TypeScript enforced
      const existing = state.items.find(i => i.id === action.item.id);
      if (existing) {
        return {
          ...state,
          items: state.items.map(i =>
            i.id === action.item.id
              ? { ...i, quantity: i.quantity + 1 }
              : i
          ),
        };
      }
      return {
        ...state,
        items: [...state.items, { ...action.item, quantity: 1 }],
      };
    }

    case 'item/updateQuantity':
      // action.quantity is number, action.id is string — TypeScript enforced
      if (action.quantity <= 0) {
        return {
          ...state,
          items: state.items.filter(i => i.id !== action.id),
        };
      }
      return {
        ...state,
        items: state.items.map(i =>
          i.id === action.id ? { ...i, quantity: action.quantity } : i
        ),
      };

    case 'coupon/apply':
      return { ...state, couponCode: action.code };

    case 'coupon/remove':
      return { ...state, couponCode: null };

    case 'cart/clear':
      return { items: [], couponCode: null };

    case 'item/remove':
      return {
        ...state,
        items: state.items.filter(i => i.id !== action.id),
      };
  }
}`,

            <h3>Return type narrowing in custom hooks</h3>
            ${code(
              "tsx",
              `// Hook that returns different types based on state
// Without proper typing, consumers need runtime checks everywhere

type UseFetchResult<T> =
  | { status: 'loading'; data: undefined; error: undefined }
  | { status: 'error';   data: undefined; error: Error }
  | { status: 'success'; data: T;         error: undefined };

function useFetch<T>(url: string): UseFetchResult<T> {
  const [state, setState] = useState<UseFetchResult<T>>({
    status: 'loading',
    data: undefined,
    error: undefined,
  });

  useEffect(() => {
    let cancelled = false;

    fetch(url)
      .then(r => r.json() as Promise<T>)
      .then(data => {
        if (!cancelled) {
          setState({ status: 'success', data, error: undefined });
        }
      })
      .catch(error => {
        if (!cancelled) {
          setState({ status: 'error', data: undefined, error });
        }
      });

    return () => { cancelled = true; };
  }, [url]);

  return state;
}

// Usage — TypeScript narrows precisely in each branch
function UserList() {
  const result = useFetch<User[]>('/api/users');

  if (result.status === 'loading') {
    return <Spinner />;
    // result.data is undefined here — TypeScript knows
  }

  if (result.status === 'error') {
    return <p>{result.error.message}</p>;
    // result.error is Error — typed and non-null
  }

  // result.status is 'success' here
  return <ul>{result.data.map(u => <li key={u.id}>{u.name}</li>)}</ul>;
  // result.data is User[] — no null check needed
}`,

  id: string;
  name: string;
  email: string;
  role: 'admin' | 'editor' | 'viewer';
  createdAt: Date;
  updatedAt: Date;
}

// Partial<T> — all properties become optional
// Use for: update payloads, patch operations, form initial values
type UserUpdate = Partial<User>;
// { id?: string; name?: string; email?: string; ... }

// Required<T> — all properties become required
// Use for: normalizing data from APIs that may omit optional fields
type CompleteUser = Required<User>;

// Pick<T, K> — keep only specified keys
// Use for: API response shapes, view-model subsets
type UserPreview = Pick<User, 'id' | 'name'>;
// { id: string; name: string }

// Omit<T, K> — remove specified keys
// Use for: form payloads (omit server-generated fields)
type CreateUserPayload = Omit<User, 'id' | 'createdAt' | 'updatedAt'>;
// { name: string; email: string; role: 'admin' | 'editor' | 'viewer' }

// Record<K, V> — create a type with specific keys and value type
// Use for: dictionaries, lookup tables, normalized state
type UserById = Record<string, User>;
type RolePermissions = Record<User['role'], string[]>;

// Use for: typing values from factories, inferring from hooks
function createUser() {

type FetchParams = Parameters<typeof fetch>;

type NonNullableUser = NonNullable<User | null | undefined>;
// User

type FetchedUser = Awaited<Promise<User>>;

            <h2>Template Literal Types — Precision in String APIs</h2>
            <p>Template literal types let you express string patterns precisely — CSS classes, event names, API routes, translation keys:</p>
            ${code(

type Block = 'button' | 'card' | 'modal' | 'input';
type Element = 'header' | 'body' | 'footer' | 'title' | 'label';
type Modifier = 'primary' | 'secondary' | 'disabled' | 'loading';

type BEMClass =
  | \`\${Block}\`
  | \`\${Block}__\${Element}\`
  | \`\${Block}--\${Modifier}\`
  | \`\${Block}__\${Element}--\${Modifier}\`;

function cn(...classes: BEMClass[]): string {
  return classes.join(' ');
}

cn('button', 'button--primary');    // valid
cn('button__label', 'card__body'); // valid
cn('button', 'btn--primary');      // TypeScript error! 'btn' is not a Block

// Event naming — typed event system
type EventName = \`on\${Capitalize<string>}\`;
// Matches: 'onClick', 'onSubmit', 'onChange', 'onFocus'

// Translation keys — typed i18n
type TranslationKey =
  | \`auth.\${keyof typeof authTranslations}\`
  | \`nav.\${keyof typeof navTranslations}\`
  | \`errors.\${keyof typeof errorTranslations}\`;

function t(key: TranslationKey): string {
  // TypeScript ensures every key is a real translation key
  return translations[key];
}

t('auth.signIn');     // valid
t('nav.dashboard');   // valid

  | { success: false; error: string };

            <h2>The Complete Production Pattern — Typed API Layer</h2>
            <p>A fully typed data flow from API to component:</p>

interface ApiResponse<T> {
  data: T;
  meta: {
    total: number;
    page: number;
    perPage: number;
  };
}

interface ApiError {
  message: string;
  code: string;
  field?: string; // for validation errors
}

// types/user.ts — domain types
interface User {
  id: string;
  name: string;
  email: string;
  role: 'admin' | 'editor' | 'viewer';
  createdAt: string; // ISO 8601 from API
}

type CreateUserPayload = Pick<User, 'name' | 'email' | 'role'>;
type UpdateUserPayload = Partial<Pick<User, 'name' | 'email' | 'role'>>;

// api/users.ts — typed API client
class ApiClient {
  private baseUrl: string;

  constructor(baseUrl: string) {
    this.baseUrl = baseUrl;
  }

  private async request<T>(
    path: string,
    options?: RequestInit
  ): Promise<T> {
    const response = await fetch(\`\${this.baseUrl}\${path}\`, options);

    if (!response.ok) {
      const error: ApiError = await response.json();
      throw new Error(error.message);
    }

    return response.json() as Promise<T>;
  }

  getUsers(params?: { page?: number; role?: User['role'] }) {
    const query = new URLSearchParams(params as Record<string, string>);
    return this.request<ApiResponse<User[]>>(\`/users?\${query}\`);
  }

  getUser(id: string) {
    return this.request<User>(\`/users/\${id}\`);
  }

  createUser(payload: CreateUserPayload) {
    return this.request<User>('/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  }

  updateUser(id: string, payload: UpdateUserPayload) {
    return this.request<User>(\`/users/\${id}\`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  }

  deleteUser(id: string) {
    return this.request<void>(\`/users/\${id}\`, { method: 'DELETE' });
  }
}

export const apiClient = new ApiClient(process.env.NEXT_PUBLIC_API_URL!);

// hooks/useUsers.ts — typed React Query hooks
const userKeys = {
  all:    ['users']                           as const,
  lists:  ()           => [...userKeys.all, 'list']  as const,
  list:   (p: object)  => [...userKeys.lists(), p]   as const,
  detail: (id: string) => [...userKeys.all, id]      as const,
};

function useUsers(params?: { page?: number; role?: User['role'] }) {
  return useQuery({
    queryKey: userKeys.list(params ?? {}),
    queryFn:  () => apiClient.getUsers(params),
    select:   (response) => response.data,
    // data is typed as User[] after the select transform
  });
}

function useCreateUser() {
  const queryClient = useQueryClient();

  return useMutation({
    mutationFn: (payload: CreateUserPayload) =>
      apiClient.createUser(payload),
    onSuccess: (newUser) => {
      // newUser is typed as User — full IDE support
      queryClient.invalidateQueries({ queryKey: userKeys.lists() });
      queryClient.setQueryData(userKeys.detail(newUser.id), newUser);
    },
  });
}

  const { mutate: createUser, isPending } = useCreateUser();

          user={user}

        />

        onClick={() => createUser({ name: 'Alice', email: 'alice@example.com', role: 'editor' })}
        disabled={isPending}
      >
        Create user
      </button>
    </div>
  );
}`,

            <h2>ARIA Roles, Properties and States — Precisely</h2>
            <p>ARIA (Accessible Rich Internet Applications) has three categories:</p>
            <p>Roles define what an element is. They override or supplement the element's semantic meaning.</p>
            <p>Properties describe characteristics of an element that don't change (or rarely change). Set as attributes.</p>

<button aria-label="Close dialog">    // name when text content isn't sufficient

<ul aria-labelledby="list-heading">   // links element to its label
<div aria-live="polite">              // declares a live region

// States — dynamic conditions
<button aria-expanded={isOpen}>       // disclosure widget open/closed

<input aria-invalid={hasError}>       // form field validation state

            <h2>Focus Management — The Most Architecturally Complex Part</h2>
            <p>Focus management is the hardest accessibility problem in React applications. Unlike static HTML, React applications render content dynamically — routes change, modals open, confirmations appear. Each dynamic change requires deliberate focus management. Without it, focus lands in unpredictable or useless locations.</p>
            <h3>The Focus Trap — Implementing Modal Focus Correctly</h3>
            <p>A modal dialog must trap focus inside it while it is open. Tab and Shift+Tab must cycle through focusable elements within the modal — never escaping to content behind it. This requires managing the natural tab order of the DOM.</p>
            ${code(
              "jsx",
              `import { useEffect, useRef } from 'react';

const FOCUSABLE_SELECTORS = [
  'a[href]',
  'button:not([disabled])',
  'input:not([disabled])',
  'select:not([disabled])',
  'textarea:not([disabled])',
  '[tabindex]:not([tabindex="-1"])',
].join(', ');

function useFocusTrap(isActive) {
  const containerRef = useRef(null);

  useEffect(() => {
    if (!isActive || !containerRef.current) return;

    const container = containerRef.current;

    // Save element that opened the modal — restore focus on close
    const previouslyFocused = document.activeElement;

    // Move focus into modal on open
    const firstFocusable = container.querySelector(FOCUSABLE_SELECTORS);
    firstFocusable?.focus();

    function handleKeyDown(event) {
      if (event.key !== 'Tab') return;

      const focusableElements = Array.from(
        container.querySelectorAll(FOCUSABLE_SELECTORS)
      );

      if (focusableElements.length === 0) {
        event.preventDefault();
        return;
      }

      const firstElement = focusableElements[0];
      const lastElement  = focusableElements[focusableElements.length - 1];

      if (event.shiftKey) {
        // Shift+Tab: if on first element, wrap to last
        if (document.activeElement === firstElement) {
          event.preventDefault();
          lastElement.focus();
        }
      } else {
        // Tab: if on last element, wrap to first
        if (document.activeElement === lastElement) {
          event.preventDefault();
          firstElement.focus();
        }
      }
    }

    document.addEventListener('keydown', handleKeyDown);

    return () => {
      document.removeEventListener('keydown', handleKeyDown);
      // Restore focus to the element that opened the modal
      if (previouslyFocused instanceof HTMLElement) {
        previouslyFocused.focus();
      }
    };
  }, [isActive]);

  return containerRef;
}

// Usage
function Modal({ isOpen, onClose, title, children }) {
  const titleId = useId();
  const dialogRef = useFocusTrap(isOpen);

  if (!isOpen) return null;

  return (
    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby={titleId}
      ref={dialogRef}
    >
      <h2 id={titleId}>{title}</h2>
      {children}
      <button onClick={onClose}>Close</button>
    </div>
  );
}`,
            )}
            <h3>Focus after navigation — React Router</h3>
            <p>When a route changes, focus remains wherever it was — often on a link that no longer exists in the same position in the new page. Screen reader users hear nothing indicating the page changed.</p>
            ${code(
              "jsx",
              `// Focus management on route change
import { useEffect, useRef } from 'react';
import { useLocation } from 'react-router-dom';

function RouteAnnouncer() {
  const location = useLocation();
  const announcerRef = useRef(null);

  useEffect(() => {
    // Move focus to the main content area on route change
    const main = document.querySelector('main');
    if (main) {
      // tabIndex={-1} makes a non-interactive element programmatically focusable
      main.setAttribute('tabindex', '-1');
      main.focus();
      // Remove tabindex so it's not in natural tab order
      main.removeAttribute('tabindex');
    }

    // Announce page change to screen readers via live region
    if (announcerRef.current) {
      announcerRef.current.textContent = '';
      // Small delay ensures screen readers pick up the change
      setTimeout(() => {
        if (announcerRef.current) {
          announcerRef.current.textContent =
            \`Navigated to \${document.title}\`;
        }
      }, 100);
    }
  }, [location.pathname]);

  return (
    // Visually hidden live region — only screen readers hear this
    <div
      ref={announcerRef}
      aria-live="polite"
      aria-atomic="true"
      style={{
        position: 'absolute',
        width: '1px',
        height: '1px',
        overflow: 'hidden',
        clip: 'rect(0,0,0,0)',
        whiteSpace: 'nowrap',
      }}
    />
  );
}`,
            )}

            <h2>Live Regions — Dynamic Content Announcements</h2>
            <p>When content changes dynamically — a notification appears, search results update, a status changes — screen readers won't announce it unless you use a live region. Live regions are elements that screen readers monitor for changes and announce automatically.</p>
            ${code(
              "jsx",
              `// aria-live="polite" — announces after current speech finishes
// aria-live="assertive" — interrupts current speech immediately
// Use polite for almost everything; assertive only for urgent errors

function SearchResults({ query, results, isLoading }) {
  return (
    <div>
      <input
        type="search"
        value={query}
        aria-label="Search products"
      />

      {/* Live region announces result count changes */}
      <div
        role="status"               // implicit aria-live="polite"
        aria-live="polite"
        aria-atomic="true"          // announce the whole region, not just the change
      >
        {isLoading
          ? 'Searching...'
          : \`\${results.length} results found\`
        }
      </div>

      <ul aria-label="Search results">
        {results.map(r => <li key={r.id}>{r.name}</li>)}
      </ul>
    </div>
  );
}

// Toast notification system with live region
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);

  const addToast = useCallback((message, type = 'info') => {
    const id = crypto.randomUUID();
    setToasts(prev => [...prev, { id, message, type }]);
    setTimeout(() => {
      setToasts(prev => prev.filter(t => t.id !== id));
    }, 5000);
  }, []);

  return (
    <ToastContext.Provider value={addToast}>
      {children}
      {/* assertive for errors — polite for everything else */}
      <div
        aria-live="assertive"
        aria-atomic="false"
        style={{ position: 'absolute', top: 0, right: 0 }}
      >
        {toasts
          .filter(t => t.type === 'error')
          .map(t => <Toast key={t.id} toast={t} />)
        }
      </div>
      <div
        aria-live="polite"
        aria-atomic="false"
        style={{ position: 'absolute', top: 0, right: 0 }}
      >
        {toasts
          .filter(t => t.type !== 'error')
          .map(t => <Toast key={t.id} toast={t} />)
        }
      </div>
    </ToastContext.Provider>
  );
}`,

            <h2>Keyboard Navigation Patterns — The ARIA Authoring Practices</h2>
            <p>Keyboard behavior for custom components has defined specifications in the ARIA Authoring Practices Guide. The most common patterns:</p>
            <h3>The roving tabindex pattern — for widget internals</h3>
            <p>A widget (toolbar, listbox, menu) presents itself as a single Tab stop. Arrow keys navigate within it. This prevents users from having to Tab through every item in a large list.</p>
            ${code(
              "jsx",
              `function Listbox({ options, value, onChange }) {
  const [activeIndex, setActiveIndex] = useState(
    options.findIndex(o => o.value === value)
  );
  const listRef = useRef(null);
  const listId = useId();

  const handleKeyDown = (event) => {
    switch (event.key) {
      case 'ArrowDown':
        event.preventDefault();
        setActiveIndex(i => Math.min(i + 1, options.length - 1));
        break;
      case 'ArrowUp':
        event.preventDefault();
        setActiveIndex(i => Math.max(i - 1, 0));
        break;
      case 'Home':
        event.preventDefault();
        setActiveIndex(0);
        break;
      case 'End':
        event.preventDefault();
        setActiveIndex(options.length - 1);
        break;
      case 'Enter':
      case ' ':
        event.preventDefault();
        onChange(options[activeIndex].value);
        break;
    }
  };

  // Move focus to active item when activeIndex changes
  useEffect(() => {
    const items = listRef.current?.querySelectorAll('[role="option"]');
    items?.[activeIndex]?.focus();
  }, [activeIndex]);

  return (
    <ul
      ref={listRef}
      role="listbox"
      id={listId}
      aria-label="Options"
      onKeyDown={handleKeyDown}
    >
      {options.map((option, index) => (
        <li
          key={option.value}
          role="option"
          aria-selected={option.value === value}
          // Roving tabindex: only active item is in tab order
          tabIndex={index === activeIndex ? 0 : -1}
          onClick={() => {
            setActiveIndex(index);
            onChange(option.value);
          }}
        >
          {option.label}
        </li>
      ))}
    </ul>
  );
}`,
            )}
            <h3>The Escape key — universal close pattern</h3>
            <p>Every disclosure widget, modal, popover, and dropdown must close on Escape. This is a universal keyboard convention:</p>
            ${code(
              "jsx",
              `function useEscapeKey(handler, isActive = true) {
  useEffect(() => {
    if (!isActive) return;

    const handleKeyDown = (event) => {
      if (event.key === 'Escape') {
        event.stopPropagation(); // prevent outer modals from also closing
        handler();
      }
    };

    document.addEventListener('keydown', handleKeyDown);
    return () => document.removeEventListener('keydown', handleKeyDown);
  }, [handler, isActive]);
}

// Usage
function Dropdown({ isOpen, onClose, children }) {
  useEscapeKey(onClose, isOpen);
  // ...
}`,

  const [errors, setErrors] = useState({});
  const nameId     = useId();
  const emailId    = useId();
  const nameErrId  = useId();
  const emailErrId = useId();
  const formStatusId = useId();

    <form
      noValidate               // use our validation, not browser's
      onSubmit={handleSubmit}
      aria-describedby={formStatusId}

        aria-live="polite"
        aria-atomic="true"

          name="name"
          type="text"
          required
          aria-required="true"
          aria-invalid={Boolean(errors.name)}

          aria-invalid={Boolean(errors.email)}
          aria-describedby={errors.email ? emailErrId : undefined}
          autoComplete="email"
        />

          <p id={emailErrId} role="alert">
            {errors.email}
          </p>

            <h3>The real test — manual verification</h3>
            <p>Automated tools catch roughly 30-40% of accessibility issues. The rest requires manual testing:</p>
            <p><strong>Keyboard-only navigation:</strong> Unplug or ignore your mouse. Navigate the entire feature using only Tab, Shift+Tab, Enter, Space, Arrow keys, and Escape. Every interactive element must be reachable and operable.</p>
            <p><strong>Screen reader testing:</strong> The three primary screen readers cover 95%+ of users. Test with at least one:</p>
            <ul>
              <li>NVDA (Windows, free) — most widely used among blind users</li>
              <li>VoiceOver (macOS/iOS, built-in) — press Cmd+F5 to toggle</li>
              <li>JAWS (Windows, paid) — enterprise standard</li>
            </ul>
            <p>For each screen reader, verify: page title announced on load, headings outline makes sense when navigating by headings, form labels read correctly, errors announced, live regions fire, modal focus trapping works.</p>
            <p><strong>Zoom testing:</strong> Zoom to 200% and 400%. Content should reflow, not overflow. Horizontal scrolling at normal zoom is a WCAG failure.</p>

          body: () => `
            <h2>What a Design System Actually Is</h2>
            <p>A design system is not a component library. This distinction matters because it changes what you build and how you build it.</p>
            <p>A component library is a collection of UI components. A design system is the single source of truth for how your product looks, feels, and behaves — it includes the visual language (tokens), the behavioral patterns (components), the documentation (Storybook), the accessibility standards, and the governance process that keeps everything consistent over time.</p>
            <p>The component library is one artifact of the design system, not the system itself.</p>
            <p>Senior developers building design systems face a specific set of challenges that don't appear in product work: components must work across unknown contexts, tokens must be consumable by both designers and developers, APIs must be stable enough that breaking changes don't cascade across dozens of consuming teams, and the system must be maintainable by people who didn't build it.</p>

            <h2>Design Tokens — The Foundation Layer</h2>
            <p>Design tokens are the named, semantic values that encode your visual language. Not #5B4EE8, but color.brand.primary. Not 16px, but space.4. Not font-size: 24px; font-weight: 700, but typography.heading.xl.</p>
            <p>The distinction matters for three reasons. Tokens are semantic — they express intent, not raw values. Tokens are synchronizable — a single source of truth that tools can consume (Figma, CSS, JavaScript, native). Tokens are themeable — swap a token set and the entire product theme changes without touching component code.</p>
            <h3>Token taxonomy</h3>
            ${code(
              "txt",
              `Global tokens (primitives):
  color.blue.500 = #3B82F6
  space.4 = 16px
  font.size.base = 16px

Semantic tokens (aliases):
  color.interactive.default → color.blue.500
  color.interactive.hover   → color.blue.600
  space.component.padding   → space.4
  font.size.body            → font.size.base

Component tokens (component-specific):
  button.padding.horizontal → space.component.padding
  button.color.background   → color.interactive.default
  button.color.hover        → color.interactive.hover`,
            )}
            <p>Three layers: primitives define the palette, semantic tokens give primitives meaning, component tokens apply semantic tokens to specific components. This layering means a rebrand touches only the semantic layer — components automatically update.</p>

            <h2>Component Architecture — Building on Radix UI</h2>
            <p>Radix UI provides unstyled, accessible primitives for complex interactive components. Using Radix as your foundation means you don't implement focus trapping, keyboard navigation, ARIA attributes, or state management for dialogs, dropdowns, tooltips, and menus — Radix handles all of that. You only write styles.</p>
            <p>This is the same approach taken by Shadcn/ui, Radix Themes, and many production design systems.</p>
            ${code("bash", `npm install @radix-ui/react-dialog @radix-ui/react-dropdown-menu @radix-ui/react-tooltip`)}
            <h3>Building a Dialog component on Radix</h3>
            ${code(
              "tsx",
              `// components/Dialog/Dialog.tsx
import * as RadixDialog from '@radix-ui/react-dialog';
import { type ReactNode } from 'react';
import styles from './Dialog.module.css';

interface DialogProps {
  trigger: ReactNode;
  title: string;
  description?: string;
  children: ReactNode;
  open?: boolean;
  onOpenChange?: (open: boolean) => void;
}

// Design system Dialog wraps Radix Dialog
// Consumers use our API — Radix implementation is invisible
export function Dialog({
  trigger,
  title,
  description,
  children,
  open,
  onOpenChange,
}: DialogProps) {
  return (
    <RadixDialog.Root open={open} onOpenChange={onOpenChange}>
      <RadixDialog.Trigger asChild>
        {trigger}
      </RadixDialog.Trigger>

      <RadixDialog.Portal>
        {/* Overlay — Radix handles click-outside-to-close */}
        <RadixDialog.Overlay className={styles.overlay} />

        {/* Content — Radix handles focus trap, Escape key, aria-modal */}
        <RadixDialog.Content className={styles.content}>
          <RadixDialog.Title className={styles.title}>
            {title}
          </RadixDialog.Title>

          {description && (
            <RadixDialog.Description className={styles.description}>
              {description}
            </RadixDialog.Description>
          )}

          {children}

          <RadixDialog.Close asChild>
            <button
              className={styles.closeButton}
              aria-label="Close dialog"
            >
              ✕
            </button>
          </RadixDialog.Close>
        </RadixDialog.Content>
      </RadixDialog.Portal>
    </RadixDialog.Root>
  );
}

// Dialog.module.css
// .overlay {

            <h3>Building a Dropdown Menu</h3>
            ${code(
              "tsx",
              `// components/DropdownMenu/DropdownMenu.tsx
import * as RadixDropdown from '@radix-ui/react-dropdown-menu';
import styles from './DropdownMenu.module.css';

interface MenuItem {
  label: string;
  icon?: React.ReactNode;
  shortcut?: string;
  onSelect: () => void;
  disabled?: boolean;
  destructive?: boolean;
}

interface MenuGroup {
  label?: string;
  items: MenuItem[];
}

interface DropdownMenuProps {
  trigger: React.ReactNode;
  groups: MenuGroup[];
  align?: 'start' | 'center' | 'end';
}

export function DropdownMenu({ trigger, groups, align = 'end' }: DropdownMenuProps) {
  return (
    <RadixDropdown.Root>
      <RadixDropdown.Trigger asChild>
        {trigger}
      </RadixDropdown.Trigger>

      <RadixDropdown.Portal>
        <RadixDropdown.Content
          className={styles.content}
          align={align}
          sideOffset={8}
          // Radix handles: keyboard navigation, focus management,
          // closing on outside click, Escape key, ARIA
        >
          {groups.map((group, groupIndex) => (
            <RadixDropdown.Group key={groupIndex}>
              {group.label && (
                <RadixDropdown.Label className={styles.groupLabel}>
                  {group.label}
                </RadixDropdown.Label>
              )}

              {group.items.map((item, itemIndex) => (
                <RadixDropdown.Item
                  key={itemIndex}
                  className={\`\${styles.item} \${
                    item.destructive ? styles.destructive : ''
                  }\`}
                  disabled={item.disabled}
                  onSelect={item.onSelect}
                >
                  {item.icon && (
                    <span className={styles.itemIcon} aria-hidden>
                      {item.icon}
                    </span>
                  )}
                  {item.label}
                  {item.shortcut && (
                    <RadixDropdown.ItemIndicator asChild>
                      <span className={styles.shortcut} aria-hidden>
                        {item.shortcut}
                      </span>
                    </RadixDropdown.ItemIndicator>
                  )}
                </RadixDropdown.Item>
              ))}

              {groupIndex < groups.length - 1 && (
                <RadixDropdown.Separator className={styles.separator} />
              )}
            </RadixDropdown.Group>
          ))}
        </RadixDropdown.Content>
      </RadixDropdown.Portal>
    </RadixDropdown.Root>
  );
}`,
            )}
            <h3>The asChild pattern — composition without wrapper elements</h3>
            <p>Radix's asChild prop merges the Radix component's behavior onto its child rather than rendering an extra DOM element. This is how you avoid wrapper div soup:</p>
            ${code(
              "tsx",
              `// Without asChild: Radix wraps your element in its own element
<RadixDialog.Trigger>
  <Button>Open</Button>
</RadixDialog.Trigger>
// Renders: <button (radix)><button (your Button)>Open</button></button>
// Two nested buttons — invalid HTML, broken accessibility

// With asChild: Radix behavior merges onto your element
<RadixDialog.Trigger asChild>
  <Button>Open</Button>
</RadixDialog.Trigger>
// Renders: <button (your Button with Radix behavior)>Open</button>
// One button — correct

// This works for any trigger component
<RadixDropdown.Trigger asChild>
  <IconButton aria-label="Options" />
</RadixDropdown.Trigger>

<RadixTooltip.Trigger asChild>
  <Link href="/help">Help</Link>
</RadixTooltip.Trigger>`,
            )}
